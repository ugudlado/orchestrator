# Model pricing — $/1M tokens, input/output/cache_read.
# Single source of truth. Consumed by:
#   - config/scripts/estimate-cost.sh  (pre-flight preview)
#   - scripts/inline/compute-swe-metrics.sh  (post-flight cost)
#
# Keys match model strings as they appear in:
#   - routes.yaml `models.<backend>.model`
#   - Claude Code session JSONL `message.model`
#   - LiteLLM proxy cost lookup
#
# Add a new model here; both consumers pick it up without code changes.
# Local models are free and marked `local: true` so the estimator can skip
# rendering their prices as dollar amounts.

models:
  # ── Anthropic native (Claude Code) ──────────────────────────────────────
  # cache_creation = input × 1.25 (Anthropic 5-min TTL writes; 1h TTL is 2×).
  claude-opus-4-7:
    input: 15.00
    output: 75.00
    cache_read: 1.50
    cache_creation: 18.75
  claude-opus-4-6:
    input: 15.00
    output: 75.00
    cache_read: 1.50
    cache_creation: 18.75
  claude-opus-4-5:
    input: 15.00
    output: 75.00
    cache_read: 1.50
    cache_creation: 18.75
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_creation: 3.75
  claude-sonnet-4-5:
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_creation: 3.75
  claude-haiku-4-5:
    input: 0.80
    output: 4.00
    cache_read: 0.08
    cache_creation: 1.00
  # Anthropic returns date-suffixed model ids via Claude Code JSONLs (e.g.
  # claude-haiku-4-5-20251001). List the alias explicitly so the lookup
  # matches without a regex stripper. Add new dated aliases here as they appear.
  claude-haiku-4-5-20251001:
    input: 0.80
    output: 4.00
    cache_read: 0.08
    cache_creation: 1.00

  # ── OpenRouter ──────────────────────────────────────────────────────────
  qwen/qwen3-coder-30b-a3b-instruct:
    input: 0.25
    output: 1.00
    cache_read: 0.25

  # ── Local (self-hosted, zero marginal cost) ─────────────────────────────
  coder:
    input: 0.00
    output: 0.00
    cache_read: 0.00
    local: true

# Fallback when a model string isn't found above. Conservative (opus-tier) so
# missing pricing shows up as an overestimate rather than a silent zero.
default:
  input: 15.00
  output: 75.00
  cache_read: 1.50
  cache_creation: 18.75
