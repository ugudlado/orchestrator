# Runtime agent routing overlay (optional).
# Pass to orchestrator run:
#   orchestrator run ORC-84 --agents-config ./agents.config.yaml
#   orchestrator run ORC-84 agents.config=./agents.config.yaml
#
# Same shape as the `agents:` block in config/agents.yaml.
# Fields here override agents.yaml for this run only; CLI agent.<role>.<field>=
# flags still win over this file.

agents:
  developer: { model: auto, subprocess: cursor }
  # developer: { model: sonnet, subprocess: pi }
  reviewer: { model: sonnet, subprocess: claude }
