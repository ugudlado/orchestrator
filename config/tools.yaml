version: 1
tools:
  claude:
    binary: claude
    # {prompt} is substituted with the full prompt text
    args_template: ["-p", "{prompt}"]
    stdin: none
    capture: stdout

  pi:
    binary: pi
    # Non-interactive: use saved ~/.pi/agent/settings.json (provider/model) + @prompt file.
    args_template: ["@{prompt_file}", "-p", "."]
    stdin: none
    capture: stdout

  codex:
    binary: codex
    # {prompt} is substituted with the full prompt text
    args_template: ["exec", "--prompt", "{prompt}"]
    stdin: none
    capture: stdout

  cursor:
    binary: cursor
    # Cursor Agent CLI (non-interactive). Requires `cursor agent` on PATH.
    # {model_tier} comes from routes.yaml agents.<role>.model (e.g. auto).
    # Agent must emit a COMPLETION: YAML block on stdout for parse-completion.py.
    args_template: ["agent", "--print", "--force", "--output-format", "text", "--model", "{model_tier}", "{prompt}"]
    stdin: none
    capture: stdout
