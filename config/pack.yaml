# Bundled config pack — the default checkout's workflows/ + steps/, treated
# as the pre-installed "core" pack (docs/pack-convention.md, protocol 1).
#
# This file is metadata only; `orchestrator pack list` reads it to surface
# core alongside any packs installed via `orchestrator pack add`. It is not
# itself copied by `pack add` (only workflows/ and steps/ are).
name: core
version: "1.0.0"
protocol: 1
description: >
  The engine's default workflow schemas and step contracts — design,
  implement, feature, bugfix, patch, autopilot, complete. Ships inside the
  checkout/wheel and is pre-installed wherever ORCHESTRATOR_CONFIG points at
  this config/ dir.
