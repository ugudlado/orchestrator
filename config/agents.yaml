# Agent routing + spin-up — single source of truth for how an agent is routed
# to a model, which subprocess tool runs it, how that tool is invoked, and the
# Pi-specific overrides applied at install time.
#
# NOTE: agent *identity* (system prompt) stays in skills/<name>/SKILL.md.
# This file owns execution config: model, subprocess, and tools.
#
# Consumers:
#   - orchestrator_next/pricing.py                       (agents, models)
#   - orchestrator_next/scripts/metrics/estimate-cost.sh (preview-route step)
#   - ui/dashboard/server.py                             (agents, models)
#   - orchestrator_next/scripts/lib/agent-routes.sh       (agents)
#   - orchestrator_next/scripts/run-workflow.sh          (agents, tools)

# ── Agent routing ──────────────────────────────────────────────────
# model:      in-process sub-agent model tier (used by Claude Code host)
# subprocess: tool binary for shell loop (run-workflow.sh) — see tools: below
agents:
  # tools: Read Write Edit Grep Glob Bash WebSearch WebFetch SendMessage
  #        mcp__plugin_context7_context7__resolve-library-id mcp__plugin_context7_context7__query-docs
  #        mcp__pal__thinkdeep mcp__pal__consensus
  architect:         { model: opus,   subprocess: claude }

  # tools: Read Write Grep Glob Bash Skill WebSearch WebFetch
  #        mcp__plugin_context7_context7__resolve-library-id mcp__plugin_context7_context7__query-docs
  #        mcp__chrome-devtools__take_screenshot mcp__chrome-devtools__navigate_page
  #        mcp__drawio__open_drawio_mermaid mcp__drawio__open_drawio_csv
  #        mcp__plugin_claude-mem_mcp-search__search mcp__plugin_claude-mem_mcp-search__get_observations
  #        mcp__plugin_claude-mem_mcp-search__timeline
  ideator:           { model: opus,   subprocess: claude }

  # tools: Read Write Edit Grep Glob Bash
  #        mcp__chrome-devtools__take_screenshot mcp__chrome-devtools__navigate_page
  #        mcp__chrome-devtools__get_console_message mcp__chrome-devtools__list_console_messages
  #        mcp__chrome-devtools__evaluate_script mcp__pal__codereview mcp__pal__consensus
  reviewer:          { model: sonnet, subprocess: claude }

  # subprocess: cursor-agent CLI; model=auto → cursor-agent -p --model auto
  # Override per run: orchestrator run <id> agent.developer.subprocess=pi
  # tools: Read Write Edit Grep Glob Bash WebSearch WebFetch
  #        mcp__plugin_context7_context7__resolve-library-id mcp__plugin_context7_context7__query-docs
  #        mcp__chrome-devtools__take_screenshot mcp__chrome-devtools__navigate_page
  #        mcp__chrome-devtools__get_console_message mcp__chrome-devtools__evaluate_script
  #        mcp__plugin_claude-mem_mcp-search__search mcp__plugin_claude-mem_mcp-search__get_observations
  developer:         { model: auto,   subprocess: cursor }

  # tools: Read Write Grep Glob Bash WebSearch WebFetch
  #        mcp__plugin_context7_context7__resolve-library-id mcp__plugin_context7_context7__query-docs
  #        mcp__plugin_claude-mem_mcp-search__search mcp__plugin_claude-mem_mcp-search__get_observations
  discoverer:        { model: sonnet, subprocess: claude }

  # tools: Read Write Edit Grep Glob Bash WebSearch
  #        mcp__plugin_claude-mem_mcp-search__search mcp__plugin_claude-mem_mcp-search__get_observations
  workflow-learner:  { model: sonnet, subprocess: claude }

  # tools: Read Grep Glob
  #        mcp__chrome-devtools__take_screenshot mcp__chrome-devtools__navigate_page
  #        mcp__chrome-devtools__get_console_message mcp__chrome-devtools__list_console_messages
  #        mcp__chrome-devtools__evaluate_script mcp__chrome-devtools__emulate
  #        mcp__chrome-devtools__resize_page mcp__chrome-devtools__lighthouse_audit
  ux-reviewer:       { model: sonnet, subprocess: claude }

  sonnet-agent:      { model: sonnet, subprocess: claude }
  haiku-agent:       { model: haiku,  subprocess: claude }

# ── Model backends — map model tier to concrete model-id ───────────
# Keys match agents.<agent>.model values above
models:
  opus:   claude-opus-4-7
  sonnet: claude-sonnet-4-6
  haiku:  claude-haiku-4-5
  auto:   auto   # Cursor CLI model id (Cursor picks best fit)

# ── Subprocess tool invocation (shell loop: run-workflow.sh) ───────
tools:
  claude:
    binary: claude
    # {prompt} is substituted with the full prompt text
    args_template: ["--model", "{model_tier}", "-p", "--output-format", "json", "{prompt}"]
    stdin: none
    capture: stdout

  pi:
    binary: pi
    # Non-interactive: use saved ~/.pi/agent/settings.json (provider/model) + @prompt file.
    args_template: ["@{prompt_file}", "-p", "."]
    stdin: none
    capture: stdout

  codex:
    binary: codex
    # {prompt} is substituted with the full prompt text
    args_template: ["exec", "--json", "--prompt", "{prompt}"]
    stdin: none
    capture: stdout

  cursor:
    binary: cursor-agent
    # Cursor Agent CLI (non-interactive). Requires `cursor-agent` on PATH.
    # {model_tier} comes from agents.<role>.model (e.g. auto).
    # Agent must emit a COMPLETION: YAML block on stdout for parse-completion.py.
    args_template: ["-p", "--output-format", "json", "--model", "{model_tier}", "{prompt}"]
    stdin: none
    capture: stdout

  omp:
    binary: omp
    # {prompt} is substituted with the full prompt text
    args_template: ["--mode=json", "--model", "gemini-2.0-flash", "{prompt}"]
    stdin: none
    capture: stdout

# ── Pi subagent overrides (applied by sync_pi_agents.py at install) ─
# Source of truth for prompts remains skills/<name>/SKILL.md (Claude/Cursor format).
pi:
  defaults:
    systemPromptMode: replace
    inheritProjectContext: true
    inheritSkills: false

  # Claude tool name -> Pi builtin tool name
  tool_map:
    Read: read
    Write: write
    Edit: edit
    Grep: grep
    Glob: find
    Bash: bash
    WebSearch: web_search
    WebFetch: fetch_content

  # Claude-only tools dropped during conversion
  skip_tools:
    - Skill
    - SendMessage

  # Claude mcp__server__tool -> Pi mcp:server/tool direct tool entries
  mcp_tool_map:
    mcp__plugin_context7_context7__resolve-library-id: mcp:plugin-context7-context7/resolve-library-id
    mcp__plugin_context7_context7__query-docs: mcp:plugin-context7-context7/query-docs

  agents:
    reviewer:
      inheritProjectContext: false
      defaultContext: fresh
    ux-reviewer:
      inheritProjectContext: false
      defaultContext: fresh
      extra_tools:
        - mcp:cursor-ide-browser
