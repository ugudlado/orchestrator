id: archive-completed-change
inline: true
run: scripts/inline/archive-completed-change.sh
version: 6

intent: Copy completed change artifacts to the repo archive and commit.


inputs:
  - swe_metrics
  - project_storage_config

rules:
  - Source from active root ($WORKFLOW_STATE_DIR/$CHANGE_ID).
  - Archive to repo (spec/changes/archive/YYYY-MM-DD-<change-id>).
  - Preserve .spec.yaml, all generated artifacts, and state.yaml (with metrics).
  - "state.yaml MUST already contain status: completed, completed_at, archive_path,
    and metrics — these are written by mark-change-completed and compute-swe-metrics
    steps that run before this step. Do NOT rewrite them here."
  - Cleanup failure is non-blocking — the archive is the priority.

instruction: |
  1. Read storage config from project.yaml:
     - active_changes_root: $WORKFLOW_STATE_DIR
     - repo_archive_root: spec/changes/archive

  2. Create archive directory: spec/changes/archive/YYYY-MM-DD-$CHANGE_ID/
     where YYYY-MM-DD is the date portion of state.yaml `completed_at`.
     (Do not derive the date independently — read it from state.yaml to stay
     consistent with the path recorded in `archive_path`.)

  3. Copy all artifacts from $WORKFLOW_STATE_DIR/$CHANGE_ID/ to archive:
     - .spec.yaml (change metadata)
     - All generated artifacts (spec.md, design.md, tasks.md, etc.)
     - state.yaml (workflow audit trail — already has metrics + completion status)

  4. Commit the archive to the repo.

  5. Clean up the active change directory ($WORKFLOW_STATE_DIR/$CHANGE_ID/).
     If cleanup fails (permission error, file lock), log a warning but do not
     fail — the archive is already committed.

  5.5. Remove the backlog entry if present: spec/changes/backlog/$CHANGE_ID/.
     Use `git rm -r` to stage the deletion, then commit as
     "cleanup: remove $CHANGE_ID from backlog". This step is idempotent —
     if no backlog entry exists, skip silently. Cleanup failure is non-blocking.

  6. Update state.yaml step_history per CONVENTIONS.md § State Updates.

verify:
  - Archive directory exists in repo at spec/changes/archive/
  - All artifacts copied from active change dir to archive
  - state.yaml in archive contains `status: completed` (written by mark-change-completed)
  - state.yaml in archive contains a `metrics:` block (written by compute-swe-metrics)

outputs:
  - archive_record
