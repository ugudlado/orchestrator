id: archive-completed-change
version: 5

intent: Archive completed change artifacts to the repo.

agent: developer

inputs:
  - swe_metrics
  - project_storage_config

rules:
  - Source from active root ($WORKFLOW_STATE_DIR/$CHANGE_ID).
  - Archive to repo (spec/changes/archive/YYYY-MM-DD-<change-id>).
  - Preserve .spec.yaml, all generated artifacts, and state.yaml (with metrics).
  - state.yaml MUST already contain metrics (from compute-swe-metrics step).
  - Cleanup failure is non-blocking — the archive is the priority.

instruction: |
  1. Read storage config from project.yaml:
     - active_changes_root: $ORCHESTRATOR_HOME/changes/$REPO_NAME
     - repo_archive_root: spec/changes/archive

  2. Update state.yaml per State Field Registry (CONVENTIONS.md):
     - Set `status: completed`
     - Set `archive_path: spec/changes/archive/YYYY-MM-DD-$CHANGE_ID/`
     This MUST happen before the archive copy so the archived state.yaml
     reflects the final completion status.

  3. Create archive directory: spec/changes/archive/YYYY-MM-DD-$CHANGE_ID/

  4. Copy all artifacts from $WORKFLOW_STATE_DIR/$CHANGE_ID/ to archive:
     - .spec.yaml (change metadata)
     - All generated artifacts (spec.md, design.md, tasks.md, etc.)
     - state.yaml (workflow audit trail — includes metrics + completion status)

  5. Commit the archive to the repo.

  6. Clean up the active change directory ($WORKFLOW_STATE_DIR/$CHANGE_ID/).
     If cleanup fails (permission error, file lock), log a warning but do not
     fail — the archive is already committed.

  7. Update state.yaml step_history per CONVENTIONS.md § State Updates.

verify:
  - Archive directory exists in repo at spec/changes/archive/
  - All artifacts copied from active change dir to archive
  - state.yaml in archive contains `status: completed` and a `metrics:` block

outputs:
  - archive_record
