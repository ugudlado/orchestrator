id: register-with-orchestrator-home
version: 1

intent: >
  Append the bootstrapped repo to the cross-repo metrics registry
  ($ORCHESTRATOR_HOME/metrics-registry.yaml) and ingest all archived
  state.yaml files into the DuckDB features table
  ($ORCHESTRATOR_HOME/metrics.duckdb). Non-blocking — bootstrap continues
  even if the script exits non-zero.

inputs:
  - name: ORCHESTRATOR_HOME
    description: Path to the orchestrator installation (env var, required)
  - name: REPO_ROOT
    description: Absolute path of the repo being bootstrapped (env var or git rev-parse)
  - name: METRICS_DB
    description: "Optional override for DB path (default: $ORCHESTRATOR_HOME/metrics.duckdb)"

instruction: |
  Run the metrics registration script from the orchestrator home:

    ORCHESTRATOR_HOME="$ORCHESTRATOR_HOME" \
    REPO_ROOT="$REPO_ROOT" \
    bash "$ORCHESTRATOR_HOME/config/scripts/register-repo.sh"

  The script handles its own preflight (yq + duckdb presence checks) and exits 0
  if tools are missing. Capture the exit code but do NOT abort bootstrap on failure.
  If the script exits non-zero (e.g., due to DuckDB exclusive-lock contention from a
  concurrent bootstrap), log the exit code as a warning and proceed to the next step.
  If duckdb exits non-zero, bootstrap continues.

verify:
  non_blocking: true
  note: >
    Non-blocking design: all assertions are warn-level. A missing yq or duckdb binary
    causes the script to skip cleanly (exit 0). DuckDB exclusive-lock contention
    (two simultaneous bootstraps) may cause a non-zero exit; bootstrap proceeds
    regardless. The registry and DB are best-effort side effects of bootstrap.
    If duckdb exits non-zero, bootstrap continues.
  failure_policy: "if duckdb exits non-zero, bootstrap continues"
  assertions:
    - description: metrics-registry.yaml contains an entry for the repo
      check: "grep -Fxq -- '  - $REPO_ROOT' \"$ORCHESTRATOR_HOME/metrics-registry.yaml\""
      on_fail: warn
    - description: features table has rows for the repo (or ingested=0 on empty archive)
      check: "duckdb \"$ORCHESTRATOR_HOME/metrics.duckdb\" \"SELECT count(*) FROM features WHERE repo_root = '$REPO_ROOT'\""
      on_fail: warn

outputs:
  - name: registry_path
    value: "$ORCHESTRATOR_HOME/metrics-registry.yaml"
  - name: db_path
    value: "$ORCHESTRATOR_HOME/metrics.duckdb"
  - name: description
    value: >
      The registry is a flat YAML sequence of absolute repo paths.
      The DB contains a features table keyed on (repo_root, change_id)
      with typed columns: schema, status, started_at, completed_at, payload_json,
      ingested_at. Query with: duckdb "$ORCHESTRATOR_HOME/metrics.duckdb" "SELECT ..."
