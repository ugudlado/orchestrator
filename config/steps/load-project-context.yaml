id: load-project-context
version: 2

intent: Load project config from project.yaml, schema definition, and build runtime context for current phase.

inputs:
  - state.yaml (schema, flags, phase)
  - $REPO_ROOT/spec/project.yaml

rules:
  - Always load project config before executing phase steps.
  - Merge schema defaults with resolved flags to compute runtime profile.
  - Read only files needed by current phase.
  - If project.yaml is missing, STOP with error — run /develop --bootstrap first.

instruction: |
  1. Read $REPO_ROOT/spec/project.yaml. If it does not exist, STOP with error:
     "spec/project.yaml not found. Run /develop --bootstrap to initialize."

  2. Load project context sections:
     - vision (purpose, target_users, valuable_means, direction)
     - architecture (overview, structure)
     - gotchas (list)
     - learnings (list with id, learned date, rule)
     - context (tech_stack, conventions)
     - verify_commands
     - quality_bar (scoring thresholds)
     - rules (named rules with id, rule, optional when)
     - signoff_policy

  3. Read $ORCHESTRATOR_HOME/config/workflows/$SCHEMA.yaml for schema rules, phase definitions, and outputs.

  4. Compute runtime feature profile by merging schema defaults with state.flags.
     Then apply ux_design auto-detection:
     a. Check whether `ux_design` was explicitly set via a CLI flag (e.g., --no-ux
        or any flag that directly sets ux_design). If it was, skip auto-detection
        and keep the explicit value.
     b. If ux_design was NOT explicitly set, read `tech_stack` from project.yaml
        and check for any known frontend technology:
          react, nextjs, next, vue, svelte, angular, html, css, tailwind,
          scss, sass, less, webpack, vite, typescript-frontend, flutter, swift-ui
        If none of the tech_stack entries match this list, set `ux_design: false`
        in the resolved flags.
        # Heuristic: a project with no frontend tech never needs UX design steps.
        # To override, pass --no-ux false (or the equivalent explicit flag) on the
        # CLI — that takes precedence and skips this auto-detection entirely.

  5. Write or validate workflow_plan in state.yaml (per CONVENTIONS.md § State Field Registry):
     a. If workflow_plan does NOT exist in state.yaml (fresh start):
        Build the full workflow_plan from the loaded schema: for each phase, record
        the active step list (steps that pass if: conditions given resolved flags)
        and the filtered step list (steps excluded by if: conditions).
        IMPORTANT: Resolve `include:` directives NOW — read the included file
        (e.g., `_complete-phase.yaml`) and inline its steps into workflow_plan.
        The workflow_plan in state.yaml is the EXHAUSTIVE dispatch manifest.
        The dispatch loop MUST walk every phase and every active step in this plan
        before the workflow is considered complete. No phase may be skipped.
        Write to state.yaml:
        ```yaml
        workflow_plan:
          <phase_name>:
            active: [<step_id>, ...]
            filtered: [<step_id>, ...]
        ```
     b. If workflow_plan already exists in state.yaml (resume):
        Validate the existing plan against the current schema and resolved flags.
        If any active step is now filtered (or vice versa), log a warning:
        "workflow_plan drift detected: <step_id> changed from <old> to <new>"
        Do NOT overwrite the plan — preserve the original for resume continuity.
        Surface the drift warning in the context bundle for downstream steps.

  6. Merge rules per CONVENTIONS.md § Rule Merge Contract:
     Collect rules from all 5 sources (project, schema, phase, step contract,
     step entry injections), deduplicate named rules by id (higher precedence wins),
     filter by when-conditions against state.flags, and assemble in precedence order.

  7. Check existing artifacts in $WORKFLOW_STATE_DIR/$CHANGE_ID/ for progress.

  8. Evaluate `rules_when:` conditions per CONVENTIONS.md § Rules-When Evaluation.

  9. Build a context bundle containing:
     - Project vision and architecture (for agent prompts)
     - Project learnings and gotchas (for agent prompts)
     - Merged active rules (deduplicated by id, when-conditions evaluated)
     - Current phase definition (goal, rules, outputs, steps)
     - Runtime feature profile (resolved flags)
     - Artifact status (which exist, which are pending)
     - Verify commands (for phase boundary checks)
     - workflow_plan drift warnings (if any, from step 5b)

  10. Write context-loaded confirmation to state.yaml:
      ```yaml
      project_context_loaded: true
      project_context_at: <ISO timestamp>
      ```

verify:
  - Project config loaded (vision, quality_bar, rules, signoff_policy present)
  - Schema loaded (phases, steps, flags)
  - Runtime feature profile computed from merged flags
  - Active rules list has no duplicate ids
  - rules_when conditions evaluated per CONVENTIONS.md § Rules-When Evaluation
  - state.yaml contains workflow_plan with active and filtered lists for each phase
  - state.yaml contains project_context_loaded: true

outputs:
  - phase_context_bundle
  - resolved_feature_profile
