id: ingest-feature-metrics
inline: true
run: scripts/inline/ingest-feature-metrics.py
version: 1

intent: Populate feature_metrics DuckDB row from tasks.md + git log + state.yaml.

inputs:
  - change_completed_marker   # from mark-change-completed
  - project_storage_config

rules:
  - MUST run after mark-change-completed (reads completed_at).
  - MUST run before compute-swe-metrics (compute-swe-metrics queries feature_metrics).
  - Fail loud on missing tasks.md (for feature/bugfix schemas), DuckDB error.

instruction: |
  Invoke the Python step with:
    python $ORCHESTRATOR_HOME/scripts/inline/ingest-feature-metrics.py \
      "$WORKFLOW_STATE_DIR/$CHANGE_ID/state.yaml"

  Required env vars:
    ORCHESTRATOR_HOME — repo root (used to resolve config/scripts/ for imports + METRICS_DB)
    METRICS_DB        — path to metrics.duckdb (optional; defaults to $ORCHESTRATOR_HOME/metrics.duckdb)

  Exit non-zero on any error (fail loud). Record the step_history entry via
  `orchestrator done` (MUST use done, MUST NOT edit state.yaml directly).

verify:
  - feature_metrics row exists for (repo_root, change_id) after the step
  - step_history has an ingest-feature-metrics entry with status=completed

outputs:
  - feature_metrics_ingested
