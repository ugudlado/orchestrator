id: select-workflow
version: 2

intent: >
  Pre-init step. Decide which workflow schema runs based on the user's
  prompt + available schemas. Runs once at orchestrate-time, before
  state.yaml exists. Produces a recorded selection (schema, reason)
  that the orchestrate skill consumes to initialize the workflow.

# This step is invoked by skills/orchestrate before workflow init,
# NOT placed inside any workflow's `steps:` list. It has no agent
# spawn — the calling skill (or a small inline script) reads this
# contract and applies it.

inputs:
  - user_request (string — the prompt or ticket reference)
  - available_schemas (list — derived from config/workflows/*.yaml)
  - guidelines (config/guidelines.yaml — schema descriptions and triggers)
  - cli_flags (list — any --foo passed by the user)

rules:
  - Match by trigger keywords first (literal prompt substring match against guidelines.yaml triggers); use semantic match only when no trigger fires.
  - When the user passes a CLI flag that is bound to a specific schema (e.g. --bugfix on a schema that defines it), prefer that schema.
  - Resume case takes precedence — if an active state.yaml exists for this repo, do not re-select; reuse the persisted schema.
  - When two schemas tie, prefer the more specific one (bugfix > feature for a "fix" prompt).
  - Record reason as a short sentence. The selection must be inspectable.
  - When no schema matches with reasonable confidence, halt and ask the user — never default silently.

instruction: |
  1. Check for active resume state at $WORKFLOW_STATE_DIR/*/state.yaml.
     If any matches this repo with status: active, EMIT:
       schema = <state.yaml.schema>
       reason = "Resuming active workflow <change_id>."
     and STOP.

  2. Build candidate set from $ORCHESTRATOR_HOME/config/workflows/*.yaml,
     excluding files starting with `_` (include fragments).

  3b. (step 3b — Ticket ID check) If the user_request looks like a ticket ID, call
      scripts/ticket-status-check.sh <ticket-id> $REPO_ROOT and act on the
      result. Backend comes from `ticketing:` in spec/project.yaml (backlog or
      linear). Ticket ID shapes: Linear `^[A-Z]+-\d+$` (ORC-99, HL-287); Backlog
      `^task-\d+$` or numeric id (task-42, 42). Reads config/ticket-status-map.yaml
      for the status→action mapping:
        - action=halt   → print reason and checklist (if any), HALT with error.
        - action=init   → proceed to step 4 with phase hint = result.phase.
        - action=resume → locate the matching state.yaml from result.state_yaml
                          and resume as in step 1 (EMIT schema + reason + STOP).
        - action=skip   → continue to step 4 (backend unavailable or credentials missing).
      When LOCAL state.yaml matches the ticket but ticket status disagrees on
      phase, log a WARN and proceed with local state (local state wins; see D-5).

  4. Trigger match pass: read $ORCHESTRATOR_HOME/config/guidelines.yaml.
     For each schema entry, scan its description for "Triggers:" and check
     whether any trigger keyword appears literally in the user request.
     Collect candidates that fire.

  5. CLI flag pass: read $ORCHESTRATOR_HOME/config/flags.yaml `cli:` block.
     If user passed a flag defined there with a `sets.bugfix: true` or similar
     schema-binding effect, prefer the matching schema (e.g. --bugfix → bugfix
     schema even if "fix" trigger didn't fire on the prompt).

  6. Resolve:
     - If exactly one candidate → select it.
     - If multiple → apply tie-breaker rules; select the most specific.
     - If zero → fall back to semantic match against schema descriptions
       (LLM judgment over the guidelines.yaml prose). Pick the closest match
       above a confidence threshold; if no candidate is plausible, HALT
       and ask the user which schema to use.

  7. EMIT outputs:
       schema:           <chosen schema name, e.g. "feature">
       reason:           <one-sentence explanation citing trigger or flag>
       confidence:       trigger | flag | semantic | resume
       considered:       [<list of candidate schemas>]

verify:
  - schema is a string matching one of the available_schemas
  - reason is non-empty
  - confidence is one of: trigger, flag, semantic, resume

outputs:
  - schema (string)
  - reason (string)
  - confidence (enum: trigger | flag | semantic | resume)
  - considered (list of strings)
