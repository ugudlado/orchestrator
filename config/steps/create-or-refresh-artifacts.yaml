id: create-or-refresh-artifacts
version: 3

intent: Create or update the current phase's output artifacts and generate tasks.

agent: architect

inputs:
  - phase_context_bundle (includes phase outputs definition)
  - ux-artifacts.yaml (optional, per CONVENTIONS.md § UX Artifact Contract)

flags_read:
  - name: tdd_required
    effect: "Every implementation task must have a preceding test task"

rules:
  - Follow output dependency order from the schema phase definition.
  - Artifacts with no `requires:` may be generated in any order.
  - Artifacts with `requires: [X, Y]` must not generate until X and Y exist on disk.
  - Detect cycles: if artifact A requires B and B requires A (directly or transitively), STOP and report the cycle.
  - Keep artifact content traceable to accepted requirements.
  - Avoid implementation details in spec/design — those belong in tasks.
  - Tasks must be small, verifiable, and ordered.
  - Attach verification criteria per task.
  - Output MUST follow the Task Format Contract in CONVENTIONS.md § Task Format Contract.

instruction: |
  ## Part 1: Artifacts

  1. Read the current phase's `outputs:` from the schema.
  2. For each output file (in dependency order), determine action:
     - **Missing**: file does not exist in $WORKFLOW_STATE_DIR/$CHANGE_ID/ → generate.
     - **Stale**: file exists but state.yaml records a review rejection or
       `refresh_artifacts: true` for this phase → regenerate.
     - **Current**: file exists and no refresh signal → skip.
  3. For each file needing generation:
     a. Read the template from $ORCHESTRATOR_HOME/config/templates/$SCHEMA/<template>.
     b. Read the artifact's format contract from CONVENTIONS.md:
        - spec.md → § Specification Format Contract
        - design.md → § Design Format Contract
        - diagnosis.md → § Diagnosis Format Contract
        - fix-plan.md → § Fix Plan Format Contract
     c. Generate the artifact using available context as input, following
        the format contract's required sections and field rules:
        - If discovery/diagnosis artifact exists: use it as primary input.
        - If no discovery context (e.g., chore/spike schemas): generate
          directly from the change description in state.yaml.
     d. Write the artifact to $WORKFLOW_STATE_DIR/$CHANGE_ID/<file>.
  4. Verify all outputs satisfy their `requires:` dependencies.

  ## Part 2: Tasks

  5. Read spec.md (feature/chore) or fix-plan.md (bugfix) for requirements,
     using the format defined in CONVENTIONS.md § Specification Format Contract
     or § Fix Plan Format Contract respectively.
     If neither exists, use the change description from state.yaml.
  6. Read design.md (feature) per § Design Format Contract or diagnosis.md
     (bugfix) per § Diagnosis Format Contract for approach, if available.
  7. If ux-artifacts.yaml exists in $WORKFLOW_STATE_DIR/$CHANGE_ID/:
     Read it per CONVENTIONS.md § UX Artifact Contract. For UI tasks,
     reference ux-prototype.html in the task description so the developer
     agent can reference the approved visual design during implementation.
  8. Generate the fewest tasks that cover all acceptance criteria.
     Heuristic: each task should be a single focused change. If a task
     requires touching many unrelated areas, split it. If two tasks do
     the same thing, merge them.
  9. Write tasks.md to $WORKFLOW_STATE_DIR/$CHANGE_ID/ using the exact format
     from CONVENTIONS.md § Task Format Contract:
     - `- [ ] T-N: <description>` with `Verify:`, optional `depends:`

  FLAG-DEPENDENT BEHAVIOR (per flags_read):
  - When tdd_required: every implementation task has a preceding test task.
  - When bugfix: regression test task precedes fix task.

  10. Update state.yaml step_history per CONVENTIONS.md § State Updates.

verify:
  - Every file listed in phase outputs: exists in $WORKFLOW_STATE_DIR/$CHANGE_ID/
  - Each artifact's requires: dependencies were created before it
  - Artifacts are non-empty and follow template structure
  - tasks.md follows the Task Format Contract (CONVENTIONS.md)
  - tasks.md covers every acceptance criterion from spec
  - Every task has a Verify field with concrete check

outputs:
  - updated_artifact_set
