id: autopilot-session-init
version: 1

intent: Create a new session entry in sessions.yaml and write the initial checkpoint. Sets SESSION_ID for the entire run.

inputs:
  - $WORKFLOW_STATE_DIR/autopilot
  - iterations (from schema flags)
  - focus (from schema flags)

rules:
  - Always create a NEW session entry — never reuse a prior one, even on resume.
  - On resume (prior in_progress session detected): write a new entry with resumed_from pointing to the interrupted session_id.
  - SESSION_ID counter is derived from the file itself — no external state needed.
  - Write checkpoint AFTER writing the session entry — checkpoint references session_id.

instruction: |
  1. Create the sessions directory:
     mkdir -p $WORKFLOW_STATE_DIR/autopilot/archive

  2. Compute SESSION_ID:
     COUNT=$(grep -c '^  - id:' $WORKFLOW_STATE_DIR/autopilot/sessions.yaml 2>/dev/null || echo 0)
     SESSION_ID="autopilot-$(date -u +%Y-%m-%d)-$(printf '%03d' $(( COUNT + 1 )))"
     SESSION_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)

  3. Check for an interrupted session (resume scenario):
     If sessions.yaml exists and contains an entry with `status: in_progress`:
       - Extract its id as PRIOR_SESSION_ID
       - Set RESUMED_FROM field in the new entry (see step 4b)

  4a. If sessions.yaml does not exist, create it:
      echo "sessions: []" > $WORKFLOW_STATE_DIR/autopilot/sessions.yaml

  4b. Append the new session entry under sessions: in sessions.yaml:
      ```yaml
        - id: $SESSION_ID
          started_at: $SESSION_STARTED
          focus: "$FOCUS"
          iterations_requested: $N
          status: in_progress
          resumed_from: $PRIOR_SESSION_ID   # omit this line if not a resume
          iterations: []
      ```

  5. Write _checkpoint.json:
     ```json
     {
       "session_id": "$SESSION_ID",
       "iteration": 0,
       "total": $N,
       "focus": "$FOCUS",
       "started_at": "$SESSION_STARTED",
       "status": "initialized"
     }
     ```
     Write to: $WORKFLOW_STATE_DIR/autopilot/_checkpoint.json

  6. Output SESSION_ID so the iterate step can reference it:
     STATUS: completed
     SESSION_ID: $SESSION_ID

verify:
  - sessions.yaml exists at $WORKFLOW_STATE_DIR/autopilot/sessions.yaml
  - New session entry with correct id appears in sessions.yaml
  - _checkpoint.json exists with session_id matching new entry
  - archive/ subdirectory exists

outputs:
  - SESSION_ID
