id: autopilot-preflight
version: 1

intent: Verify the repo is in a state that supports autonomous execution. Auto-remediate missing infrastructure via bootstrap if needed.

inputs:
  - $REPO_ROOT
  - $ORCHESTRATOR_HOME
  - $WORKFLOW_STATE_DIR

rules:
  - Run ALL checks before taking any action. Collect failures, then decide.
  - Auto-remediate only missing infrastructure (bootstrap). Never auto-remediate a dirty tree.
  - After bootstrap remediation, re-run all checks. If still failing, abort with specifics.

instruction: |
  Run all checks in sequence. Collect any failures.

  CHECK 1 — Git repo:
    git rev-parse --show-toplevel
    If FAILS → ABORT: "Not a git repository. Run 'git init && git add -A && git commit -m init' first."

  CHECK 2 — Clean working tree:
    [[ -z "$(git status --porcelain)" ]]
    If FAILS → ABORT: "Working tree has uncommitted changes. Commit or stash first."

  CHECK 3 — Project bootstrapped:
    - spec/project.yaml exists
    - spec/project.yaml has `vision:` key (grep -q "^vision:" spec/project.yaml)
    - $ORCHESTRATOR_HOME/config/workflows/ directory contains at least one .yaml file
    - $WORKFLOW_STATE_DIR is writable (mkdir -p $WORKFLOW_STATE_DIR)
    If ANY fail → invoke: Skill({ skill: "develop", args: "--bootstrap" })
    Then RE-RUN checks 3. If still failing → ABORT with specific check that failed.

  CHECK 4 — Vision is not a placeholder:
    Read spec/project.yaml. Verify vision.purpose is not empty and not the string "TODO".
    If FAILS → ABORT: "spec/project.yaml has no vision section. Run /develop --bootstrap
    and fill in the vision.purpose field. Autopilot needs this to evaluate valuable work."

  If all checks pass → output: STATUS: completed

verify:
  - All 4 checks passed or auto-remediated
  - No dirty working tree
  - spec/project.yaml has non-placeholder vision

outputs:
  - preflight_result (pass | abort_reason)
