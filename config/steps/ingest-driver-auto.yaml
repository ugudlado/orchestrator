id: ingest-driver-auto
version: 1
intent: Auto-invoke orchestrator ingest-driver at complete phase to capture driver-loop token usage.
agent: inline
run: scripts/inline/ingest-driver-auto.py

inputs: []

outputs:
  - ingest_driver_result

rules:
  - Fails soft if session_id cannot be resolved (log warning to stderr, exit 0).
  - Must run AFTER mark-change-completed so that completed_at is available for JSONL scan.
  - Must run BEFORE ingest-feature-metrics so the driver-loop row is visible downstream.

instruction: |
  Invoke the Python step with:
    python $ORCHESTRATOR_HOME/scripts/inline/ingest-driver-auto.py \
      "$WORKFLOW_STATE_DIR/$CHANGE_ID/state.yaml"

  Session-ID resolution (two-path, fail-soft):
    1. Primary: parse UUID from $TMPDIR — Claude Code sets
       TMPDIR=/tmp/claude-<uid>/<repo-slug>/<session-uuid>/ during agent sessions.
    2. Fallback: scan ~/.claude/projects/<repo-slug>/*.jsonl for the newest file
       within the feature's started_at..completed_at window.
    3. If both fail: emit {"ingest_driver_result": {"skipped": true}} and exit 0.

  Required env vars:
    ORCHESTRATOR_HOME — repo root (used to locate bin/orchestrator)
    METRICS_DB        — DuckDB path (passed through to orchestrator ingest-driver)

verify:
  - If session resolved: step_events has a driver-loop row for (repo_root, change_id)
  - If session unresolvable: step exits 0 with skipped=true in stdout (archive not blocked)
