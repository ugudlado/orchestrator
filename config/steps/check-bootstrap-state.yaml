id: check-bootstrap-state
inline: true
run: scripts/inline/check-bootstrap-state.sh
version: 1

intent: Check if bootstrap already completed. Skip entire workflow if state is current.

inputs:
  - .tooling-state.json (may not exist)

rules:
  - Never force re-bootstrap if state is current and version matches.

verify:
  - Decision made: skip (already bootstrapped) or continue (needs setup)

outputs:
  - bootstrap_needed: boolean
