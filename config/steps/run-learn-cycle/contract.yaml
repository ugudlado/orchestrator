id: run-learn-cycle
version: 1

intent: Trigger automatic learning from the just-completed change so every completion improves the next execution.

kind: agent

agent: workflow-learner

inputs:
  # ORC-63: no step produces final_signoff_decision — it names a human
  # approval gate, not a dataflow edge. Marked optional so the AC-4 prereq
  # check does not hard-block. A future signoff step that emits this output
  # can drop the optional annotation.
  - final_signoff_decision: optional

rules:
  - Learning failure is non-blocking — if /learn fails, log a warning and return success.
  - Read state.yaml from the active change directory (this step runs before archive).
  - In --auto mode, rule changes apply without user confirmation.
  - "Never skip compute-prediction-accuracy or run-learn-cycle steps during autopilot — these feed the self-improving loop and must run even when --auto is set. A `skipped: true` outcome is only valid when an enumerated gating flag is set (e.g. ux_design=false for ux steps, learn=false for run-learn-cycle). Session token budget, time pressure, 'capture via retro', or any cost-based justification is NEVER a valid skip reason for feedback-loop steps. Budget pressure is a signal to stop earlier, not to skip learning. <!-- learned: 2026-04-05, source: HL-203, cycle: 6, hits: 20, misses: 1, repo: orchestrator -->"

verify:
  - Step completed (either learn_completed or learn_skipped recorded)
  - If learn_completed: /learn produced output (check for cycle metrics or rule updates)
  - If learn_skipped: learn_error contains a meaningful reason
  - retro.md issues with non-empty fix_direction have a corresponding entry in backlog_tickets_synced (or backlog_tickets_synced is [] when retro.md is absent)

outputs:
  - learn_result
  - backlog_tickets_synced
