id: design-and-draft-artifacts
version: 1

intent: Generate design approaches, select one, then write all phase artifacts (design.md, tasks.md) in a single architect pass. Show artifacts to user for review when not in auto mode.

agent: architect

pre_execute:
  approach_required: true

inputs:
  - discovery_result

flags_read:
  - name: tdd_required
    effect: "Every implementation task must have a preceding test task"
  - name: auto
    effect: "Skip artifact review pause — advance immediately after writing"

rules:
  - Design selection and artifact writing happen in one spawn — no round-trip between them.
  - Keep artifact content traceable to accepted requirements.
  - Avoid implementation details in design.md — those belong in tasks.
  - Keep scope explicit — design.md must declare both goals and non-goals.
  - Make acceptance criteria testable — each AC must be verifiable by a concrete command or assertion.
  - Resolve major design decisions before implementation begins — do not defer to the implementation phase.
  - Tasks must be small, verifiable, and ordered.
  - Attach verification criteria per task.
  - Output MUST follow the Task Format Contract in contracts/artifact-formats.md.
  - "When flags.bugfix is true: first task MUST be the regression test, second task MUST be the fix. Order matters."
  - "When spec or design introduces a new archive/state path for any producer (autopilot, sub-workflow), grep existing consumer globs (e.g., `spec/changes/archive/*/state.yaml`) and confirm the new path is matched before committing the artifact. Otherwise downstream consumers (telemetry, /learn) silently skip the new producer. <!-- learned: 2026-04-16, source: HL-278, cycle: 10, hits: 21, misses: 1, repo: orchestrator -->"
  - "SQL sketches in design.md that reference specific field names must be validated against a live row from the target DB (or schema file) before finalizing. Add an explicit note in the task or run a one-query T-0 validation — field name drift between sketch and schema is a common first-review failure. <!-- learned: 2026-04-17, source: learn-and-telemetry-on-duckdb, cycle: 12, hits: 19, misses: 1, repo: orchestrator -->"
  - "Design claims about caller-site capabilities (e.g., 'X already holds an open connection', 'Y already imports Z', 'the caller has access to W') must be verified by grep against HEAD before finalizing the artifact — not inferred from pattern-matching similar code paths. Unverified caller-site claims that prove false become critical findings at phase review and force a full re-spin of all three artifacts. <!-- learned: 2026-04-20, source: pricing-table-in-duckdb, cycle: 16, hits: 16, misses: 1, repo: orchestrator -->"
  - "Performance budgets in design.md must cite absolute production targets (e.g., 'p99 < 10ms per call under production load') rather than synthetic microbenchmark targets (e.g., '1000 calls in 50ms in a tight loop'). Microbenchmark budgets are easy to set but mislead developers into pivoting away from correct designs when the benchmark fails under artificial conditions that do not match the real workload. <!-- learned: 2026-04-20, source: pricing-table-in-duckdb, cycle: 16, hits: 16, misses: 1, repo: orchestrator -->"

instruction: |
  ## Part 1: Design Selection

  1. Read the discovery brief at $WORKFLOW_STATE_DIR/$CHANGE_ID/discovery.md for
     constraints, integration points, open questions, and recommended approach.
  2. Generate 2-3 design approaches with trade-offs:
     - Each approach: name, description, pros, cons, complexity (XS/S/M/L/XL).
     - Cover different dimensions: simplicity vs extensibility, performance vs maintainability.

  3. Select an approach using the auto-selection heuristic (always applied — no interactive pause here):
     a. Map complexity: XS=1, S=2, M=3, L=4, XL=5.
     b. Select the lowest numeric complexity.
     c. On ties: prefer higher module reuse count.
     d. On further ties: select alphabetically by name.
     e. Document criteria, values, and selection.

  4. Record the chosen direction and rationale in discovery.md's "Key Decisions" section
     per contracts/artifact-formats.md § Discovery Brief Format Contract.

  ## Part 2: Artifact Generation

  5. For each output file (design.md, tasks.md) — in dependency order:
     - **Missing**: does not exist → generate.
     - **Stale**: state.yaml records a review rejection or `refresh_artifacts: true` → regenerate.
     - **Current**: exists and no refresh signal → skip.

  6. For each file needing generation:
     a. Read the template from $ORCHESTRATOR_HOME/config/templates/$SCHEMA/<template>.
     b. Read the artifact's format contract from contracts/artifact-formats.md.
     c. Generate using available context (discovery brief, design direction, change description).
     d. Write to $WORKTREE_ARTIFACT_DIR/$CHANGE_ID/<file>.

  7. Generate tasks.md:
     - Read design.md for approach, component breakdown, and acceptance criteria.
       (Product-level motivation/impact lives on the ticket — read it from
       state.yaml's linear-ticket/change description if more context is needed.)
     - If ux-artifacts.yaml exists: reference ux-prototype.html in UI task descriptions.
     - Generate the fewest tasks that cover all acceptance criteria.
     - Write using Task Format Contract (contracts/artifact-formats.md § Task Format Contract).
     - When tdd_required: every implementation task has a preceding test task.

  8. Return COMPLETION per contracts/done-payload.md (driver calls orchestrator done).
     The COMPLETION `outputs:` block MUST carry all five declared outputs:
     - `design.md` and `tasks.md` — path-named artifacts; the value is the
       relative path the step wrote (e.g. `spec/changes/$CHANGE_ID/design.md`).
     - `updated_artifact_set` — the list of artifact files generated this pass.
     - `design_direction` — the name of the selected design approach.
     - `complexity` — the complexity rating of the selected approach (XS/S/M/L/XL).
     Omitting any of these makes `orchestrator done` reject the step with
     `missing_outputs` (exit 3).

  ## Part 3: Artifact Review (interactive mode only)

  9. If auto=false:
     - Print a summary of each artifact written: file name, section count, task count.
     - Print the full contents of tasks.md so the user can review scope.
     - Pause and prompt: "Review design.md, tasks.md in
       $WORKTREE_ARTIFACT_DIR/$CHANGE_ID/. Reply 'ok' to continue, or describe changes needed."
     - If the user requests changes: apply them to the relevant artifacts and re-present.
     - Once confirmed: proceed to next step.
     If auto=true: skip this pause and return STATUS: completed immediately.

verify:
  - design.md exists in $WORKTREE_ARTIFACT_DIR/$CHANGE_ID/
  - tasks.md exists with at least one task
  - design.md has Acceptance Criteria section with testable criteria
  - tasks.md follows the Task Format Contract
  - tasks.md covers every acceptance criterion from design.md
  - Every task has a Test scenarios field listing the behaviors its tests cover
  - Key Decisions section populated in discovery.md

outputs:
  - design.md
  - tasks.md
  - updated_artifact_set
  - design_direction
  - complexity
