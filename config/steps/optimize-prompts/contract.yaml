id: optimize-prompts
version: 1
kind: script
run: script.sh
# Opt-in closed-loop prompt optimization (gepa -> compare dev -> compare
# holdout -> promote), retrying GEPA when a gate fails.
#
# Off by default: optimization invokes candidate/judge/reflection LLM calls.
# Enable with ORCHESTRATOR_PROMPT_OPTIMIZE=1. Advisory step: always records
# completed; per-pack outcomes land in outputs.prompt_optimize.
#
# Env read (beyond the standard ORCHESTRATOR_* block):
#   ORCHESTRATOR_PROMPT_OPTIMIZE              "1" to enable; anything else no-ops
#   ORCHESTRATOR_PROMPT_OPTIMIZER_DIR         prompt-optimizer checkout (no default)
#   ORCHESTRATOR_PROMPT_OPTIMIZE_BIN          override invocation prefix (tests/stubs)
#   ORCHESTRATOR_PROMPT_OPTIMIZE_MAX_RETRIES  GEPA retries per pack after a gate fail (default 2)
#   ORCHESTRATOR_PROMPT_OPTIMIZE_MAX_METRIC_CALLS  --max-metric-calls (default 40);
#     refused per pack when below train+minibatch floor (outcome underbudget)
#   ORCHESTRATOR_PROMPT_OPTIMIZE_MAX_EXTERNAL_CALLS  --max-external-calls (default
#     max(3*mmc, seed+mutate floor)); refused when below floor
#   ORCHESTRATOR_PROMPT_OPTIMIZE_ASYNC        "1" detaches; log: optimize-prompts.log
#   ORCHESTRATOR_PROMPT_OPTIMIZE_FORCE        "1" skips the new-scenarios freshness gate
#
# Per-pack outcomes include: promoted | gates-failed | noop (gepa exit 3,
# seed-identical — skips compare/retry) | underbudget | error | detached.
default_outputs:
  prompt_optimize: { status: skipped, packs: [] }
