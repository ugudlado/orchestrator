id: run-phase-review
version: 4

intent: Run phase quality checks and decide pass/retry.

kind: agent

agent: reviewer

inputs:
  - task_execution_result
  - name: design
    path: spec/changes/<slug>/design.md
    optional: true
  - name: tasks
    path: spec/changes/<slug>/tasks.yaml
    optional: true

flags_read:
  - name: tdd_required
    effect: "Apply test_coverage metric only when true (via schema when: condition)"

rules:
  - Target score is quality_bar.min_phase_review_score from project.yaml — retry until met.
  - Maximum retries from quality_bar.max_retry_rounds — escalate to user if exhausted.
  - "When flags.light is true: lower target review_score to 7 and max_retries to 4 — light mode trades quality bar for speed on tight-scope changes."
  - Run type-check + test + build commands at every phase boundary before scoring.
  - Capture concrete findings with fix direction — every finding must be actionable.
  - Issues found during verification become new tasks in the current phase. Never skip ahead with unresolved findings.
  - Do not advance with unresolved critical findings — these block phase completion regardless of overall score.
  - "When flags.bugfix is true: zero regressions tolerated. No existing tests may break."
  - Fix tasks must be minimal and scoped to the specific failure — no refactoring, no improvements.
  - Score of 10 is a first-pass bonus — only achievable when no retries were used this round.
  - Operate at staff-level review quality — catch architectural issues, not just surface bugs.
  - Artifact structural compliance with format contracts (see Format contract reference in prompt.md) is a review criterion.
  - "When a finding requires a new requirement, the fix MUST update design.md (AC + design) and tasks.yaml atomically — partial updates that sync only one artifact leave the feature in an inconsistent state and will fail re-review. <!-- learned: 2026-04-17, source: cross-repo-metrics-duckdb, cycle: 11, hits: 13, misses: 7, repo: orchestrator -->"
  - "For tasks that spec describes as a rewrite, projection, or byte-compatible replacement of an existing producer, AC verification MUST include a value/shape parity check against at least one real payload from the prior implementation — key-presence alone is insufficient. Reviewer must run both the old producer and the new one on a real archived fixture and diff the top-level output keys; any key reduction is an important finding. <!-- learned: 2026-04-20, source: single-source-metrics-via-step-events, cycle: 12, hits: 12, misses: 3, repo: orchestrator -->"
  - "Before scoring the phase, check if any task-nodes (step_id starting with 'task-') in the workflow_plan are still pending. If any task-nodes are pending and not explicitly quarantined in state.yaml, write phase-review.md with verdict incomplete_phase listing the pending task IDs — return COMPLETION with outputs.phase_review_report: {verdict: incomplete_phase} and do NOT include review_score. This guards against dispatcher bugs or manual advances that reach run-phase-review before all tasks are complete. <!-- learned: 2026-05-08, source: hl-303, cycle: 38, hits: 12, misses: 1, repo: orchestrator --> <!-- updated: 2026-05-25, source: orc-76, cycle: 1, repo: orchestrator -->"

verify:
  - Phase review report written to $WORKTREE_ARTIFACT_DIR/$CHANGE_ID/phase-review.md
  - "When phase_review_report.verdict is pass or needs_work: review_score recorded in step_history as {step_id: run-phase-review, phase: <current>, status: completed, review_score: { overall: <N>, dimensions: { spec_compliance: <N>, correctness: <N>, security: <N>, simplicity: <N>, code_quality: <N> } }}"
  - "When phase_review_report.verdict is incomplete_phase: review_score is omitted from step_history (nothing to score)"
  - "All critical findings have either a fix task or are resolved"
  - "phase-signoff will BLOCK if this step's entry is missing from step_history — this step is not optional"

outputs:
  - phase_review_report
  - name: phase_review
    path: spec/changes/<slug>/phase-review.md
