id: execute-next-task
version: 4

intent: Execute the next ready task and update progress state.

agent: developer

repeat_until: all_tasks_completed

pre_execute:
  approach_required: true

inputs:
  - tasks.md (format: contracts/artifact-formats.md § Task Format Contract)
  - phase_context_bundle

rules:
  - Pick only ready tasks (dependencies satisfied).
  - Keep code changes scoped to the selected task.
  - Mark task progress immediately after execution.
  - Global retry cap: if total retries across all tasks in this phase exceeds 10, follow Escalation Protocol (CONVENTIONS.md § Error Recovery Contract). Prevents infinite retry loops across many tasks.
  - When keeping an intentionally broad pattern (e.g., `except Exception`), annotate it inline with a justification comment (e.g., `# Intentionally broad: <reason>`). Silent exceptions must never be ambiguous.
  - When replacing a tool or artifact (e.g., poetry→uv, webpack→vite), delete the old tool's generated files from disk — even if gitignored. Stale artifacts cause confusion.
  - When the task references ux-prototype.html, read it as a visual reference for the approved design direction. Match layout, styling, and interaction patterns from the prototype. If ux-prototype.html does not exist, proceed from spec text alone.
  - "When flags.tdd_required is true, follow strict red-green-refactor: write the failing test first, run it and confirm it fails for the expected reason (feature missing, not typo), then write the minimal code to pass, then refactor with tests green. No production code without a failing test first. Use real code over mocks unless unavoidable; if mock setup is longer than test logic, the test is wrong. Cover edge cases and error paths."
  - "When flags.light is true: keep changes minimal and focused. No scope creep. One concern per change."
  - "When flags.bugfix is true: write the regression test BEFORE the fix — the test must fail until the fix lands. Make the smallest change that fixes the root cause; prefer changing 1 line over 5. Use existing patterns in the codebase over introducing new ones. Do NOT refactor surrounding code, add unnecessary error handling, or add comments to unchanged code."
  - "When flags.bugfix is true: after implementing the fix, re-run the reproduction script from diagnosis.md to confirm it works. Then check whether the change could break other callers of the modified code."
  - "When removing or renaming a step/artifact from a workflow schema, grep the entire config directory for ALL references to it (step contracts, conventions, other schemas, agent definitions) — not just the files listed in the spec. Stale references cause behavioral bugs in auto-approval and validation paths. <!-- learned: 2026-04-11, source: HL-272, cycle: 14, hits: 15, misses: 1, repo: orchestrator -->"
  - "When removing a block from a prose file (SKILL.md, CONVENTIONS.md, agent definition), grep the entire file for forward references pointing to that block ('below', 'above', 'see §', 'YAML glob below') and update or remove them atomically in the same commit. Dangling forward references pass tests but break the reader's mental model and fail phase review. <!-- learned: 2026-04-17, source: learn-and-telemetry-on-duckdb, cycle: 12, hits: 12, misses: 1, repo: orchestrator -->"
  - "Do not modify files outside the task's declared Files: list, even for observations that feel like improvements (new backlog entries, follow-up tickets, documentation drift, unrelated test fixes). Mid-task observations belong in the commit footer or the step evidence block — not in files that are not task-scoped. Out-of-scope edits will be reverted by the driver and add noise to the diff. <!-- learned: 2026-04-20, source: pricing-table-in-duckdb, cycle: 16, hits: 8, misses: 1, repo: orchestrator -->"
  - "When design.md's AC Verify line names a specific test file and method (e.g., `test_dispatch_resume.py::test_resume_emits_stderr_log`), the developer MUST produce an executable test — even if the contract under test is a prompt, skill file, or prose artifact. A fixture or subprocess test can stand in for a non-executable target. Do not silently substitute a prose-only contract. If an executable test is genuinely infeasible (e.g., the target is a multi-process system with no injectable seam), escalate to the architect per contracts/architect-escalation.md with explicit justification before the task is marked complete. <!-- learned: 2026-04-21, source: durable-intent-and-resume, cycle: 17, hits: 8, misses: 1, repo: orchestrator -->"
  - "When a task's AC Verify line contains a grep or pattern-match command against a file the task modifies (e.g., `grep -E 'pattern' some-file.md`), run that exact command on the modified file before committing. A comment spanning multiple lines can satisfy the semantic intent but fail a single-line grep — verify the pattern matches the written text, not just the concept. <!-- learned: 2026-05-10, source: orc-48, cycle: 14, hits: 1, misses: 0, repo: orchestrator -->"
  - "When removing a CLI command, MCP tool, or web route from an application, grep the project's test files for direct invocations of the removed surface and update or remove those references in the same change. Tests that invoke deleted surfaces are technical debt regardless of whether they are currently masked by environment restrictions (sandbox, EPERM, port conflicts) — they will surface as failures when restrictions are lifted. <!-- learned: 2026-05-15, source: back-476, cycle: 1, hits: 1, misses: 0, repo: backlog.md -->"
  - "For any task or ticket management (create, edit, list, claim, close), load the /backlog-manager skill first — it detects the correct backend (Linear or Backlog.md) per repo and delegates to /linear or /backlog accordingly. Never assume the backend. When the backend is Backlog.md, use the globally installed `backlog` binary — never `bun run cli`."
  - "When flags.tdd_required is true AND the task is a pure mechanical change (rename, move, delete with no behavioral change), there is no meaningful RED step — the suite passes with either the old or new name. Satisfy tdd_required by sequencing a regression-guard test task first (verify existing tests stay green after the rename) rather than fabricating a failing test. Do NOT invent a RED step that doesn't reflect the actual change. <!-- learned: 2026-05-19, source: orc-59, cycle: 1, hits: 0, misses: 0, repo: orchestrator -->"

instruction: |
  0. Re-entry check (per CONVENTIONS.md § Idempotent Re-Entry):
     tasks.md [x] markers are the durable checkpoint — `record.py` (orchestrator done)
     does not persist `task_checkpoint` keys; they are silently dropped. Do NOT rely
     on `task_checkpoint` in state.yaml as re-entry signal; it will not be present.
     Instead: read tasks.md and find any task marked [x]. If a task is [x] but the
     step_history has no corresponding completed entry, that is the crash-recovery case.
     Resume from the next unchecked task (- [ ]) per the normal flow.
     Skip to step 1.

  1. Read tasks.md to find the next unchecked task (- [ ]) whose
     dependencies (depends: T-N) are all marked complete.
  2. If no unchecked tasks remain: this step's repeat condition is met — advance.
  3. Identify which files are relevant to the task from design.md context.
  4. Implement the changes described in the task.
  5. Run project verification commands (type-check, test, build)
     as defined in project.yaml quality_bar.

  5a. Regression gate (if state.yaml has `baseline:` and `baseline.skipped` is not true):
     a. Re-run the full test command from baseline.test_command and parse counts
        using the same patterns as capture-test-baseline step 3.
     b. Compare current passing count to baseline.passing.
     c. If current.passing < baseline.passing (new failures introduced by this task):
        - Mark this as a regression, not a test failure. Record to state.yaml:
          ```yaml
          step_history[-1]:
            regression:
              task_id: "T-<N>"
              baseline_passing: <N>
              current_passing: <N>
              delta: -<N>
              detected_at: "<ISO timestamp>"
          ```
        - Treat as verification failure for recovery (continue to step 7).
        - Do NOT mark the task complete. Do NOT commit.
     d. If current.passing == baseline.passing and current.failing == baseline.failing:
        no regression — proceed to step 6.
     e. If current.passing > baseline.passing (new tests added, all passing):
        update baseline in-place: baseline.passing = current.passing,
        baseline.total = current.total. This makes the new tests part of the
        floor for subsequent tasks.
     f. If the test command cannot be run or output cannot be parsed this time,
        log `step_history[-1].regression_check: skipped` with a reason and proceed
        to step 6. Do not block on a broken gate.

  6. If verification passes:
     - Mark task complete in tasks.md: [ ] → [x]
     - Commit per contracts/auto-commit.md:
       Stage only the task's changed files + tasks.md,
       then commit with message: `<prefix>(<change-id>): T-<N> <task title>`
       tasks.md [x] IS the durable checkpoint — do NOT attempt to write
       `task_checkpoint` to state.yaml (record.py drops unknown keys silently).
       Skip commit if git status shows no changes (verification-only task).
     - Update state.yaml step_history per CONVENTIONS.md § State Updates.
  7. If verification fails:
     a. Leave task unchecked (- [ ]).
     b. Rollback (self-healing): stash the working-tree changes made by this
        attempt so the retry starts from a clean baseline instead of trying to
        patch buggy code in place:
          git stash push -u -m "pre-retry: T-<N> attempt <K>"
        The stash is named and recoverable. Record the stash ref to state.yaml:
          step_history[-1].rollback: { stash_ref: "stash@{0}", attempt: <K> }
     c. Diagnose the failure from command output / test results and build a
        RETRY_CONTEXT block the dispatch loop will pass into the re-spawned
        agent (per CONVENTIONS.md § Retry Context Contract):
          RETRY_CONTEXT:
            attempt: <K>
            previous_failure: <regression | test_failure | verify_assertion>
            detail: <regression delta, or failing test names + stdout tail (20 lines max)>
            baseline: <baseline.passing value if regression>
        Write the block to step_history[-1].retry_context so the dispatch loop
        can find it on re-spawn.
     d. Re-run verification from the rolled-back baseline with the augmented
        prompt in place.
     e. Follow Error Recovery Contract (contracts/error-recovery.md):
        - Increment retries.T-N in state.yaml per attempt.
        - On success: drop the stash (`git stash drop <ref>`) and proceed to step 6.
        - If retries.T-N >= max_retries (from phase verify, default 3):
          * Restore the final failed state: `git stash pop <ref>` so the broken
            code is visible in the working tree for debugging.
          * Under `auto: true` (autopilot / lenient mode): mark the task
            `quarantined: true` in tasks.md per § Quarantine Protocol below,
            record a quarantine_events entry in state.yaml, and advance to the
            next task. Do NOT escalate.
          * Otherwise: execute on_max_retries action per § Escalation Protocol.
        - Do not skip the task unless it is quarantined.
  8. If blocked (external dependency, missing input, ambiguous spec):
     Follow Agent Blocked Protocol (contracts/error-recovery.md).
     Record blocker in state.yaml: `{ blocked_task: T-N, reason: "..." }`.
     Do not advance past the blocked task.

  9. If architectural escalation needed (design contradiction, missing design coverage,
     scope ambiguity, or architectural dependency discovered during implementation):
     Follow the Architect Escalation Protocol (contracts/architect-escalation.md).
     Return:
       STATUS: escalate_to_architect
       type: <contradiction|missing_coverage|scope_ambiguity|architectural_dependency>
       task_id: T-<N>
       context: <what conflicts or is missing>
       question: <single concrete question for the architect>
       attempted: <what you already considered>
     Do NOT mark the task complete or failed.
     Do NOT increment retries for this task.
     Wait for architect guidance before resuming implementation.

  FINAL-TASK SIMPLIFY PASS (runs only when no unchecked tasks remain after step 6):
  If the repeat condition is met (all tasks complete), before this step returns:

  If state.yaml flags.simplify is false (read flags from $WORKFLOW_STATE_DIR/$CHANGE_ID/state.yaml),
  skip steps 10a-d below and return without making a simplify commit.
  Otherwise:

  10. Run a developer simplify pass over the files changed in this feature:
      a. Identify all files modified by commits in this feature branch:
         `git diff --name-only <first-feature-commit>^..HEAD`
      b. For each file, check for simplification opportunities:
         - Remove dead code (unreachable branches, unused variables)
         - Extract duplicated logic into helpers (if 3+ identical blocks)
         - Simplify over-engineered abstractions (replace with direct calls)
         - Fix naming inconsistencies or misleading identifiers
      c. If simplification changes are made: commit them with message:
         `chore(<change-id>): simplify pass after final task`
      d. If no simplification opportunities found: emit a no-op commit or skip.
      This runs in the same developer agent spawn as the final task — no new spawn.

  This step is typically used with `repeat_until: all_tasks_completed`.
  The agent re-executes this step for each task until all are done.

verify:
  evidence_required: true
  after_each:
    - The completed task is marked [x] in tasks.md
    - Task's verification criteria (from Verify field) are met with evidence
    - type-check passes
    - test passes (if tests exist for changed files)
    - No regression: baseline.passing (if captured) equals current passing count
    - Changes committed per § Auto-Commit Convention (or skipped if no changes)
  repeat_done_when:
    - No unchecked tasks (- [ ]) remain in tasks.md

outputs:
  - task_execution_result
