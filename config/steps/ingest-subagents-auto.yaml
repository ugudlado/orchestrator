id: ingest-subagents-auto
version: 1
intent: Auto-invoke orchestrator ingest-subagents at complete phase to capture sub-agent token usage.
agent: inline
run: scripts/inline/ingest-subagents-auto.py

inputs:
  - state_yaml_path

outputs:
  - ingest_subagents_result

rules:
  - Fail-soft. Never block archival if subagent JSONLs missing.
  - Must run AFTER ingest-driver-auto so the driver-loop row is already present.
  - Must run BEFORE ingest-feature-metrics so sub-agent rows are visible downstream.

instruction: |
  Invoke the Python step with:
    python $ORCHESTRATOR_HOME/scripts/inline/ingest-subagents-auto.py \
      "$WORKFLOW_STATE_DIR/$CHANGE_ID/state.yaml"

  Session-ID resolution (two-path, fail-soft):
    1. Primary: parse UUID from $TMPDIR — Claude Code sets
       TMPDIR=/tmp/claude-<uid>/<repo-slug>/<session-uuid>/ during agent sessions.
    2. Fallback: scan ~/.claude/projects/<repo-slug>/*.jsonl for the newest file
       within the feature's started_at..completed_at window.
    3. If both fail: emit {"ingest_subagents_result": {"skipped": true}} and exit 0.

  Required env vars:
    ORCHESTRATOR_HOME — repo root (used to locate bin/orchestrator)
    METRICS_DB        — DuckDB path (passed through to orchestrator ingest-subagents)

verify:
  - If session resolved: step_events has subagent-<id> rows for (repo_root, change_id) with agent_name != driver-loop
  - If session unresolvable: step exits 0 with skipped=true in stdout (archive not blocked)
