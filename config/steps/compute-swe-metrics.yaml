id: compute-swe-metrics
inline: true
run: scripts/inline/compute-swe-metrics.sh
version: 1

intent: Compute SWE metrics and persist to state.yaml.


inputs:
  - final_signoff_decision
  - project_storage_config

rules:
  - Metrics script failure is non-blocking — proceed with null placeholders.
  - Metrics MUST be written to state.yaml before any archive step runs.

verify:
  - state.yaml contains a `metrics:` block (even if placeholder)

outputs:
  - swe_metrics
