id: compute-swe-metrics
version: 1

intent: Compute SWE metrics and persist to state.yaml and feature-metrics.jsonl.

agent: developer

inputs:
  - final_signoff_decision
  - project_storage_config

rules:
  - Metrics script failure is non-blocking — proceed with null placeholders.
  - Metrics MUST be written to state.yaml before any archive step runs.

instruction: |
  1. Read storage config from project.yaml:
     - active_changes_root: $WORKFLOW_STATE_DIR

  2. **Compute SWE metrics**:
     a. Check if $ORCHESTRATOR_HOME/scripts/compute-swe-metrics.sh exists.
     b. If yes: run it and validate the output contains a `metrics:` YAML block.
        ```bash
        $ORCHESTRATOR_HOME/scripts/compute-swe-metrics.sh "$WORKFLOW_STATE_DIR/$CHANGE_ID" [transcript_paths...]
        ```
        The script parses JSONL transcripts, computes costs, resolution stats,
        and git churn. Append the output to state.yaml.
        If the transcript path is not known, the script auto-discovers recent
        session files from ~/.claude/projects/<project-slug>/*.jsonl.
     c. If script missing or fails: write a minimal metrics block with null placeholders
        so downstream consumers can read the structure:
        ```yaml
        metrics:
          status: script_unavailable
          reason: "<error message or 'script not found'>"
          resolution: { resolve_rate: null, pass_at_1: null, pass_at_2: null, regression_rate: null }
          cost: { net_usd: null, gross_usd: null }
          tokens: { total: null, input: null, output: null }
        ```
        Do NOT fail — metrics are non-blocking.

  3. **Write to feature-metrics.jsonl**:
     Append a single JSON line to ~/.claude/logs/feature-metrics.jsonl with
     the SWE-bench-comparable format (see archive-completed-change.yaml v4
     for the full JSON schema — same format, just computed in this step now).

  4. Update state.yaml step_history per CONVENTIONS.md § State Updates.

verify:
  - state.yaml contains a `metrics:` block (even if placeholder)
  - feature-metrics.jsonl has a new entry for this feature

outputs:
  - swe_metrics
