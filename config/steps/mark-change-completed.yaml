id: mark-change-completed
inline: true
run: scripts/inline/mark-change-completed.sh
version: 1

intent: Write completion fields to state.yaml and validate step_history usage coverage.

# Inline step — no agent field. Executed directly by the orchestrator dispatch loop.

inputs:
  - state.yaml (active change)

rules:
  - Run immediately before compute-swe-metrics so completed_at is available for JSONL time-window bounding.
  - Validator is non-blocking — always exits 0 regardless of coverage ratio.
  - archive_path uses ISO date prefix from completed_at (YYYY-MM-DD-<change-id>).

instruction: |
  0. Re-entry check: read state.yaml for `completed_at`. If already set and
     `status: completed`, skip to step 3 (validator only — idempotent).

  1. Write the following top-level fields to state.yaml (overwrite if present):
     - `status: completed`
     - `completed_at: <ISO 8601 UTC timestamp, e.g. 2026-04-17T12:34:56Z>`
     - `archive_path: spec/changes/archive/YYYY-MM-DD-<change-id>/`
       where YYYY-MM-DD is the date portion of completed_at and <change-id> is
       the value of the `change_id` (or `linear_ticket_id`) field in state.yaml.

  2. These fields MUST be written before compute-swe-metrics runs because
     compute-swe-metrics.sh reads `completed_at` to bound the JSONL time window.
     Without `completed_at`, parse_session_jsonl falls back to the step_history
     path, which yields $0 cost and zero tokens.

  3. Run the field-presence validator (non-blocking, stderr warning only):
     a. Read step_history from state.yaml.
     b. Count total entries (M) and entries that have both `usage.duration_ms`
        and `usage.tool_uses` (N).
     c. Compute coverage ratio: N/M (or 1.0 if M is 0).
     d. If coverage ratio < 1.0, write a warning to stderr:
          "[mark-change-completed] usage coverage: N/M step_history entries have
           required usage fields (duration_ms, tool_uses). Workflow continues."
     e. Always exit 0 — this is a diagnostic warning, not a gate.

  4. Update state.yaml step_history per CONVENTIONS.md § State Updates.

verify:
  - state.yaml contains top-level `status: completed`
  - state.yaml contains top-level `completed_at` (non-empty ISO 8601 string)
  - state.yaml contains top-level `archive_path` (non-empty string starting with spec/changes/archive/)
  - Validator ran and exited 0 (workflow continues)

outputs:
  - state_completion_fields
