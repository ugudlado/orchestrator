version: 1
# Outbound sync: workflow step completed → ticket status (per backend).
# Used by scripts/ticket-sync.sh after orchestrator done (shell loop only).
# Inbound (ticket → workflow entry) stays in config/ticket-status-map.yaml.
#
# Keys: exact step_id, or "pattern:<glob>" (fnmatch, e.g. pattern:task-*).
# Values: status strings as they appear in Backlog.md or Linear.
on_step_complete:
  capture-test-baseline:
    backlog: "In Progress"
    linear: "In Progress"
  pattern:task-*:
    backlog: "In Progress"
    linear: "In Progress"
  run-phase-review:
    backlog: "Code Review"
    linear: "In Review"
  mark-change-completed:
    backlog: "QA Review"
    linear: "QA Review"
