steps:
  - check-rerun
  - create-worktree
  - load-ticket-context
  - prompt: design
  - ticket-start
  - id: implement
    on_failure: implement
    max_retries: 3
    prompt: implement
  - ticket-review
  - id: review
    on_success: ticket-qa
    on_failure: implement
    max_retries: 8
    prompt: review
  - ticket-qa
  - prompt: learn
  - persist-learnings # validate + append + commit learn's proposed eval scenarios
  - eval-prompts # opt-in prompt eval (ORCHESTRATOR_PROMPT_EVAL=1); no-op otherwise
  - workflow-report
