steps:
  - check-rerun # halt if this fix is already archived (workflow's own decision)
  - diagnose
  - design-and-draft-artifacts
  - id: design-review
    on_success: ticket-start
    on_failure: design-and-draft-artifacts
    max_retries: 3
  - ticket-start # ticket -> In Progress (implement entry)
  - capture-test-baseline
  - implement-tasks
  - ticket-review # ticket -> Code Review
  - id: run-phase-review
    on_success: ticket-qa
    on_failure: implement-tasks
    max_retries: 8
  - ticket-qa # ticket -> QA Review
  - run-learn-cycle
