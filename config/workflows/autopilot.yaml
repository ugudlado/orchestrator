# Autopilot workflow — fully autonomous, NO review steps (ORC-108).
# Autopilot is not a mode/flag bundle: it is just this step list. It runs the
# produce → implement → complete spine straight through, with no
# run-ux-critique gate and no Code-Review/QA ticket lanes for humans.
#
# Autopilot ENDS AT THE BOUNDARY — it does NOT merge. The run loop archives the
# change on the feature worktree (archive-completed-change) and exits; the worktree and
# branch are left intact for inspection. Merging is a deliberate, separate
# action: `orchestrator complete <slug>` (/complete-feature or /approve-qa).
# This is the same end state as feature/bugfix.
steps:
  - check-rerun # halt if this change is already archived (workflow's own decision)
  - create-worktree # no-op when flags.worktree=false; writes worktree_path+branch to state
  - explore
  - design-and-draft-artifacts
  - id: design-review
    on_failure: design-and-draft-artifacts
    max_retries: 3
  - ticket-start # ticket -> In Progress
  - implement-tasks
  - ticket-review # ticket -> Code Review
  - id: run-phase-review
    on_success: ticket-qa
    on_failure: implement-tasks
    max_retries: 8
  - ticket-qa # ticket -> QA Review
  - run-learn-cycle
  - mark-change-completed
  - archive-completed-change
  - workflow-report
