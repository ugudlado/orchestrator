# Complete-only workflow (ORC-108).
#
# CLI: `orchestrator complete <ticket-id>` — same driver as other workflows:
# orchestrator-run.sh --schema complete → run-workflow.sh → post-merge hook.
#
# Does not seed a new feature; requires existing state.yaml from a prior
# `orchestrator feature|bugfix|autopilot` run.
#
# On success: complete-phase steps (declared in feature/bugfix schemas and
# seeded at feature init time) run through archive-completed-change, then
# merge to default branch (unconditional — invoking complete IS the merge signal),
# then worktree teardown unless --no-teardown.
#
# Flags: --repo PATH, --no-teardown, plus key=value overrides.
steps:
  - compute-prediction-accuracy
  - run-learn-cycle
  - mark-change-completed
  - compute-swe-metrics
  - gather-learn-metrics
  - cost-report
  - ticket-done
  - archive-completed-change
