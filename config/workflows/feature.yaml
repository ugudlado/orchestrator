name: feature
version: 4

description: >
  Canonical feature development. Two signoff gates: spec approval (before
  implementation) and final signoff (before archive). Flag descriptions
  below document when to reach for each one.

uses:
  project: $REPO_ROOT/spec/project.yaml
  steps: $ORCHESTRATOR_HOME/config/steps/
  templates: $ORCHESTRATOR_HOME/config/templates/feature/

defaults:
  tdd_required: true
  ux_design: true
  discovery: true
  phase_review: true
  worktree: true
  auto: false
  agents: false
  linear: true
  light: false

flags:
  --no-tdd:
    sets: { tdd_required: false }
    description: >
      Skip test-first enforcement. Use when the change is exploratory, the
      test infrastructure doesn't support the area yet, or the user has
      explicitly okayed it. Default is TDD on.
  --no-ux:
    sets: { ux_design: false }
    description: >
      Skip the UX design and UX critique steps. Use for backend-only or
      CLI-only work, or when the frontend changes are purely mechanical
      (rename, constant update). Auto-detected off when project has no
      frontend tech stack.
  --no-linear:
    sets: { linear: false }
    description: >
      Skip Linear ticket creation. Use when the repo isn't in your Linear
      config, when Linear is down, or for throwaway experiments. You can
      always file a ticket manually after.
  --auto:
    sets: { auto: true }
    description: >
      Fully autonomous — skips both signoff gates (spec approval and final
      signoff). Use inside autopilot or when you trust the agents to
      self-gate. Without this, the workflow pauses at each phase boundary.
  --agents:
    sets: { agents: true }
    description: >
      Spawn specialist agents (developer, reviewer, architect) for phase
      work instead of running inline. Use for higher-quality output or
      when the driver context is getting hot. Costs more tokens but
      enables per-subagent attribution.
  --light:
    sets:
      light: true
      tdd_required: false
      ux_design: false
      discovery: false
      phase_review: false
      worktree: false
      linear: false
    description: >
      Tight-scope path for small, well-scoped changes that should fit in
      an afternoon — dependency bumps, config tweaks, renames, typo fixes,
      small UI polish, adding a flag. Replaces the former chore schema.
      Skips discovery, design-and-draft-artifacts, UX design, TDD,
      phase-reviews, worktree creation, and Linear. Keeps spec + tasks
      + execute-next-task + final archive for paper-trail. Lowers review
      threshold from 9 to 7. Compose with other flags to re-enable a
      specific gate (e.g. --light --tdd keeps tests).

rules:
  - id: phase-gates
    rule: Run type-check + test + build at every phase boundary.
  - id: verification-bugs
    rule: Issues found during verification become new tasks in the current phase. Never skip ahead.
  - id: light-scope
    when: light
    rule: Keep changes minimal and focused. No scope creep. One concern per change.

phases:
  - name: specify
    goal: Produce high-quality artifacts that make implementation straightforward.
    outputs:
      - file: discovery.md
        template: discovery.md
        when: discovery
      - file: spec.md
        template: spec.md
      - file: design.md
        template: design.md
    rules:
      - Keep scope explicit (in-scope and out-of-scope).
      - Make acceptance criteria testable.
      - Resolve major design decisions before implementation.
    verify:
      assertions:
        - spec.md exists in $WORKFLOW_STATE_DIR/$CHANGE_ID/
        - design.md exists in $WORKFLOW_STATE_DIR/$CHANGE_ID/
        - tasks.md exists with at least one task
        - spec.md has Acceptance Criteria section with testable criteria
      metrics:
        review_score: { min: 9 }
      max_retries: 3
    verify_when:
      light:
        metrics:
          review_score: { min: 7 }
        max_retries: 2
    steps:
      - workflow-init
      - explore if discovery
      - ux-design if ux_design
      - id: design-and-draft-artifacts
        rules_when:
          tdd_required:
            - Every implementation task has a preceding test task.
            - Keep explicit red-green-refactor order in task text.
          not tdd_required:
            - Tests are optional unless task-level verification explicitly requires them.
          light:
            - Keep spec.md terse — one paragraph of context, a short acceptance list. No discovery section when discovery was skipped.
      # validate-artifacts absorbed into design-and-draft-artifacts self-verify (HL-287 M4)
      - preview-route
      - run-phase-review if phase_review

  - name: implement
    goal: Deliver all tasks with review and verification loops.
    requires: specify
    rules:
      - Work task-by-task with minimal scoped changes.
      - Route failures into retry loops inside the same phase.
      - Do not advance with unresolved critical findings.
    verify:
      commands: $project.verify_commands
      assertions:
        - All tasks in tasks.md marked [x]
        - Zero console errors in runtime verification
        - Each acceptance criterion verified with evidence
      metrics:
        review_score: { min: 9 }
        test_coverage: { min: 90, when: tdd_required }
      max_retries: 3
      on_max_retries: escalate to user with remaining gaps listed
    verify_when:
      light:
        metrics:
          review_score: { min: 7 }
        max_retries: 2
    steps:
      - capture-test-baseline
      - id: execute-next-task
        repeat_until: all_tasks_completed
        rules_when:
          tdd_required:
            - Write failing test before implementation for each task.
            - Keep coverage at or above schema target.
          not tdd_required:
            - Keep implementation slices minimal and verification-focused.
      - run-ux-critique if ux_design
      - run-phase-review if phase_review

  - include: _complete-phase
    requires: implement
