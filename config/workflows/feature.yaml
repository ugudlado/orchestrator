steps:
  - check-rerun # halt if this feature is already archived (workflow's own decision)
  - create-worktree # creates worktree + branch; writes worktree_path+branch to state
  - load-ticket-context # REST fetch ticket body → ticket-context.md (loop stays agnostic)
  - prompt: explore
  - prompt: ux-design
  - prompt: design
  - id: design-review
    prompt: design-review
    on_failure: design
    max_retries: 3
  - ticket-start # ticket -> In Progress (implement entry)
  - prompt: ux-critique
  - id: implement
    prompt: implement
    on_failure: design
    max_retries: 3
  - ticket-review # ticket -> Review
  - id: review
    prompt: review
    on_success: ticket-qa
    on_failure: implement
    max_retries: 8
  - ticket-qa # ticket -> Verify
  - prompt: learn
  - persist-learnings # validate + append + commit learn's proposed eval scenarios
  - eval-prompts # opt-in prompt eval (ORCHESTRATOR_PROMPT_EVAL=1); no-op otherwise
  - workflow-report
