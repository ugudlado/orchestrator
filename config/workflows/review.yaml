# Review-only workflow. implement.yaml stops at coding (no review tail) —
# this is the second, separately-invoked half: quality gate + learn cycle
# against an existing design.md/tasks.yaml + implementation on the same
# change_id.
#
# Requires existing state.yaml from a prior design/implement/feature/bugfix run
# (same change_id) — does not create a worktree or draft artifacts.
#
# No implement-tasks node exists in this schema to loop back to, so a failed
# review halts (blocks) rather than looping — fix manually (or re-run
# `implement`), then re-invoke `review`.
steps:
  - ticket-review # ticket -> Code Review
  - id: run-phase-review
    on_success: ticket-qa
    on_failure: halt
  - ticket-qa # ticket -> QA Review
  - run-learn-cycle
  - workflow-report
