steps:
  - check-rerun
  - create-worktree
  - load-ticket-context
  - ticket-start
  - id: implement
    on_failure: implement
    max_retries: 3
    prompt: implement
  - ticket-review
  - id: review
    on_success: ticket-qa
    on_failure: implement
    max_retries: 8
    prompt: review
  - ticket-qa
  - prompt: learn
  - eval-prompts # opt-in prompt eval (ORCHESTRATOR_PROMPT_EVAL=1); no-op otherwise
  - optimize-prompts # opt-in gepa->compare->promote loop (ORCHESTRATOR_PROMPT_OPTIMIZE=1); no-op otherwise
  - workflow-report
