steps:
  - check-rerun
  - create-worktree
  - load-ticket-context
  - ticket-start
  - id: implement-tasks
    on_failure: implement-tasks
    max_retries: 3
  - ticket-review # ticket -> Review
  - id: run-phase-review
    on_success: ticket-qa
    on_failure: implement-tasks
    max_retries: 8
  - ticket-qa # ticket -> Verify
  - run-learn-cycle
  - workflow-report
