# Workflow composition config — flags (what runs / how) + guidelines (which schema).
# ORC-105: merged from config/flags.yaml + config/guidelines.yaml.
#
# Consumers:
#   - skills/orchestrate/scripts/seed-state.sh        (gates, behavioral, cli)
#   - config/scripts/orchestrator_next/doctor.py      (gates, behavioral)
#   - config/steps/select-workflow.yaml               (guidelines)

# ── Flag registry ──────────────────────────────────────────────────
# gates:      boolean flags that filter steps from a workflow's steps list.
# behavioral: boolean flags that change agent/step behavior without filtering.
# Workflow files no longer carry defaults — the `default` here is global.
# The steps list in each workflow IS the declaration of what runs;
# only flags listed under `gates` actually filter that list.

gates:
  phase_review: { steps: [run-phase-review],                default: true  }
  portless:     { steps: [setup-portless],                  default: true  }
  metrics:      { steps: [register-with-orchestrator-home], default: true  }
  ux_design:    { steps: [ux-design, run-ux-critique],      default: false } # <!-- learned: 2026-05-09, source: orc-39, cycle: 44, repo: orchestrator -->

behavioral:
  tdd_required:  { default: true,  description: "Strict red-green-refactor in execute-next-task" }
  auto:          { default: false, description: "Skip signoff gates" }
  agents:        { default: false, description: "Spawn specialist agents instead of running inline" }
  light:         { default: false, description: "Lower review threshold to 7, skip tdd/phase_review" }
  worktree:      { default: true,  description: "Run in a git worktree; gates complete-workflow cleanup phase" }
  merge_to_main: { default: false, description: "Merge feature branch to default in complete-workflow" }

# CLI flags. Each `sets:` flips one or more underlying flags.
cli:
  --no-tdd:      { sets: { tdd_required: false } }
  --auto:        { sets: { auto: true } }
  --agents:      { sets: { agents: true } }
  --no-portless: { sets: { portless: false } }
  --no-metrics:  { sets: { metrics: false } }

  --light:
    sets:
      light: true
      tdd_required: false
      phase_review: false
    description: Tight-scope path. Reviewer lowers threshold to 7.

  --autopilot:
    sets:
      auto: true
      agents: true
      merge_to_main: true
    description: Full autonomy. Implicit when the autopilot skill dispatches; the terminal complete-workflow step merges to the default branch and removes the worktree; do not pause for signoff or flag confirmation.

  # --bugfix routes to the bugfix schema via select-workflow rather than
  # flipping flags on feature. select-workflow.yaml owns this routing.

# ── Workflow selection guidelines ──────────────────────────────────
# Read by config/steps/select-workflow.yaml at orchestrate-time. Trigger
# keywords are the literal-match fast path; semantic match against the
# description is the fallback.
guidelines:
  feature: >
    Default schema for any change that adds, modifies, or cleans up
    production behavior. Full pipeline: discovery → design → execute →
    review → archive.
    Triggers: "add", "implement", "feature", "build", "create".
    Compose with --light for tight-scope work that lowers the review
    threshold to 7.

  bugfix: >
    Use when something is broken, regressing, or producing incorrect
    output. Same pipeline shape as feature but starts with diagnose
    (reproduce + root-cause) and the first task is always the regression
    test.
    Triggers: "fix", "broken", "regression", "crash", "error when".
