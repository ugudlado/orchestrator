# Workflow selection guidelines — LLM picks best match by semantic similarity.
# Each entry describes the intent and context where that schema should be used.

feature: >
  Use for any change that adds, modifies, or cleans up production behavior.
  The schema scales from full discovery-through-archive for substantial new
  capabilities down to a lightweight path for tight-scope work via the
  --light flag.

  Full path (default): new API endpoint, new UI component, new workflow
  schema — anything that benefits from discovery, design, and phased review.

  Light path (--light): dependency bumps, renames, config tweaks, typo
  fixes, small UI polish, adding a single flag, and other housekeeping
  where the spec is a short idea doc and the whole thing ships in an
  afternoon. Triggers: "bump", "rename", "tweak", "small change", "quick
  fix", "cleanup". Light mode skips discovery/design/UX/TDD/simplify/
  phase-reviews/worktree/Linear by default; add --tdd or similar to
  re-enable a specific gate.

bugfix: >
  Use when something is broken, regressing, or producing incorrect output.
  Examples: test failure, runtime error, wrong calculation, broken integration.
  Triggers: "fix", "broken", "regression", "crash", "error when doing X".

spike: >
  Use when exploring an unknown problem space before committing to a solution.
  Produces a time-boxed findings document, not production code.
  Examples: "prototype X", "explore Y", "POC for Z", "try approach A".

bootstrap: >
  Use only to initialize a new project repo with standard tooling (Makefile, CLAUDE.md,
  spec/project.yaml, .gitignore). Runs in-place, no worktree, no Linear ticket.
  Triggers: "setup tooling", "bootstrap this repo", "initialize project".

autopilot: >
  Use to run an autonomous multi-iteration development loop — picks work from the
  backlog, executes each ticket via /develop with full autonomy, and records a session
  log across context resets. No worktree, no per-change state.yaml in the main flow.
  Triggers: "autopilot", "autonomous", "run N iterations", "self-improve".
