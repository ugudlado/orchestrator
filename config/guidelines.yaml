# Workflow selection guidelines — read by config/steps/select-workflow.yaml
# at orchestrate-time. Trigger keywords are the literal-match fast path;
# semantic match against the description is the fallback.

feature: >
  Default schema for any change that adds, modifies, or cleans up
  production behavior. Full pipeline: discovery → design → execute →
  review → archive.
  Triggers: "add", "implement", "feature", "build", "create".
  Compose with --light for tight-scope work that lowers the review
  threshold to 7.

bugfix: >
  Use when something is broken, regressing, or producing incorrect
  output. Same pipeline shape as feature but starts with diagnose
  (reproduce + root-cause) and the first task is always the regression
  test.
  Triggers: "fix", "broken", "regression", "crash", "error when".

