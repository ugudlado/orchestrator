name: spec-workflow-grammar
version: 4

description: >
  Formal grammar for the workflow system. Defines what's valid YAML for
  workflow schemas, step contracts, the central flag registry, project
  configs, and state files.
  v4: Schemas collapsed to flat `steps:` lists. Phase grouping removed
  from user-facing config (engine synthesizes a single `main` phase).
  Flags and defaults moved to a central `config/flags.yaml`. Schema
  files now declare only `steps:` (and rarely `defaults:` overrides
  or workflow-level `rules:`).

# ─── SCHEMA GRAMMAR ────────────────────────────────────────────────
# Schema name comes from the filename: config/workflows/<name>.yaml.
# Spike retains a legacy multi-phase shape for the dispatcher's attempt
# counting; new schemas should use the flat shape.

schema:
  required:
    steps: list<step_entry>           # Ordered execution steps

  optional:
    defaults: map<string, any>        # Per-workflow overrides of flags.yaml gate/behavioral defaults
    rules: list<rule>                 # Workflow-level rules (rare — prefer step-contract rules)

# ─── STEP ENTRY GRAMMAR ────────────────────────────────────────────
# Steps in a workflow's `steps:` list are usually plain strings.
# Use the dict form only when overriding `repeat_until` from the contract.
# Flag-based gating ("step-id if <flag>") is gone — gates live in
# config/flags.yaml.

step_entry:
  forms:
    - pattern: "<step-id>"
      example: "execute-next-task"

    - pattern:
        id: string                    # Step ID
        repeat_until: string          # Override contract's repeat predicate
        extra_rules: list<string>     # Inject rules just for this schema's use of the step
        rules_when:                   # Flag-conditional rules (rare)
          <flag>: list<string>
          not <flag>: list<string>

# ─── PHASE GRAMMAR ─────────────────────────────────────────────────
# The engine synthesizes a single "main" phase for any schema with
# top-level `steps:`.

phase:
  required:
    name: string
    steps: list<step_entry>

  optional:
    requires: string                  # Previous phase that must complete first
    goal: string
    rules: list<string>
    verify: verify_block

# ─── STEP CONTRACT GRAMMAR ─────────────────────────────────────────

step:
  required:
    id: string
    version: integer
    intent: string                    # One-line purpose
    instruction: string               # Multi-line execution logic

  optional:
    agent: string                     # Agent that runs this step (omitted for inline scripts)
    inline: boolean                   # True for scripted steps with no agent spawn
    run: path                         # Adapter or script path
    inputs: list<string>
    outputs: list<string>
    rules: list<string>               # Step rules (always applied)
    flags_read: list<flag_ref>        # Documents which flags this step honors
    verify: verify_block | list<string>
    repeat_until: string              # If the step loops internally (ORC-65: all_tasks_completed removed)

# ─── FLAG REGISTRY GRAMMAR ─────────────────────────────────────────
# Single source of truth: config/flags.yaml.

flag_registry:
  required:
    gates:                            # Flags that filter steps from a workflow's list
      <flag>:
        steps: list<string>           # Step IDs this gate controls
        default: boolean              # Global default (workflow `defaults:` may override)
    cli:                              # CLI flags users type
      <--name>:
        sets: map<string, any>        # Underlying flag values to apply
        description: string

  optional:
    behavioral:                       # Flags that change behavior without filtering steps
      <flag>:
        default: boolean
        description: string

# ─── VERIFY GRAMMAR ────────────────────────────────────────────────

verify_block:
  optional:
    commands: list<string>
    assertions: list<string>
    metrics:
      <name>:
        min: number
        max: number
        when: string                  # Only check when flag is truthy
    max_retries: integer
    on_max_retries: string

# ─── RULE GRAMMAR ──────────────────────────────────────────────────

rule:
  forms:
    - pattern: string                 # Plain rule
      example: "Keep changes scoped to the current task."

    - pattern:
        id: string                    # Named rule (overridable by id at lower tiers)
        rule: string
        when: string                  # Only active when flag is truthy

# ─── PROJECT CONFIG GRAMMAR ────────────────────────────────────────

project:
  required:
    version: integer
    project:
      name: string
      repo: string
      summary: string

  optional:
    context:
      tech_stack: list<string>
      conventions: list<string>
    quality_bar:
      min_phase_review_score: integer
      max_retry_rounds: integer
    storage:
      active_changes_root: path
      repo_archive_root: path
    signoff_policy: map<string, string>
    rules: list<rule>

# ─── STATE FILE GRAMMAR ────────────────────────────────────────────

state:
  required:
    schema: string                    # Filename of the active workflow (e.g. "feature")
    status: enum[active, completed, paused]
    phase: string                     # "main" for flat schemas
    flags: map<string, any>           # Resolved flag values (after CLI + workflow defaults + flags.yaml)
    workflow_plan: map                # { phase: { active: [...], filtered: [...] } }
    started_at: datetime

  optional:
    change_id: string
    next_step:
      phase: string
      step_id: string
    step_history: list<step_record>
    metrics: swe_metrics

step_record:
  required:
    step_id: string
    phase: string
    status: enum[completed, skipped, failed, escalate_to_architect]
  optional:
    agent: string
    started_at: datetime
    completed_at: datetime
    attempt: integer
    usage: map                        # { input_tokens, output_tokens, cache_read_input_tokens, cost_usd, duration_ms, tool_calls }
    evidence: map

# ─── EVOLUTION ─────────────────────────────────────────────────────
#
# Workflow (frequent): /learn proposes changes to step contracts, the
# flag registry, agent prompts, project rules, and templates.
#
# Grammar (rare): when a workflow needs a construct this grammar can't
# express, propose an addition with rationale and example.
#
# Evolution log:
#   v1: schemas, phases, steps, verify, rules, flags
#   v2: agent field on step entries
#   v3: swe_metrics for benchmark-aligned measurement
#   v4: phases collapsed to flat steps; flags/defaults moved to
#       central flags.yaml; workflow files reduced to `steps:` only
