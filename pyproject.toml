[project]
name = "orchestrator"
version = "0.1.0"
description = "LLM-agnostic config-driven workflow engine"
authors = [{ name = "Mahesh", email = "mahesh288@gmail.com" }]
requires-python = ">=3.14"  # uuid.uuid7 (paths.new_run_id)
dependencies = [
    "pyyaml>=6.0",
]

# The wheel ships the engine ONLY — workflows come from orchestrator pack
# vendor (.orchestrator/) or a downloaded pack (~/.orchestrator/pack).
#
# Optional extras:
#   dev      — test/lint tooling
#   headless — the model client `orchestrator run --headless` drives. The
#              engine core never imports it; harness-driven runs need no SDK.
[project.optional-dependencies]
headless = [
    "anthropic>=0.40",
]
judge = [
    "typesafe-sdk",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "vulture>=2.16",
    "anthropic>=0.40",
    "typesafe-sdk",
]

[project.scripts]
orchestrator = "orchestrator_next.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator_next"]

[tool.ruff]
line-length = 120
