[tool.poetry]
name = "orchestrator"
version = "0.1.0"
description = "LLM-agnostic config-driven workflow engine"
authors = ["Mahesh <mahesh288@gmail.com>"]
# The wheel ships the engine ONLY — workflows come from orchestrator pack
# vendor (.orchestrator/) or a downloaded pack (~/.orchestrator/pack).
packages = [
    { include = "orchestrator_next" },
]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.4"
vulture = "^2.16"

[tool.poetry.scripts]
orchestrator = "orchestrator_next.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"orchestrator_next/tests/*" = ["F821", "E702"]

[tool.pytest.ini_options]
testpaths = ["orchestrator_next/tests"]
