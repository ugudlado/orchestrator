[project]
name = "orchestrator"
version = "0.1.0"
description = "Stateless, LLM-agnostic workflow engine: config + last outcome -> next step"
authors = [{ name = "Mahesh", email = "mahesh288@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

# The wheel ships the engine and, as its own package, the self-hosted driver
# (orchestrator_driver, whose Postgres store is the only user of psycopg; the engine
# never imports it). Packs (workflows, step contracts, charters, scripts) are
# installed separately and passed with --config.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "vulture>=2.16",
]

[project.scripts]
orchestrator = "orchestrator_next.cli:main"
orchestrator-driver = "orchestrator_driver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator_next", "orchestrator_driver"]

[tool.ruff]
line-length = 120
