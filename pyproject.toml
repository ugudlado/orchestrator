[project]
name = "orchestrator"
version = "0.1.0"
description = "Stateless, LLM-agnostic workflow engine: config + last outcome -> next step"
authors = [{ name = "Mahesh", email = "mahesh288@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

# The wheel ships the engine ONLY. Packs (workflows, step contracts,
# charters, scripts) are installed separately and passed with --config.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "vulture>=2.16",
]

[project.scripts]
orchestrator = "orchestrator_next.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator_next"]

[tool.ruff]
line-length = 120
