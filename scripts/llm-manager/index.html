<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Manager — RunPod</title>
<style>
  :root { --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e1e4ed; --dim: #8b8fa3; --accent: #6366f1; --green: #22c55e; --red: #ef4444; --yellow: #eab308; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 20px; font-weight: 500; }
  h1 span { color: var(--dim); font-weight: 400; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); margin-bottom: 12px; }

  .pod { padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .pod-info { font-size: 13px; font-family: 'SF Mono', monospace; }
  .pod-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .pod-empty { color: var(--dim); font-size: 13px; padding: 8px 0; }

  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }
  .dot-yellow { background: var(--yellow); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 12px; color: var(--dim); }
  input { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; color: var(--text); font-size: 13px; font-family: 'SF Mono', monospace; }
  input:focus { outline: none; border-color: var(--accent); }

  button { padding: 6px 14px; border-radius: 6px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-danger { background: var(--red); color: white; font-size: 11px; padding: 4px 10px; }

  .log { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-family: 'SF Mono', monospace; font-size: 12px; color: var(--dim); white-space: pre-wrap; max-height: 200px; overflow-y: auto; margin-top: 12px; display: none; }
  .log.visible { display: block; }

  .presets { display: flex; gap: 6px; margin-bottom: 8px; }
  .preset { padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--dim); font-size: 11px; cursor: pointer; }
  .preset:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>

<h1>LLM Manager <span>/ RunPod</span></h1>

<div class="card">
  <h2>Pods</h2>
  <div id="pods-list"><div class="pod-empty">Loading...</div></div>
</div>

<div class="card">
  <h2>Deploy</h2>
  <div class="presets">
    <button class="preset" onclick="applyPreset('coder')">Coder 30B</button>
    <button class="preset" onclick="applyPreset('thinking')">Thinking 30B</button>
    <button class="preset" onclick="applyPreset('coder-next')">Coder Next 80B</button>
  </div>
  <div class="form-grid">
    <div class="form-group"><label>Pod Name</label><input id="f-name" value="coder"></div>
    <div class="form-group"><label>Model</label><input id="f-model" value="QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ"></div>
    <div class="form-group"><label>GPU</label><input id="f-gpu" value="NVIDIA A40"></div>
    <div class="form-group"><label>Fallbacks</label><input id="f-fallbacks" value="NVIDIA RTX A6000"></div>
    <div class="form-group"><label>Disk (GB)</label><input id="f-disk" type="number" value="50"></div>
  </div>
  <button class="btn-primary" id="btn-create" onclick="createPod()">Create Pod</button>
  <div class="log" id="log"></div>
</div>

<script>
const PRESETS = {
  coder: { name: 'coder', model: 'QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ', gpu: 'NVIDIA A40', fallbacks: 'NVIDIA RTX A6000', disk: 50 },
  thinking: { name: 'thinker', model: 'cyankiwi/Qwen3-30B-A3B-Thinking-2507-AWQ-8bit', gpu: 'NVIDIA A40', fallbacks: 'NVIDIA RTX A6000', disk: 50 },
  'coder-next': { name: 'coder-80b', model: 'cyankiwi/Qwen3-Coder-Next-AWQ-4bit', gpu: 'NVIDIA A100 80GB PCIe', fallbacks: '', disk: 80 },
};

function applyPreset(p) {
  const d = PRESETS[p]; if (!d) return;
  document.getElementById('f-name').value = d.name;
  document.getElementById('f-model').value = d.model;
  document.getElementById('f-gpu').value = d.gpu;
  document.getElementById('f-fallbacks').value = d.fallbacks;
  document.getElementById('f-disk').value = d.disk;
}

function log(msg) { const el = document.getElementById('log'); el.classList.add('visible'); el.textContent = msg; }
function dot(c) { const s = document.createElement('span'); s.className = 'dot dot-' + c; return s; }

async function refresh() {
  try {
    const data = await fetch('/api/status').then(r => r.json());
    const el = document.getElementById('pods-list');
    el.replaceChildren();
    if (data.error) { const e = document.createElement('div'); e.className = 'pod-empty'; e.textContent = data.error; el.appendChild(e); return; }
    const pods = data.pods || [];
    if (!pods.length) { const e = document.createElement('div'); e.className = 'pod-empty'; e.textContent = 'No active pods'; el.appendChild(e); return; }
    for (const pod of pods) {
      const row = document.createElement('div'); row.className = 'pod';
      const left = document.createElement('div');
      const info = document.createElement('div'); info.className = 'pod-info';
      const up = pod.desiredStatus === 'RUNNING' && pod.runtime?.uptimeInSeconds > 0;
      info.appendChild(dot(up ? 'green' : 'yellow'));
      info.appendChild(document.createTextNode(pod.name || pod.id));
      left.appendChild(info);
      const meta = document.createElement('div'); meta.className = 'pod-meta';
      meta.textContent = [pod.machine?.gpuDisplayName, pod.costPerHr ? '$' + pod.costPerHr.toFixed(2) + '/hr' : '', pod.runtime?.uptimeInSeconds ? Math.round(pod.runtime.uptimeInSeconds / 60) + 'min' : 'booting'].filter(Boolean).join(' | ');
      left.appendChild(meta);
      const btn = document.createElement('button'); btn.className = 'btn-danger'; btn.textContent = 'Terminate';
      btn.onclick = () => terminatePod(pod.id, pod.name);
      row.appendChild(left); row.appendChild(btn);
      el.appendChild(row);
    }
  } catch {}
}

async function createPod() {
  const btn = document.getElementById('btn-create');
  btn.disabled = true; btn.textContent = 'Creating...'; log('Creating pod...');
  try {
    const resp = await fetch('/api/pods', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: document.getElementById('f-name').value, model: document.getElementById('f-model').value, gpu: document.getElementById('f-gpu').value, gpu_fallbacks: document.getElementById('f-fallbacks').value, container_disk: parseInt(document.getElementById('f-disk').value) }),
    });
    const data = await resp.json();
    log(data.ok ? 'Created: ' + data.pod.id + ' (' + (data.pod.machine?.gpuDisplayName || '?') + ')' : 'Failed: ' + (data.error || ''));
    refresh();
  } catch (e) { log('Error: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Create Pod'; }
}

async function terminatePod(id, name) {
  if (!confirm('Terminate ' + (name || id) + '?')) return;
  log('Terminating...');
  const data = await fetch('/api/pods/' + id, { method: 'DELETE' }).then(r => r.json());
  log(data.ok ? 'Terminated.' : data.error);
  refresh();
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
