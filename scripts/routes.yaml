# Agent routing — WHO does the work
# native_<model> = host sub-agent, anything else = proxy via model_list
agents:
  architect:    native_opus
  ideator:      native_opus
  reviewer:     native_sonnet
  developer:    qwen
  discoverer:   qwen
  sonnet-agent: qwen
  haiku-agent:  qwen

# Model backends — WHERE it runs
# Compatible with LiteLLM config format (model_list + litellm_params)
model_list:
  - model_name: qwen
    litellm_params:
      model: openrouter/qwen/qwen3-coder-30b-a3b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: qwen-local
    litellm_params:
      model: coder
      api_key: os.environ/LLM_MANAGER_KEY
      api_base: http://localhost:3456/v1

  - model_name: klm-local
    litellm_params:
      api_base: http://localhost:8000/v1
