# Agent routing — native_<model> = host sub-agent, else = proxy
agents:
  architect:         native_opus
  ideator:           native_opus
  reviewer:          native_sonnet
  developer:         native_sonnet
  discoverer:        native_sonnet
  workflow-improver: native_sonnet
  sonnet-agent:      native_sonnet
  haiku-agent:       native_sonnet

# Model backends
models:
  qwen:
    url: https://openrouter.ai/api/v1
    model: qwen/qwen3-coder-30b-a3b-instruct
    api_key: $OPENROUTER_API_KEY

  qwen-local:
    url: http://localhost:3456/v1
    model: coder
    api_key: $LLM_MANAGER_KEY

# Backend → model-id mapping for cost computation in record.py.
# Keys match `agents.<agent>` values for native (non-proxy) backends.
# Values match model_id in the DuckDB pricing table.
backends:
  native_opus:   claude-opus-4-7
  native_sonnet: claude-sonnet-4-6
  native_haiku:  claude-haiku-4-5
