<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Orchestrator Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c232c;
    --border: #2a313a;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad:  #f85149;
    --live: #ff7b72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg); color: var(--fg);
  }
  h1 {
    font-size: 16px; font-weight: 600; margin: 0 0 12px;
    display: flex; align-items: baseline; gap: 12px;
  }
  h1 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good); display: inline-block;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .totals {
    display: flex; gap: 16px; margin-bottom: 14px;
    color: var(--muted); font-size: 12px; flex-wrap: wrap;
  }
  .totals b { color: var(--fg); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top; white-space: nowrap;
  }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr.feature { cursor: pointer; }
  tr.feature:hover { background: var(--panel-2); }
  tr.feature.active td:first-child::before {
    content: ""; display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--live);
    margin-right: 6px; vertical-align: middle;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .repo { color: var(--muted); font-size: 11px; }
  .change { color: var(--fg); }
  .phase {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    background: var(--panel-2); color: var(--accent); font-size: 11px;
  }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .status-completed { color: var(--good); }
  .status-in_progress { color: var(--warn); }
  .status-failed { color: var(--bad); }
  .status-recovered { color: var(--accent); }
  .status-abandoned { color: var(--muted); }
  .detail {
    background: var(--panel); padding: 12px 14px;
    border-left: 2px solid var(--accent);
  }
  .detail table { background: var(--panel-2); }
  .step-row { cursor: pointer; }
  .step-row:hover { background: rgba(88,166,255,0.06); }
  .tools-row td { background: #0f141a; padding: 6px 16px; color: var(--muted); }
  .tool-chip {
    display: inline-block; margin: 0 8px 4px 0; padding: 2px 6px;
    background: var(--panel-2); border-radius: 3px; font-size: 11px;
  }
  .tool-chip b { color: var(--fg); }
  .activity-feed {
    margin-bottom: 8px; padding: 6px 10px;
    background: #0a0f14; border-left: 2px solid var(--live);
    font-size: 11px;
  }
  .activity-feed .label {
    color: var(--live); font-weight: 600; margin-right: 8px;
  }
  .activity-feed .row { display: flex; gap: 10px; padding: 2px 0; align-items: baseline; }
  .activity-feed .tool { color: var(--accent); min-width: 80px; }
  .activity-feed .args {
    color: var(--fg); flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-family: ui-monospace, monospace;
  }
  .activity-feed .age { color: var(--muted); white-space: nowrap; }
  .activity-feed .note { color: var(--muted); font-style: italic; }
  .cli-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 11px; border: 1px solid; letter-spacing: 0.02em;
  }
  .live-bar { color: var(--live); font-size: 11px; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); padding: 12px; }
</style>
</head>
<body>

<h1>
  <span class="dot"></span>
  Orchestrator Live
  <span class="muted" id="updatedAt" style="font-size:11px;font-weight:400"></span>
</h1>

<div class="totals" id="totals">loading…</div>

<table id="featuresTable">
  <thead>
    <tr>
      <th></th>
      <th>Feature</th>
      <th>Phase / Next</th>
      <th class="num">Steps</th>
      <th class="num">Duration</th>
      <th class="num">In ↑ / Out ↓ tokens</th>
      <th class="num">Cost $</th>
      <th>Last activity</th>
    </tr>
  </thead>
  <tbody id="featuresBody"></tbody>
</table>

<div id="err" class="err" hidden></div>

<script>
// All DOM construction uses textContent/createElement — no innerHTML on user data.
const expanded = new Set();   // "repoName|changeId"
let routes = { agents: {}, models: {} };

async function loadRoutes() {
  try {
    const res = await fetch("/api/routes");
    if (res.ok) routes = await res.json();
  } catch (e) { /* tolerate */ }
}

function routeFor(agentName) {
  const r = (routes.agents || {})[agentName];
  if (!r) return null;
  const modelId = (routes.models || {})[r.model] || r.model;
  return { subprocess: r.subprocess, modelTier: r.model, modelId };
}

const CLI_COLORS = {
  claude: "#d29922",
  codex:  "#3fb950",
  cursor: "#58a6ff",
  pi:     "#bc8cff",
};
function cliBadge(sub) {
  const span = document.createElement("span");
  span.className = "cli-badge";
  span.textContent = sub;
  span.style.background = (CLI_COLORS[sub] || "#444") + "22";
  span.style.color = CLI_COLORS[sub] || "#888";
  span.style.borderColor = (CLI_COLORS[sub] || "#444") + "55";
  return span;
}

function basename(p) {
  if (!p) return "";
  return p.split("/").filter(Boolean).pop() || "";
}
function fmtDuration(ms) {
  if (!ms) return "—";
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + "s";
  const m = Math.floor(s / 60), rs = Math.floor(s % 60);
  if (m < 60) return `${m}m ${rs}s`;
  const h = Math.floor(m / 60), rm = m % 60;
  return `${h}h ${rm}m`;
}
function fmtTokens(n) {
  if (!n) return "0";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
}
function fmtCost(c) {
  if (!c) return "—";
  if (c < 0.01) return "<$0.01";
  return "$" + c.toFixed(2);
}
function fmtRelTime(iso) {
  if (!iso) return "—";
  const t = new Date(iso).getTime();
  const dt = Math.max(0, Date.now() - t) / 1000;
  if (dt < 60) return Math.floor(dt) + "s ago";
  if (dt < 3600) return Math.floor(dt / 60) + "m ago";
  if (dt < 86400) return Math.floor(dt / 3600) + "h ago";
  return new Date(iso).toLocaleString();
}

function el(tag, opts = {}, ...children) {
  const node = document.createElement(tag);
  if (opts.class) node.className = opts.class;
  if (opts.text != null) node.textContent = String(opts.text);
  if (opts.dataset) for (const k in opts.dataset) node.dataset[k] = opts.dataset[k];
  if (opts.style) node.setAttribute("style", opts.style);
  if (opts.hidden) node.hidden = true;
  if (opts.colspan) node.setAttribute("colspan", String(opts.colspan));
  if (opts.title) node.title = String(opts.title);
  for (const c of children) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

// Only write to the DOM when the value actually changed — avoids repaints.
function setText(node, value) {
  const v = value == null ? "" : String(value);
  if (node.textContent !== v) node.textContent = v;
}
function setAttr(node, name, value) {
  const v = value == null ? "" : String(value);
  if (node.getAttribute(name) !== v) node.setAttribute(name, v);
}
function setClass(node, cls) {
  if (node.className !== cls) node.className = cls;
}
function setHidden(node, h) {
  if (node.hidden !== !!h) node.hidden = !!h;
}

// Diff a list of children by key. Reuse existing nodes by data-key; create
// missing ones via `create(key, item)`, update via `update(node, item)`.
// Detail rows (matching `.detail-row[data-key=k]`) stay paired with their feature row.
function diffKeyedRows(parent, items, getKey, create, update, detailFor) {
  const existing = new Map();
  for (const row of parent.querySelectorAll(":scope > tr.feature")) {
    existing.set(row.dataset.key, row);
  }

  const keepKeys = new Set();
  let cursor = null;  // tracks where we should insert/move

  for (const item of items) {
    const key = getKey(item);
    keepKeys.add(key);

    let row = existing.get(key);
    let detail = row ? parent.querySelector(`:scope > tr.detail-row[data-key="${cssEscape(key)}"]`) : null;

    if (!row) {
      row = create(key, item);
      detail = detailFor(key, item);
      // Insert after cursor (or at end)
      parent.insertBefore(row, cursor ? cursor.nextSibling : parent.firstChild);
      parent.insertBefore(detail, row.nextSibling);
    } else {
      update(row, item, key);
      // Re-order: if row isn't at the cursor position, move it
      const desiredPos = cursor ? cursor.nextSibling : parent.firstChild;
      if (row !== desiredPos) {
        parent.insertBefore(row, desiredPos);
        if (detail) parent.insertBefore(detail, row.nextSibling);
      }
    }
    cursor = detail || row;
  }

  // Remove rows that fell off the list
  for (const [key, row] of existing) {
    if (!keepKeys.has(key)) {
      const detail = parent.querySelector(`:scope > tr.detail-row[data-key="${cssEscape(key)}"]`);
      row.remove();
      if (detail) detail.remove();
    }
  }
}

async function refresh() {
  try {
    const res = await fetch("/api/fleet");
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    document.getElementById("err").hidden = true;
    renderFleet(data);
    for (const k of expanded) {
      const [repo, change] = k.split("|");
      loadDetail(repo, change);
    }
    // After detail tables have updated, refresh any visible activity feeds
    setTimeout(refreshActivities, 100);
  } catch (e) {
    const el2 = document.getElementById("err");
    el2.hidden = false;
    el2.textContent = "Fetch failed: " + e.message;
  }
}

function renderFleet(data) {
  renderTotals(data);
  setText(document.getElementById("updatedAt"), "updated " + new Date().toLocaleTimeString());

  const body = document.getElementById("featuresBody");
  diffKeyedRows(
    body,
    data.features,
    (f) => `${basename(f.repo_root)}|${f.change_id}`,
    createFeatureRow,
    updateFeatureRow,
    (key, f) => createDetailRow(key, f),
  );
}

function renderTotals(data) {
  const t = data.totals;
  const totals = document.getElementById("totals");
  // Build the 5 spans once; thereafter just update their text.
  if (!totals.dataset.init) {
    totals.replaceChildren();
    totals.appendChild(el("span", { dataset: { k: "active" } }));
    totals.appendChild(el("span", { dataset: { k: "total" } }));
    totals.appendChild(el("span", { dataset: { k: "tokens" } }));
    const spend = el("span", { dataset: { k: "spend" } });
    spend.appendChild(document.createTextNode("cumulative spend: "));
    spend.appendChild(el("b"));
    totals.appendChild(spend);
    totals.appendChild(el("span", { dataset: { k: "repos" } }));
    totals.dataset.init = "1";
  }
  setText(totals.querySelector('[data-k="active"]'), `${t.active_features} active`);
  setText(totals.querySelector('[data-k="total"]'), `${t.total_features} total tracked`);
  setText(totals.querySelector('[data-k="tokens"]'),
    `${fmtTokens(t.total_input_tokens)} in / ${fmtTokens(t.total_output_tokens)} out`);
  setText(totals.querySelector('[data-k="spend"] b'), fmtCost(t.total_cost_usd));
  setText(totals.querySelector('[data-k="repos"]'), `${data.registered_repos.length} repos`);
}

function createFeatureRow(key, f) {
  const repoName = basename(f.repo_root);
  const tr = el("tr", { class: f.is_active ? "feature active" : "feature", dataset: { key } });
  tr.appendChild(el("td"));                            // status dot column

  const featTd = el("td");
  featTd.appendChild(el("span", { class: "change" }));
  featTd.appendChild(el("br"));
  featTd.appendChild(el("span", { class: "repo" }));
  tr.appendChild(featTd);

  const phaseTd = el("td");
  phaseTd.appendChild(el("span", { class: "phase" }));
  phaseTd.appendChild(el("span", { class: "next muted" }));
  tr.appendChild(phaseTd);

  const stepsTd = el("td", { class: "num" });
  stepsTd.appendChild(el("span", { class: "n" }));
  stepsTd.appendChild(el("span", { class: "status-failed fc" }));
  tr.appendChild(stepsTd);

  tr.appendChild(el("td", { class: "num dur" }));
  tr.appendChild(el("td", { class: "num tok" }));
  tr.appendChild(el("td", { class: "num cost" }));
  tr.appendChild(el("td", { class: "last muted" }));

  tr.addEventListener("click", () => toggleFeature(key));
  updateFeatureRow(tr, f, key);
  return tr;
}

function updateFeatureRow(tr, f, key) {
  const repoName = basename(f.repo_root);
  setClass(tr, f.is_active ? "feature active" : "feature");

  const cells = tr.children;
  // cells[0] is the status-dot spacer
  setText(cells[1].querySelector(".change"), f.change_id);
  const repoLabel = repoName + (f.linear_ticket ? " · " + f.linear_ticket : "");
  setText(cells[1].querySelector(".repo"), repoLabel);

  const phaseSpan = cells[2].querySelector(".phase");
  const nextSpan = cells[2].querySelector(".next");
  setText(phaseSpan, f.phase || "");
  setHidden(phaseSpan, !f.phase);
  setText(nextSpan, f.next_step ? " → " + f.next_step : "");
  setHidden(nextSpan, !f.next_step);

  setText(cells[3].querySelector(".n"), String(f.step_count));
  const fc = cells[3].querySelector(".fc");
  setText(fc, f.failed_count ? ` (${f.failed_count}f)` : "");
  setHidden(fc, !f.failed_count);

  setText(cells[4], fmtDuration(f.total_duration_ms));
  setText(cells[5], fmtTokens(f.total_input_tokens) + " / " + fmtTokens(f.total_output_tokens));
  setText(cells[6], fmtCost(f.total_cost_usd));
  setText(cells[7], fmtRelTime(f.last_activity));
  setAttr(cells[7], "title", f.last_activity || "");
}

function createDetailRow(key, f) {
  const detailTr = el("tr", { class: "detail-row", dataset: { key }, hidden: !expanded.has(key) });
  const detailTd = el("td", { class: "detail", colspan: 8 });
  const content = el("div", { class: "detail-content", text: "loading…" });
  detailTd.appendChild(content);
  detailTr.appendChild(detailTd);
  if (expanded.has(key)) {
    const [repo, change] = key.split("|");
    loadDetail(repo, change);
  }
  return detailTr;
}

function toggleFeature(key) {
  const row = document.querySelector(`tr.detail-row[data-key="${cssEscape(key)}"]`);
  if (!row) return;
  if (expanded.has(key)) {
    expanded.delete(key);
    row.hidden = true;
  } else {
    expanded.add(key);
    row.hidden = false;
    const [repo, change] = key.split("|");
    loadDetail(repo, change);
  }
}

async function loadDetail(repoName, changeId) {
  const key = `${repoName}|${changeId}`;
  const row = document.querySelector(`tr.detail-row[data-key="${cssEscape(key)}"]`);
  if (!row) return;
  const container = row.querySelector(".detail-content");
  try {
    const res = await fetch(`/api/feature/${encodeURIComponent(repoName)}/${encodeURIComponent(changeId)}`);
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    renderSteps(container, data);
  } catch (e) {
    container.replaceChildren(el("span", { class: "err", text: e.message }));
  }
}

// Update the step table in place. First call builds the table; subsequent
// calls diff rows by step-key so cells flicker only when their text changes.
function renderSteps(container, data) {
  if (!data.steps || !data.steps.length) {
    container.replaceChildren(el("span", { class: "muted", text: "no step events yet" }));
    return;
  }
  let table = container.querySelector("table.steps-table");
  let tbody;
  if (!table) {
    container.replaceChildren();
    table = el("table", { class: "steps-table" });
    const thead = el("thead");
    const headTr = el("tr");
    ["Phase / Step", "Agent", "CLI", "Status", "Model", "Dur", "In ↑ / Out ↓ (cache r/c)", "Cost", "Started"].forEach((h, i) => {
      headTr.appendChild(el("th", { class: i >= 5 && i <= 7 ? "num" : "", text: h }));
    });
    thead.appendChild(headTr);
    table.appendChild(thead);
    tbody = el("tbody");
    table.appendChild(tbody);
    container.appendChild(table);
  } else {
    tbody = table.querySelector("tbody");
  }

  diffStepRows(tbody, data.steps);
}

function stepKey(s) { return `${s.phase}|${s.step_id}|${s.attempt}`; }

function diffStepRows(tbody, steps) {
  const existing = new Map();
  for (const row of tbody.querySelectorAll(":scope > tr.step-row")) {
    existing.set(row.dataset.skey, row);
  }
  const keep = new Set();
  let cursor = null;

  for (const s of steps) {
    const sk = stepKey(s);
    keep.add(sk);
    let row = existing.get(sk);
    let tools = row ? tbody.querySelector(`:scope > tr.tools-row[data-skey="${cssEscape(sk)}"]`) : null;

    if (!row) {
      row = createStepRow(sk, s);
      tools = createToolsRow(sk, s);
      tbody.insertBefore(row, cursor ? cursor.nextSibling : tbody.firstChild);
      tbody.insertBefore(tools, row.nextSibling);
    } else {
      updateStepRow(row, s);
      updateToolsRow(tools, s);
      const desired = cursor ? cursor.nextSibling : tbody.firstChild;
      if (row !== desired) {
        tbody.insertBefore(row, desired);
        if (tools) tbody.insertBefore(tools, row.nextSibling);
      }
    }
    cursor = tools || row;
  }
  for (const [sk, row] of existing) {
    if (!keep.has(sk)) {
      const tools = tbody.querySelector(`:scope > tr.tools-row[data-skey="${cssEscape(sk)}"]`);
      row.remove();
      if (tools) tools.remove();
    }
  }
}

function createStepRow(sk, s) {
  const tr = el("tr", { class: "step-row", dataset: { skey: sk } });
  // 0: phase/step
  const phaseStepTd = el("td");
  phaseStepTd.appendChild(el("span", { class: "phase" }));
  phaseStepTd.appendChild(document.createTextNode(" "));
  phaseStepTd.appendChild(el("span", { class: "step-id" }));
  phaseStepTd.appendChild(el("span", { class: "muted attempt" }));
  tr.appendChild(phaseStepTd);
  // 1: agent
  tr.appendChild(el("td", { class: "agent" }));
  // 2: CLI badge (rebuilt on update only if subprocess changes)
  tr.appendChild(el("td", { class: "cli-cell" }));
  // 3: status
  tr.appendChild(el("td", { class: "status-cell" }));
  // 4: model
  tr.appendChild(el("td", { class: "muted model-cell" }));
  // 5: duration
  tr.appendChild(el("td", { class: "num dur-cell" }));
  // 6: tokens
  const tokTd = el("td", { class: "num" });
  tokTd.appendChild(el("span", { class: "tok-main" }));
  tokTd.appendChild(el("span", { class: "muted tok-cache" }));
  tr.appendChild(tokTd);
  // 7: cost
  tr.appendChild(el("td", { class: "num cost-cell" }));
  // 8: started
  tr.appendChild(el("td", { class: "muted started-cell" }));

  tr.addEventListener("click", () => {
    const trow = tr.parentNode.querySelector(`tr.tools-row[data-skey="${cssEscape(sk)}"]`);
    if (trow) {
      trow.hidden = !trow.hidden;
      if (!trow.hidden) refreshActivities();  // fetch immediately on expand
    }
  });

  updateStepRow(tr, s);
  return tr;
}

function updateStepRow(tr, s) {
  const live = s.status === "in_progress";
  const cells = tr.children;
  setText(cells[0].querySelector(".phase"), s.phase || "");
  setText(cells[0].querySelector(".step-id"), s.step_id || "");
  setText(cells[0].querySelector(".attempt"), s.attempt && s.attempt > 1 ? "  #" + s.attempt : "");

  setText(cells[1], s.agent_name || "");

  // CLI badge — rebuild only if subprocess value changed
  const route = routeFor(s.agent_name);
  const want = route?.subprocess || (s.agent_name === "inline" ? "inline" : "—");
  if (cells[2].dataset.sub !== want) {
    cells[2].replaceChildren();
    if (route?.subprocess) {
      const badge = cliBadge(route.subprocess);
      badge.title = `configured: ${route.subprocess} (model tier: ${route.modelTier})`;
      cells[2].appendChild(badge);
    } else {
      cells[2].appendChild(el("span", { class: "muted", text: want }));
    }
    cells[2].dataset.sub = want;
  }

  setClass(cells[3], "status-" + (s.status || ""));
  setText(cells[3], (s.status || "") + (live ? " ●" : ""));

  setText(cells[4], s.model || "");

  if (s.duration_ms) setText(cells[5], fmtDuration(s.duration_ms));
  else if (live) {
    if (!cells[5].querySelector(".live-bar")) {
      cells[5].replaceChildren(el("span", { class: "live-bar", text: "live" }));
    }
  } else setText(cells[5], "—");

  setText(cells[6].querySelector(".tok-main"),
    fmtTokens(s.input_tokens) + " / " + fmtTokens(s.output_tokens));
  setText(cells[6].querySelector(".tok-cache"),
    (s.cache_read_input_tokens || s.cache_creation_input_tokens)
      ? ` (${fmtTokens(s.cache_read_input_tokens)}r/${fmtTokens(s.cache_creation_input_tokens)}c)` : "");

  setText(cells[7], fmtCost(s.cost_usd));
  setText(cells[8], fmtRelTime(s.started_at));
  setAttr(cells[8], "title", s.started_at || "");
}

function createToolsRow(sk, s) {
  const tr = el("tr", { class: "tools-row", dataset: { skey: sk }, hidden: true });
  const td = el("td", { colspan: 9 });
  td.appendChild(el("div", { class: "activity-feed", hidden: true }));
  td.appendChild(el("div", { class: "tool-chips" }));
  tr.appendChild(td);
  updateToolsRow(tr, s);
  return tr;
}

function updateToolsRow(tr, s) {
  if (!tr) return;
  const td = tr.firstChild;
  const chips = td.querySelector(".tool-chips");
  // signature: tool name list + counts; if unchanged, skip chip re-render
  const sig = (s.tool_calls || []).map(t => `${t.tool_name}:${t.n}:${t.last_seq}`).join("|")
    + "::" + (s.tool_calls_json || "");
  if (chips.dataset.sig !== sig) {
    chips.dataset.sig = sig;
    chips.replaceChildren(renderTools(s));
  }
  // Activity feed handled separately by refreshActivity
}

// Track which (repoName, changeId, sk) tools rows are visible — only fetch
// activity for those, and only for in_progress steps. Re-queried each tick.
function visibleToolsRows() {
  const out = [];
  for (const tr of document.querySelectorAll("tr.tools-row")) {
    if (tr.hidden) continue;
    const detail = tr.closest("tr.detail-row")?.previousSibling
      ? tr.closest(".detail-content")?.closest("tr.detail-row")
      : null;
    // Walk up: tools-row is inside detail-content table inside detail-row td
    const detailRow = tr.closest("tr.detail-row") || tr.parentNode?.closest?.("tr.detail-row");
    // Simpler: detail-row is the nearest ancestor with data-key
    let p = tr.parentNode;
    while (p && !(p.dataset && p.dataset.key)) p = p.parentNode;
    if (!p) continue;
    const [repoName, changeId] = p.dataset.key.split("|");
    const [phase, stepId, attempt] = tr.dataset.skey.split("|");
    out.push({ tr, repoName, changeId, phase, stepId, attempt });
  }
  return out;
}

async function refreshActivities() {
  const targets = visibleToolsRows();
  for (const t of targets) {
    try {
      const url = `/api/feature/${encodeURIComponent(t.repoName)}/${encodeURIComponent(t.changeId)}`
        + `/step/${encodeURIComponent(t.phase)}/${encodeURIComponent(t.stepId)}/${encodeURIComponent(t.attempt)}/activity`;
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      renderActivity(t.tr, data);
    } catch (e) { /* tolerate */ }
  }
}

function renderActivity(toolsTr, data) {
  const feed = toolsTr.querySelector(".activity-feed");
  if (!feed) return;
  const uses = data.tool_uses || [];

  // Hide the feed entirely for non-running or unsupported steps —
  // keeps the existing chip view clean. We only show live activity.
  if (!uses.length) {
    setHidden(feed, true);
    return;
  }
  setHidden(feed, false);

  // Signature gate to avoid re-rendering identical content
  const sig = uses.map(u => `${u.timestamp}|${u.tool_name}|${u.summary}`).join("\n");
  if (feed.dataset.sig === sig) return;
  feed.dataset.sig = sig;

  feed.replaceChildren();
  const header = el("div", { class: "row" });
  header.appendChild(el("span", { class: "label", text: "LIVE" }));
  header.appendChild(el("span", { class: "note",
    text: `${uses.length} recent · source: ${data.source || ""}` }));
  feed.appendChild(header);

  for (const u of uses) {
    const row = el("div", { class: "row" });
    row.appendChild(el("span", { class: "tool", text: u.tool_name || "?" }));
    row.appendChild(el("span", { class: "args", text: u.summary || "" }));
    row.appendChild(el("span", { class: "age", text: fmtRelTime(u.timestamp) }));
    feed.appendChild(row);
  }
}

function renderTools(step) {
  const wrap = el("div");
  if (step.tool_calls && step.tool_calls.length) {
    for (const t of step.tool_calls) {
      const chip = el("span", { class: "tool-chip" });
      chip.appendChild(el("b", { text: t.tool_name || "" }));
      chip.appendChild(document.createTextNode(" ×" + t.n));
      if (t.last_seq != null) {
        chip.appendChild(document.createTextNode(" "));
        chip.appendChild(el("span", { class: "muted", text: "#" + t.last_seq }));
      }
      wrap.appendChild(chip);
    }
    return wrap;
  }
  if (step.tool_calls_json) {
    try {
      const o = JSON.parse(step.tool_calls_json);
      const summary = Object.entries(o).map(([k, v]) => `${k}×${v}`).join(" ");
      wrap.appendChild(el("span", { class: "muted", text: "final counts: " + summary }));
      return wrap;
    } catch (e) {
      // fall through
    }
  }
  wrap.appendChild(el("span", { class: "muted", text: "no tool calls recorded" }));
  return wrap;
}

function cssEscape(s) {
  return s.replace(/["\\]/g, "\\$&");
}

(async () => {
  await loadRoutes();
  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
