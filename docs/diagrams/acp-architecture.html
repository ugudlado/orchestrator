<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACP × Orchestrator</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div style="background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:6px;padding:0.6rem 1rem;margin-bottom:1rem;font:500 0.85rem/1.4 system-ui,sans-serif;max-width:1200px;">⚠️ This diagram predates protocol v2 (Sept 2026) — ACP/buzz/DRIVE.md/Redis are no longer part of the architecture. Kept for historical reference; see docs/protocol-v2.md for the current design.</div>
  <div class="frame">
    <p class="eyebrow">Architecture · Orchestrator</p>
    <h1>ACP after the consolidation</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="acp-orch-title acp-orch-desc">
      <title id="acp-orch-title">ACP after the consolidation</title>
      <desc id="acp-orch-desc">The orchestrator engine drives external coding agents over the Agent Client Protocol: CLI and session entry points feed one drive loop, which claims ready steps in batches, fans agent steps out over the ACP transport to Claude, Codex, or Cursor, and records results into one shared SQLite database.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= zones (bg → zones → arrows → nodes) ================= -->
      <!-- ENTRY -->
      <rect x="24" y="88" width="192" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="88" y="92" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="120" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENTRY</text>

      <!-- ENGINE -->
      <rect x="304" y="88" width="212" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="376" y="92" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="410" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENGINE</text>

      <!-- STATE PLANE -->
      <rect x="304" y="392" width="492" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="472" y="396" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="405" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STATE PLANE · ONE SQLITE DB</text>

      <!-- ================= arrows (before boxes) ================= -->

      <!-- 1. CLI → drive_loop -->
      <line x1="200" y1="152" x2="320" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="240" y="132" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="141" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>

      <!-- 2. CLI → Sessions (vertical) -->
      <line x1="120" y1="184" x2="120" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="132" y="220" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="160" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION</text>

      <!-- 3. Sessions → drive_loop (elbow up) -->
      <path d="M200,296 H252 Q260,296 260,288 V176 Q260,168 268,168 H320"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="270" y="222" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="294" y="231" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">PROMPT</text>

      <!-- 4. drive_loop → dispatch_batch (vertical) -->
      <line x1="408" y1="184" x2="408" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="420" y="220" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">CLAIM</text>

      <!-- 5. dispatch_batch → StateStore (vertical) -->
      <line x1="408" y1="336" x2="408" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="420" y="372" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">CAS WRITE</text>

      <!-- 6. drive_loop → run_agent_step (accent: parallel fan-out) -->
      <line x1="500" y1="152" x2="600" y2="152" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="508" y="132" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="141" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAN-OUT ×N</text>

      <!-- 7. run_agent_step → Agents (external protocol) -->
      <line x1="780" y1="152" x2="836" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="792" y="132" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="808" y="141" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACP</text>

      <!-- 8. run_agent_step → record (vertical) -->
      <line x1="688" y1="192" x2="688" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="700" y="224" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="704" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">COMPLETION</text>

      <!-- 9. record → orchestrator.db (vertical) -->
      <line x1="688" y1="336" x2="688" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="700" y="372" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="704" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">CAS SAVE</text>

      <!-- 11. Sessions → RunStore (dashed, session snapshots, enters bottom edge) -->
      <path d="M120,336 V520 Q120,528 128,528 H708 Q716,528 716,520 V488"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="368" y="506" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="515" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION STATE</text>

      <!-- ================= nodes ================= -->

      <!-- CLI -->
      <rect x="40" y="120" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="120" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="135" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="120" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orchestrator</text>
      <text x="120" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run · research · --resume</text>

      <!-- Sessions -->
      <rect x="40" y="272" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="272" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="278" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="62" y="287" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="120" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sessions</text>
      <text x="120" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sessions.py · in-process</text>

      <!-- drive_loop -->
      <rect x="320" y="120" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="120" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="126" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="344" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="410" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">drive_loop</text>
      <text x="410" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run_loop.py · ThreadPool</text>

      <!-- dispatch_batch -->
      <rect x="320" y="272" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="272" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="278" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="342" y="287" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DAG</text>
      <text x="410" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dispatch_batch</text>
      <text x="410" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">atomic ready-set claim</text>

      <!-- run_agent_step (FOCAL) -->
      <rect x="600" y="120" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="120" width="180" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="608" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="622" y="135" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACP</text>
      <text x="690" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">run_agent_step</text>
      <text x="690" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">acp_client.run_turn</text>
      <text x="690" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fallback: argv shell-out</text>

      <!-- Agents (external) -->
      <rect x="836" y="120" width="140" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="836" y="120" width="140" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="844" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="858" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="906" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ACP agents</text>
      <text x="906" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude · codex · cursor</text>
      <text x="906" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JSON-RPC over stdio</text>

      <!-- record -->
      <rect x="600" y="272" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="272" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="278" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="622" y="287" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REC</text>
      <text x="690" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">record()</text>
      <text x="690" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">history · task_updates</text>

      <!-- orchestrator.db (single shared store) -->
      <rect x="320" y="424" width="460" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="424" width="460" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="328" y="430" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="342" y="439" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>
      <text x="550" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orchestrator.db</text>
      <text x="550" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.orchestrator · workflow state + run blobs + session snapshots + locks</text>
      <text x="550" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remote/central: ORCHESTRATOR_STATE_URL moves ALL tables (sqlite:// or postgresql://)</text>

      <!-- ================= legend ================= -->
      <line x1="30" y1="568" x2="970" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="110" y="580" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="130" y="590" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NEW: ACP + PARALLEL</text>

      <rect x="270" y="580" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="290" y="590" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ENGINE</text>

      <rect x="360" y="580" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="380" y="590" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SHARED SQLITE DB</text>

      <rect x="490" y="580" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="510" y="590" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL AGENT</text>

      <line x1="630" y1="586" x2="662" y2="586" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="670" y="590" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PROTOCOL CALL</text>

      <line x1="790" y1="586" x2="822" y2="586" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="830" y="590" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ASYNC / SNAPSHOT</text>
    </svg>
  </div>
</body>
</html>
