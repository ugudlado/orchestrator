<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket to Done</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Overall flow · serial</p>
    <h1>One ticket, end to end</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="e2e-title e2e-desc">
      <title id="e2e-title">One ticket, end to end</title>
      <desc id="e2e-desc">Swimlane of a ticket's life: a human files it, TeamLead dispatches workflow steps one at a time, each ask travels over the buzz relay to a remote agent that works in its own checkout and pushes the run branch, signed completions come back through the trust gate, and the loop repeats per step until the human approves and the run merges.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- lane dividers -->
      <line x1="30" y1="80"  x2="970" y2="80"  stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="30" y1="176" x2="970" y2="176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="30" y1="272" x2="970" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="30" y1="368" x2="970" y2="368" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="30" y1="464" x2="970" y2="464" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="30" y1="560" x2="970" y2="560" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- lane labels -->
      <text x="40" y="94"  fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HUMAN</text>
      <text x="40" y="190" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TEAMLEAD + ENGINE</text>
      <text x="40" y="286" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BUZZ RELAY</text>
      <text x="40" y="382" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">REMOTE AGENT</text>
      <text x="40" y="478" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIT</text>

      <!-- ================= arrows (before boxes) ================= -->

      <!-- 1 → 2 -->
      <path d="M144,128 H192 Q200,128 200,136 V200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2 → 3 -->
      <path d="M248,224 H296 Q304,224 304,232 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3 → 4 -->
      <path d="M352,320 H400 Q408,320 408,328 V392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4 → 5 (push) -->
      <path d="M456,416 H508 Q516,416 516,424 V488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4 → 6 (reply) -->
      <path d="M456,404 H608 Q616,404 616,396 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 6 → 7 -->
      <path d="M664,320 H736 Q744,320 744,312 V248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 7 → 2 loop back (per step, accent) -->
      <path d="M696,248 V252 Q696,260 688,260 H208 Q200,260 200,252 V248"
            fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="404" y="264" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="273" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT STEP ↩</text>
      <!-- 7 → 8 (await_input) -->
      <path d="M768,224 H816 Q824,224 824,216 V152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 8 → 9 -->
      <path d="M872,128 H920 Q928,128 928,136 V200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ================= step nodes ================= -->

      <!-- 1. Human: file ticket -->
      <rect x="48" y="104" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="104" width="96" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="96" y="124" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">File</text>
      <text x="96" y="140" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ticket</text>

      <!-- 2. TeamLead: dispatch step -->
      <rect x="152" y="200" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="152" y="200" width="96" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="220" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatch</text>
      <text x="200" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">next step</text>

      <!-- 3. Relay: ask -->
      <rect x="256" y="296" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="296" width="96" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="304" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ask</text>
      <text x="304" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@agent</text>

      <!-- 4. Remote agent: work -->
      <rect x="360" y="392" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="392" width="96" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="408" y="412" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull · work</text>
      <text x="408" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">own checkout</text>

      <!-- 5. Git: branch push -->
      <rect x="468" y="488" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="468" y="488" width="96" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="516" y="508" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Branch</text>
      <text x="516" y="524" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">push</text>

      <!-- 6. Relay: signed completion -->
      <rect x="568" y="296" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="296" width="96" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="616" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signed</text>
      <text x="616" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">completion</text>

      <!-- 7. TeamLead: verify + done (trust gate) -->
      <rect x="672" y="200" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="200" width="96" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="720" y="220" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify sig</text>
      <text x="720" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ done</text>

      <!-- 8. Human: approve -->
      <rect x="776" y="104" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="104" width="96" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="824" y="124" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Approve</text>
      <text x="824" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">await_input</text>

      <!-- 9. TeamLead: merge + archive -->
      <rect x="880" y="200" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="200" width="96" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="928" y="220" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merge</text>
      <text x="928" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">archive run</text>

      <!-- ================= legend ================= -->
      <line x1="30" y1="584" x2="970" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="110" y1="600" x2="142" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="150" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HANDOFF</text>

      <line x1="240" y1="600" x2="272" y2="600" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="280" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SERIAL LOOP — EVERY DAG STEP, INCL. VERIFY-CHANGES · APPROVE = AWAIT_INPUT PAUSE</text>
    </svg>
  </div>
</body>
</html>
