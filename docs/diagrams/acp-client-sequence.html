<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACP Turn Lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div style="background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:6px;padding:0.6rem 1rem;margin-bottom:1rem;font:500 0.85rem/1.4 system-ui,sans-serif;max-width:1200px;">⚠️ This diagram predates protocol v2 (Sept 2026) — ACP/buzz/DRIVE.md/Redis are no longer part of the architecture. Kept for historical reference; see docs/protocol-v2.md for the current design.</div>
  <div class="frame">
    <p class="eyebrow">Sequence · Orchestrator · Inside one agent step</p>
    <h1>One ACP turn, end to end</h1>

    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="acp-turn-title acp-turn-desc">
      <title id="acp-turn-title">One ACP turn, end to end</title>
      <desc id="acp-turn-desc">Sequence of a single agent step over the Agent Client Protocol: the engine spawns the agent binary, negotiates the protocol, opens a session, sends one prompt, streams updates and auto-answers permission requests while the agent works, then normalizes the usage into the engine's standard result.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- lifelines -->
      <line x1="160" y1="80" x2="160" y2="640" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="500" y1="80" x2="500" y2="640" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="840" y1="80" x2="840" y2="640" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- opt fragment: model routing -->
      <rect x="448" y="280" width="444" height="64" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="448" y="280" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="468" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="496" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[model routed — best-effort config option]</text>

      <!-- loop fragment: streaming window -->
      <rect x="448" y="404" width="444" height="112" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="448" y="404" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="468" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="496" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[while the agent works · timeout_s cap]</text>

      <!-- activation bars -->
      <rect x="156" y="104" width="8" height="512" fill="rgba(79,93,117,0.10)" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <rect x="496" y="112" width="8" height="480" fill="rgba(79,93,117,0.10)" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <rect x="836" y="144" width="8" height="424" fill="rgba(79,93,117,0.10)" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>

      <!-- m1: run_agent_step → acp_client -->
      <line x1="164" y1="112" x2="496" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="290" y="92" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="101" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN_TURN</text>

      <!-- m2: spawn subprocess -->
      <line x1="504" y1="144" x2="836" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="618" y="124" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN · STDIO</text>

      <!-- m3: initialize + return caps -->
      <line x1="504" y1="180" x2="836" y2="180" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="626" y="160" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="169" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INITIALIZE</text>

      <line x1="836" y1="208" x2="504" y2="208" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="630" y="188" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="197" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AGENT CAPS</text>

      <!-- m4: session/new + return id -->
      <line x1="504" y1="240" x2="836" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="622" y="220" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="229" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION/NEW</text>

      <line x1="836" y1="264" x2="504" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="630" y="248" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="257" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION_ID</text>

      <!-- m5 (opt): set model config option -->
      <line x1="504" y1="324" x2="836" y2="324" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="606" y="304" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="313" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SET MODEL OPTION</text>

      <!-- m6: prompt -->
      <line x1="504" y1="376" x2="836" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="594" y="356" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="365" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION/PROMPT ×1</text>

      <!-- m7 (loop): async session updates -->
      <line x1="836" y1="444" x2="504" y2="444" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="590" y="424" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="433" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATES: TEXT·TOOLS·PLAN</text>

      <!-- m8 (loop): permission request + policy answer -->
      <line x1="836" y1="472" x2="504" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="622" y="452" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="461" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERMISSION?</text>

      <line x1="504" y1="500" x2="836" y2="500" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="614" y="480" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="489" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW (POLICY)</text>

      <!-- m9: prompt response -->
      <line x1="836" y1="548" x2="504" y2="548" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="596" y="528" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="537" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STOP_REASON + USAGE</text>

      <!-- m10: close session -->
      <line x1="504" y1="580" x2="836" y2="580" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="614" y="560" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="569" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION/CLOSE</text>

      <!-- m11: normalized result back to the engine (headline) -->
      <line x1="496" y1="616" x2="164" y2="616" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="262" y="596" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="605" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NORMALIZED RESULT</text>

      <!-- ================= actors ================= -->
      <rect x="60" y="32" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="32" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">run_agent_step</text>
      <text x="160" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one DAG step · one turn</text>

      <rect x="400" y="32" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="32" width="200" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">acp_client</text>
      <text x="500" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run_turn · fs+terminal OFF</text>

      <rect x="740" y="32" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="32" width="200" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="840" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">agent process</text>
      <text x="840" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude · codex · cursor</text>

      <!-- ================= legend ================= -->
      <line x1="30" y1="664" x2="970" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="110" y1="680" x2="142" y2="680" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="150" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ACP JSON-RPC CALL</text>

      <line x1="290" y1="680" x2="322" y2="680" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="330" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>

      <line x1="410" y1="680" x2="442" y2="680" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="450" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ASYNC NOTIFY</text>

      <line x1="570" y1="680" x2="602" y2="680" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="610" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RESULT</text>

      <text x="680" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CRASH/TIMEOUT → ZEROED RESULT, RETRYABLE (NEVER RAISES)</text>
    </svg>
  </div>
</body>
</html>
