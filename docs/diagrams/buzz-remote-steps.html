<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzz Remote Steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Design · Orchestrator × Buzz · serial, one step at a time</p>
    <h1>Remote agents over the relay</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="buzz-steps-title buzz-steps-desc">
      <title id="buzz-steps-title">Remote agents over the relay</title>
      <desc id="buzz-steps-desc">Design sequence for one workflow step executed on a remote machine: the TeamLead agent dispatches a step with its local orchestrator tool, posts it as a plain-language signed mention on the buzz relay, the remote buzz-acp harness delivers it to its local agent CLI over ACP, the agent works in its own checkout and pushes the run branch, replies with a completion block, and a verify-completion step in the workflow DAG checks the signature against the roster before the run advances.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- lifelines -->
      <line x1="100" y1="88" x2="100" y2="600" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="300" y1="88" x2="300" y2="600" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="500" y1="88" x2="500" y2="600" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="700" y1="88" x2="700" y2="600" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="900" y1="88" x2="900" y2="600" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- loop fragment: serial step loop -->
      <rect x="40" y="120" width="920" height="448" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="40" y="120" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="60" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="88" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[one step at a time — serial; next step may go to a different agent + machine]</text>

      <!-- activation bars -->
      <rect x="96" y="160" width="8" height="400" fill="rgba(79,93,117,0.10)" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <rect x="496" y="248" width="8" height="184" fill="rgba(79,93,117,0.10)" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <rect x="696" y="280" width="8" height="120" fill="rgba(79,93,117,0.10)" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>

      <!-- m1: coordinator self — dispatch + roster enrich -->
      <path d="M104,160 H152 Q160,160 160,168 V176 Q160,184 152,184 H104"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="172" y="164" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="176" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NEXT (TOOL)</text>

      <!-- m2: coordinator → relay — signed mention -->
      <line x1="104" y1="216" x2="296" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="148" y="196" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FRIENDLY ASK</text>

      <!-- m3: relay → harness — subscription push (async) -->
      <line x1="300" y1="248" x2="496" y2="248" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="348" y="228" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MENTION EVENT</text>

      <!-- m4: harness → CLI — ACP prompt (machine-local stdio) -->
      <line x1="504" y1="280" x2="696" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="560" y="260" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="269" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACP PROMPT</text>

      <!-- m5: CLI self — pull branch, work in own checkout -->
      <path d="M704,312 H752 Q760,312 760,320 V328 Q760,336 752,336 H704"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="772" y="316" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="776" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PULL · WORK</text>

      <!-- m6: CLI → git — push run branch -->
      <line x1="704" y1="368" x2="896" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="756" y="348" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="800" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH BRANCH</text>

      <!-- m7: CLI → harness — ACP end_turn -->
      <line x1="696" y1="400" x2="504" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="568" y="380" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">END_TURN</text>

      <!-- m8: harness → relay — signed reply with completion block -->
      <line x1="496" y1="432" x2="304" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="348" y="412" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="421" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">```completion</text>

      <!-- m9: relay → coordinator — reply event (async) -->
      <line x1="296" y1="464" x2="104" y2="464" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="156" y="444" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="453" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLY EVENT</text>

      <!-- m10: verify-completion runs as a DAG node (script step), then done -->
      <path d="M104,496 H152 Q160,496 160,504 V512 Q160,520 152,520 H104"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="172" y="500" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="176" y="509" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">VERIFY STEP</text>

      <!-- m11: coordinator → git — pull for script steps (optional) -->
      <line x1="104" y1="552" x2="896" y2="552" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="460" y="532" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="541" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL (OPT)</text>

      <!-- ================= actors ================= -->
      <rect x="20" y="32" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="20" y="32" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="100" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TeamLead</text>
      <text x="100" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">buzz agent · machine A</text>
      <text x="100" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orchestrator = local tool</text>

      <rect x="220" y="32" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="32" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="300" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">buzz relay</text>
      <text x="300" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nostr · signed events</text>
      <text x="300" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">channel = the record</text>

      <rect x="420" y="32" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="32" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">buzz-acp</text>
      <text x="500" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent keypair · machine B</text>
      <text x="500" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BUZZ_ACP_AGENT_COMMAND</text>

      <rect x="620" y="32" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="32" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="700" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">agent CLI</text>
      <text x="700" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude · codex · cursor</text>
      <text x="700" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">own checkout of repo</text>

      <rect x="820" y="32" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="820" y="32" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="900" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git remote</text>
      <text x="900" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run branch =</text>
      <text x="900" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared workspace</text>

      <!-- ================= legend ================= -->
      <line x1="30" y1="628" x2="970" y2="628" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="110" y1="644" x2="142" y2="644" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="150" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SIGNED EVENT / CALL</text>

      <line x1="300" y1="644" x2="332" y2="644" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="340" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RELAY PUSH (ASYNC)</text>

      <line x1="490" y1="644" x2="522" y2="644" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="530" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ACP · MACHINE-LOCAL ONLY</text>

      <line x1="700" y1="644" x2="732" y2="644" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="740" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">VERIFY-COMPLETION = A DAG NODE (SIG == ROSTER PUBKEY, RECORDED)</text>
    </svg>
  </div>
</body>
</html>
