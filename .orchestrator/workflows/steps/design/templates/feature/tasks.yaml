# Template: tasks.yaml for feature schema
# This file is the structural skeleton for tasks.yaml generation.
# Field rules and validation rules: architect/SKILL.md § Tasks YAML Format Contract
# Replace all {placeholders} with feature-specific content.
# verify commands must be repo-root-relative — no absolute paths, no `cd /abs/path &&`.
version: 1
tasks:
  - id: T-1
    title: "Write tests for {component} (RED — tests must fail)"
    status: pending
    depends_on: []
    files:
      - tests/test_{component}.py
    verify:
      - pytest tests/test_{component}.py -v
    test_scenarios:
      - "{behavior the tests should cover}"
      - "{behavior the tests should cover}"
    why: "{which design.md AC this task serves}"
    change: "Append test functions asserting {expected behavior}; tests fail before T-2 because {reason}."

  - id: T-2
    title: "Implement {component} (GREEN — make tests pass)"
    status: pending
    depends_on: [T-1]
    files:
      - src/{component}.py
    verify:
      - pytest tests/test_{component}.py -v
    test_scenarios:
      - "all T-1 tests pass"
      - "type-check clean"
    why: "{which design.md AC this task serves}"
    change: "Edit {file}:{line} to {mechanism}."
    # reviews:  # populated by code-review on needs_work (reopen) — do not invent
    #   - at: "2026-08-03T10:15:00Z"
    #     comment: "{actionable finding against this task}"

  - id: T-3
    title: "Review checkpoint — {group} (phase gate)"
    status: pending
    depends_on: [T-2]
    files: []
    verify:
      - pytest
    test_scenarios:
      - "type-check clean"
      - "full test suite green"
      - "build passes"
    why: "phase gate — confirm group changes integrate cleanly before moving on"

  # Example review-driven fix task (created by code-review only when no existing
  # task owns the finding). Prefer reopening T-N with a reviews[] entry instead.
  # - id: fix-1
  #   title: "Address review: {short finding}"
  #   status: pending
  #   depends_on: [T-3]
  #   files:
  #     - src/{file}.py
  #   verify:
  #     - pytest tests/test_{component}.py -v
  #   why: "code-review finding"
  #   change: "{mechanism}"
  #   reviews:
  #     - at: "2026-08-03T10:15:00Z"
  #       comment: "{actionable finding}"
