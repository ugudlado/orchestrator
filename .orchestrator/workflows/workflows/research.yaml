# Research workflow (ORC-ACP).
#
# CLI: `orchestrator research "<prompt>"` — session-driven via acp_client
# (Redis session state; no durable *_state.yaml). Resume with:
#   orchestrator --resume <session_id> ["optional input"]
# Also drivable over ACP stdio: `orchestrator acp` (same handlers).
#
# Identity: change_id / slug / ticket_id = session_id.
# Artifacts: .orchestrator/sessions/<session_id>/ (intake.json, topic.md, …)
#
# intake-research is an agent step: emits status await_input until checklist
# (topic, audience, depth) is full; then synthesize-findings / workflow-report.
#
# Web search is NOT a fixed Tavily script — synthesize-findings uses whichever
# search/browse tools the routed agent already has (cursor-agent, etc.).
mode: session
steps:
  - intake-research
  - synthesize-findings
  - workflow-report
