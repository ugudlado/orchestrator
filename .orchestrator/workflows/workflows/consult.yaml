# Consult workflow — multi-turn research with user steering (ORC-ACP).
#
# Demonstrates config-declared input gates: the clarify-focus step declares
# `await_input: true` in its contract, so the ACP driver pauses there and the
# client's next prompt is injected as "User direction". Research workflow is
# intentionally untouched — this is a separate schema.
#
# CLI: `orchestrator consult <topic>`
# ACP: session/new {schema: consult} → session/prompt <topic> → pauses at
#      clarify-focus → session/prompt <direction> → completes.
#
# Input:  <id> = research topic (free-form).
# Output: spec/changes/<slug>/topic.md     (intake)
#         spec/changes/<slug>/focus.md     (user direction, clarify step)
#         spec/changes/<slug>/sources.json (Tavily results)
#         spec/changes/<slug>/findings.md  (synthesized report)
#         spec/changes/<slug>/report.md    (run metrics)
steps:
  - intake-consult
  - clarify-focus
  - search-web
  - synthesize-findings
  - workflow-report
