line-length = 120

[lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # module-level imports not at top — deliberate sys.path patches in tests
    "E501",  # line too long — not enforced; codebase predates this rule
]

[lint.per-file-ignores]
"orchestrator_next/tests/*" = [
    "F821",  # forward references in string annotations (e.g., "State" before inline import)
    "E702",  # multiple statements on one line — intentional in test one-liners
]
