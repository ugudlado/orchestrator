<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrator</title>
<style>
:root {
  --paper: #eef1f5; --card: #ffffff; --ink: #1b2230; --quiet: #6b7585;
  --rule: #d3d9e2; --run: #2f6f4f; --wait: #9a6a10; --fail: #a33a3a;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12161d; --card: #191f28; --ink: #dde3ec; --quiet: #8b95a5;
    --rule: #2a313c; --run: #6cc08d; --wait: #d6a44a; --fail: #e08080;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--sans); padding: 24px 16px 64px;
}
main { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--quiet); }
header.bar {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--rule);
}
nav a { color: var(--quiet); text-decoration: none; font-size: 14px; }
nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; }
nav { display: flex; gap: 14px; margin-left: auto; }
.panes { display: grid; gap: 28px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .panes { grid-template-columns: 5fr 7fr; } }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
@media (max-width: 700px) {
  table { min-width: 620px; }
  .scroll { margin-right: -16px; padding-right: 16px; }
}
th {
  text-align: left; font-weight: 500; color: var(--quiet); font-family: var(--sans);
  font-size: 12px; padding: 0 8px 6px 0; border-bottom: 1px solid var(--rule);
}
td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th.n, td.n { text-align: right; padding-right: 14px; }
th.n:last-child, td.n:last-child { padding-right: 0; }
tr.click { cursor: pointer; }
tr.click:hover td, tr.click:focus-visible td { background: var(--card); }
tr.sel td { background: var(--card); }
tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--ink); }
tbody tr.gap > td { padding-top: 16px; }
.glyph { font-size: 16px; width: 1.6em; padding-right: 4px; }
.run { color: var(--run); } .wait { color: var(--wait); } .fail { color: var(--fail); }
.quiet { color: var(--quiet); }
.trunc { max-width: 15ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tfoot td { border-bottom: none; border-top: 1px solid var(--ink); font-weight: 600; }
button {
  font: 14px var(--sans); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 3px; padding: 5px 12px; cursor: pointer;
}
button:hover { border-color: var(--ink); }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:focus-visible, a:focus-visible, tr:focus-visible { outline: 2px solid var(--wait); outline-offset: 1px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.log { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--rule); }
.attempt { font-family: var(--mono); font-size: 12.5px; margin-bottom: 12px; }
.attempt pre {
  margin: 4px 0 0; padding: 8px; background: var(--card); border-radius: 3px;
  white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto;
}
.note { color: var(--quiet); font-size: 13px; margin: 8px 0; }
.err { color: var(--fail); font-size: 13px; margin: 8px 0; }
input[type=text] {
  font: 13px var(--mono); padding: 5px 8px; border: 1px solid var(--rule);
  border-radius: 3px; background: var(--card); color: var(--ink); min-width: 18ch;
}
</style>
</head>
<body>
<main>
  <header class="bar">
    <h1>Orchestrator</h1>
    <span id="sub" class="note"></span>
    <nav>
      <a href="#/">Runs</a>
      <a href="#/config">Config</a>
    </nav>
  </header>
  <div id="view"></div>
</main>
<script>
"use strict";
const $ = (h, a = {}, ...kids) => {
  const el = document.createElement(h);
  for (const [k, v] of Object.entries(a)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined)
    el.append(kid.nodeType ? kid : String(kid));
  return el;
};
const view = document.getElementById("view");
const sub = document.getElementById("sub");
let timer = null, lastGood = null;

const api = async (path, body) => {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  } : {});
  const doc = await res.json();
  if (!res.ok) throw new Error(doc.error || res.statusText);
  return doc;
};

// --- formatting: the pane's own vocabulary ---------------------------------
const ONGOING = new Set(["active", "running", "blocked", "needs_you"]);
const glyphOf = (r) => {
  if (r.archived) return ["⊡", "quiet"];
  if (r.stale) return ["⋯", "quiet"];
  if (r.run_status === "needs_you" || r.run_status === "blocked") return ["⏸", "wait"];
  if (ONGOING.has(r.run_status)) return ["▶", "run"];
  if (r.run_status === "completed") return ["✓", "run"];
  if (r.run_status === "cancelled") return ["⊘", "quiet"];
  return ["✗", "fail"];
};
const nodeGlyph = (s) => (
  s === "completed" ? ["✓", "run"] : s === "running" ? ["▶", "run"] :
  s === "failed" ? ["✗", "fail"] : s === "blocked" ? ["⏸", "wait"] : ["◦", "quiet"]);
const clock = (sec) => {
  if (!sec) return "-";
  const s = Math.round(sec), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return h ? `${h}h${String(m).padStart(2, "0")}m` : m ? `${m}m${String(s % 60).padStart(2, "0")}s` : `${s}s`;
};
const ago = (iso) => {
  if (!iso) return "-";
  const d = (Date.now() - Date.parse(iso)) / 1000;
  if (isNaN(d)) return "-";
  if (d < 90) return "just now";
  if (d < 5400) return `${Math.round(d / 60)}m ago`;
  if (d < 172800) return `${Math.round(d / 3600)}h ago`;
  return `${Math.round(d / 86400)}d ago`;
};
const money = (n, partial) => (n ? `$${n.toFixed(4)}${partial ? "?" : ""}` : "-");
const num = (n) => (n ? n.toLocaleString() : "-");
const elapsed = (r) => (ONGOING.has(r.run_status) && !r.stale && r.started_at
  ? clock((Date.now() - Date.parse(r.started_at)) / 1000)
  : r.stale ? ago(r.last_activity) : clock(secondsBetween(r)));
const secondsBetween = (r) => (r.started_at && r.ended_at
  ? (Date.parse(r.ended_at) - Date.parse(r.started_at)) / 1000 : 0);

const row = (cells, attrs = {}) => $("tr", attrs, ...cells);
const cell = (text, cls) => $("td", cls ? { class: cls } : {}, text);

// --- home -----------------------------------------------------------------
async function home() {
  sub.textContent = "";
  const [recipes, runs] = await Promise.all([api("/api/recipes"), api("/api/runs?limit=40")]);
  const panes = $("div", { class: "panes" });

  const rBody = $("tbody");
  for (const r of recipes) {
    const gates = r.gates.length ? `${r.gates.length} gate${r.gates.length > 1 ? "s" : ""}` : "";
    rBody.append(row([
      cell(r.name), cell(`${r.steps} steps`, "quiet"), cell(gates, "quiet"),
      $("td", { class: "n" }, $("button", { onclick: (e) => { e.stopPropagation(); startRun(r.name); } }, "Start")),
    ], { class: "click", tabindex: "0", onclick: () => startRun(r.name) }));
  }
  panes.append($("section", {},
    $("h2", {}, "Recipes"),
    $("div", { class: "scroll" },
      $("table", {}, $("thead", {}, row([$("th", {}, "Recipe"), $("th", {}, "Steps"),
        $("th", {}, "Gates"), $("th", {})])), rBody))));

  const runBody = $("tbody");
  let brokeSection = false;
  for (const r of runs) {
    const live = ONGOING.has(r.run_status) && !r.stale;
    const gap = !live && !brokeSection && runBody.children.length ? (brokeSection = true, "gap") : "";
    const [g, cls] = glyphOf(r);
    const middle = live ? (r.current_step || "") : r.stale ? "stale" : ago(r.ended_at);
    runBody.append(row([
      $("td", { class: `glyph ${cls}` }, g),
      $("td", { class: "trunc" }, r.slug),
      cell(r.recipe, "quiet"),
      $("td", { class: "trunc quiet" }, middle),
      cell(elapsed(r), "n"),
      cell(money(r.cost_usd, r.cost_partial), "n"),
      cell(`${r.nodes_done}/${r.nodes_total}`, "n quiet"),
    ], { class: `click ${gap}`, tabindex: "0", onclick: () => go(`#/runs/${r.slug || r.run_id}`) }));
  }
  panes.append($("section", {},
    $("h2", {}, "Runs"),
    runs.length
      ? $("div", { class: "scroll" },
          $("table", {}, $("thead", {}, row([$("th", {}), $("th", {}, "Run"), $("th", {}, "Recipe"),
            $("th", {}, "Step or when"), $("th", { class: "n" }, "Time"),
            $("th", { class: "n" }, "Cost"), $("th", { class: "n" }, "Done")])), runBody))
      : $("p", { class: "note" }, "No runs yet. Start one from a recipe.")));

  view.replaceChildren(panes);
}

async function startRun(recipe) {
  const slug = prompt(`Start ${recipe} — slug or ticket id?`);
  if (!slug) return;
  try {
    const r = await api("/api/runs", { recipe, slug });
    go(`#/runs/${r.slug || slug}`);
  } catch (e) { alert(`Could not start: ${e.message}`); }
}

// --- run view -------------------------------------------------------------
let openStep = "";

async function runView(ref) {
  let s;
  try {
    s = await api(`/api/runs/${encodeURIComponent(ref)}`);
    lastGood = s;
  } catch (e) {
    if (!lastGood) { view.replaceChildren($("p", { class: "err" }, e.message)); return; }
    s = lastGood;  // a failed read keeps the last good table up, never blanks it
  }
  const live = ONGOING.has(s.run_status);
  sub.textContent = `${s.slug} · ${s.run_status}`;

  const body = $("tbody");
  for (const n of s.nodes) {
    const [g, cls] = nodeGlyph(n.status);
    body.append(row([
      $("td", { class: `glyph ${cls}` }, g),
      $("td", { class: "trunc" }, n.id),
      cell(n.model || "-", "quiet"),
      cell(n.attempts || "-", "n"),
      cell(n.verdict || "-", "quiet"),
      cell(clock(n.seconds), "n"),
      cell(num(n.input_tokens), "n"), cell(num(n.output_tokens), "n"),
      cell(num(n.cache_read_tokens), "n"), cell(num(n.cache_write_tokens), "n"),
      cell(money(n.cost_usd, n.cost_partial), "n"),
    ], {
      class: `click ${n.id === openStep ? "sel" : ""}`, tabindex: "0",
      "data-step": n.id,
      onclick: () => selectStep(ref, n.id, body),
    }));
  }
  const t = s.totals || {};
  const foot = $("tfoot", {}, row([
    $("td", {}), cell("Totals"), cell(""), cell(t.attempts || "-", "n"), cell(""),
    cell(clock(t.seconds), "n"), cell(num(t.input_tokens), "n"), cell(num(t.output_tokens), "n"),
    cell(num(t.cache_read_tokens), "n"), cell(num(t.cache_write_tokens), "n"),
    cell(money(t.cost_usd, t.cost_partial), "n"),
  ]));

  const head = $("thead", {}, row([$("th", {}), $("th", {}, "Step"), $("th", {}, "Model"),
    $("th", { class: "n" }, "Att"), $("th", {}, "Verdict"), $("th", { class: "n" }, "Time"),
    $("th", { class: "n" }, "In"), $("th", { class: "n" }, "Out"),
    $("th", { class: "n" }, "C-rd"), $("th", { class: "n" }, "C-wr"),
    $("th", { class: "n" }, "Cost")]));

  const parts = [
    $("p", { class: "note" },
      `${s.slug} · ${s.phase || ""} · ${s.run_status}` +
      (s.gate_token ? ` · last token ${s.gate_token}` : "")),
    $("div", { class: "scroll" }, $("table", {}, head, body, foot)),
  ];
  const pending = (s.gates || []).filter((g) => g.status === "pending");
  parts.push(actionRow(s, pending, live));
  view.replaceChildren(...parts);

  if (openStep) loadLog(ref, openStep);
  clearTimeout(timer);
  if (live) timer = setTimeout(render, 5000);
}

function selectStep(ref, stepId, body) {
  openStep = openStep === stepId ? "" : stepId;
  for (const tr of body.children) tr.classList.remove("sel");
  for (const panel of view.querySelectorAll(".log")) panel.remove();
  if (!openStep) return;
  const i = [...body.children].findIndex((tr) => tr.dataset.step === openStep);
  if (i >= 0) body.children[i].classList.add("sel");
  loadLog(ref, openStep);
}

function actionRow(s, pending, live) {
  const bar = $("div", { class: "actions" });
  const act = async (path, body, label) => {
    try { await api(path, body); openStep = ""; render(); }
    catch (e) { alert(`${label} failed: ${e.message}`); }
  };
  const base = `/api/runs/${encodeURIComponent(s.slug || s.run_id)}`;

  if (pending.length) {
    const g = pending[0];
    bar.append($("span", { class: "note" },
      `Gate ${g.gate_id} is waiting. Approving binds ${g.token_name || "its token"}.`));
    bar.append($("button", { class: "primary", onclick: () =>
      act(`${base}/approve`, { token: g.token }, "Approve") }, "Approve gate"));
  }
  if (s.run_status === "needs_you") {
    const stuck = s.nodes.find((n) => n.status === "abandoned" || n.status === "failed");
    if (stuck) bar.append($("button", { onclick: () =>
      act(`${base}/retry`, { step_id: stuck.id }, "Retry") }, `Retry ${stuck.id}`));
    const box = $("input", { type: "text", placeholder: "answer" });
    bar.append(box, $("button", { onclick: () =>
      act(`${base}/resume`, { text: box.value }, "Resume") }, "Send answer"));
  }
  if (live) bar.append($("button", { onclick: () => {
    if (confirm(`Cancel ${s.slug}? Pending gates are cancelled with it.`))
      act(`${base}/cancel`, {}, "Cancel");
  } }, "Cancel run"));
  if (!live) bar.append($("span", { class: "note" }, "This run is finished."));
  bar.append($("button", { onclick: () => go("#/") }, "All runs"));
  return bar;
}

async function loadLog(ref, stepId) {
  for (const panel of view.querySelectorAll(".log")) panel.remove();
  let events = [];
  try {
    events = await api(`/api/runs/${encodeURIComponent(ref)}/events?step=${encodeURIComponent(stepId)}`);
  } catch { return; }
  // A slower fetch for a step the reader has since clicked away from must not
  // draw over the panel they are actually looking at.
  if (openStep !== stepId) return;
  const panel = $("div", { class: "log" }, $("h2", {}, stepId));
  if (!events.length) panel.append($("p", { class: "note" }, "No attempts recorded yet."));
  for (const e of events.slice().reverse()) {
    const out = e.outputs && typeof e.outputs === "object" ? e.outputs : {};
    const arts = (e.artifacts || []).map((a) => a.name || a.path).join(", ");
    panel.append($("div", { class: "attempt" },
      $("div", { class: "quiet" }, [
        `#${e.attempt || 1}`, e.status, (e.usage || {}).model || e.model,
        ago(e.ended_at || e.started_at),
      ].filter(Boolean).join(" · ")),
      arts ? $("div", { class: "quiet" }, `artifacts: ${arts}`) : null,
      Object.keys(out).length ? $("pre", {}, JSON.stringify(out, null, 2)) : null));
  }
  view.append(panel);
}

// --- config ---------------------------------------------------------------
async function config() {
  sub.textContent = "";
  const c = await api("/api/config");
  const body = $("tbody");
  for (const s of c.settings)
    body.append(row([cell(s.key), cell(s.value), cell(s.source, "quiet")], { title: s.help }));
  const doc = $("tbody");
  for (const d of c.doctor)
    doc.append(row([
      $("td", { class: d.status === "FAIL" ? "fail" : d.status === "WARN" ? "wait" : "run" }, d.status),
      cell(d.name), cell(d.detail, "quiet"),
    ]));
  view.replaceChildren(
    $("section", {}, $("h2", {}, "Settings"),
      $("p", { class: "note" }, c.files.length ? `Read from ${c.files.join(", ")}` : "No orchestrator.toml — run orchestrator init."),
      $("div", { class: "scroll" },
        $("table", {}, $("thead", {}, row([$("th", {}, "Key"), $("th", {}, "Value"), $("th", {}, "Source")])), body))),
    $("section", { style: "margin-top:28px" }, $("h2", {}, "Health"),
      $("div", { class: "scroll" },
        $("table", {}, $("thead", {}, row([$("th", {}, "State"), $("th", {}, "Check"), $("th", {}, "Detail")])), doc))));
}

// --- routing --------------------------------------------------------------
function go(hash) { location.hash = hash; }
async function render() {
  clearTimeout(timer);
  const h = location.hash.replace(/^#/, "") || "/";
  for (const a of document.querySelectorAll("nav a"))
    a.toggleAttribute("aria-current", a.getAttribute("href") === `#${h}` ? "page" : false);
  try {
    if (h.startsWith("/runs/")) await runView(decodeURIComponent(h.slice(6)));
    else if (h === "/config") await config();
    else { lastGood = null; openStep = ""; await home(); }
  } catch (e) {
    view.replaceChildren($("p", { class: "err" }, e.message));
  }
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
