# Example models.yaml — copy/edit, or pass with:
#   orchestrator run TICKET --models-config ./models.example.yaml

tools:
  claude:
    binary: claude
    args_template:
      ["--model", "{model_id}", "-p", "--output-format", "json", "{prompt}"]
  cursor:
    binary: cursor-agent
    args_template:
      [
        "-p",
        "--output-format",
        "json",
        "--model",
        "{model_id}",
        "--force",
        "{prompt}",
      ]
  codex:
    binary: codex
    args_template: ["exec", "--json", "--prompt", "{prompt}"]
  pi:
    binary: pi
    args_template: ["--mode", "json", "@{prompt_file}"]

models:
  strong:
    - { tool: claude, model_id: claude-opus-5 }
  standard:
    - { tool: claude, model_id: claude-sonnet-5 }
  code:
    - { tool: cursor, model_id: composer-2.5 }
    - { tool: claude, model_id: claude-sonnet-5 }

step_models:
  design: strong
  ux-design: strong
  code-review: strong
  explore: standard
  diagnose: standard
  learn: standard
  design-review: standard
  ux-critique: standard
  implement: code
