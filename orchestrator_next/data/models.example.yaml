# Bootstrap seed for `orchestrator models init` (D2).
#
# Used ONLY as a fallback: when no layer (config root, user home, env file)
# defines a `tools:` block yet — the normal fresh-machine / slim-pack-root
# case. `models init` scans PATH for these binaries and writes
# ~/.orchestrator/models.yaml binding each core alias to a fallback chain
# (D3) of the candidates it found, best-available first.
#
# Also usable as a one-off run overlay (unrelated to init):
#   orchestrator run ORC-84 --agents-config ./models.example.yaml
# Same shape as the `models:`/`tools:` blocks in config/models.yaml.

tools:
  claude:
    binary: claude
    args_template:
      ["--model", "{model_id}", "-p", "--output-format", "json", "{prompt}"]
  cursor:
    binary: cursor-agent
    args_template:
      [
        "-p",
        "--output-format",
        "json",
        "--model",
        "{model_id}",
        "--force",
        "{prompt}",
      ]
  codex:
    binary: codex
    args_template: ["exec", "--json", "--prompt", "{prompt}"]
  pi:
    binary: pi
    args_template: ["--mode", "json", "@{prompt_file}"]

# Each core alias as a candidate chain (D3), most-capable/preferred first.
# `models init` keeps only the candidates whose binary it found on PATH.
models:
  opus:
    - { tool: claude, model_id: claude-opus-4-7 }
  sonnet:
    - { tool: claude, model_id: claude-sonnet-4-6 }
  haiku:
    - { tool: claude, model_id: claude-haiku-4-5 }
  composer:
    - { tool: cursor, model_id: composer-2.5 }
    - { tool: claude, model_id: claude-sonnet-4-6 }
