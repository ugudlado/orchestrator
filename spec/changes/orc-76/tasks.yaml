      and the same for the $ORCHESTRATOR_HOME fallback at line 1667.

  - id: T-23
    title: "Move artifact-formats.md content into producer prompt.md files and reviewer prompt"
    agent: developer
    depends_on: [T-9]
    files:
      - config/steps/explore/prompt.md
      - config/steps/diagnose/prompt.md
      - config/steps/design-and-draft-artifacts/prompt.md
      - config/steps/run-phase-review/prompt.md
      - config/steps/contracts/artifact-formats.md
    verify:
      - "! test -e config/steps/contracts/artifact-formats.md"
      - "grep -q 'Tasks YAML Format Contract' config/steps/design-and-draft-artifacts/prompt.md"
      - "grep -q 'Discovery Brief Format Contract' config/steps/explore/prompt.md"
      - "grep -q 'Diagnosis Format Contract' config/steps/diagnose/prompt.md"
      - "grep -q 'Design Format Contract' config/steps/design-and-draft-artifacts/prompt.md"
      - "grep -q 'Format contract reference' config/steps/run-phase-review/prompt.md"
      - "pytest config/scripts/orchestrator_next/tests/ -q"
    test_scenarios:
      - "Each producer step's prompt.md carries the format-contract section for the artifact it produces."
      - "run-phase-review's prompt.md carries a consolidated reference listing all five format contracts."
      - "config/steps/contracts/artifact-formats.md is deleted."
    why: "AC-10"
