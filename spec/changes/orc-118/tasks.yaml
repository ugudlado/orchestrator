    change: "In run-workflow.sh delete invoke_tool, build_prompt, resolve_agent_tool, resolve_tool, fetch_ticket_context, the resolve_config/TOOLS_YAML/ROUTES_YAML block, the agent-routes.sh source, the entire `case \"$KIND\"` dispatch body (run_step + run_inline branches), AND the now-orphaned _merge_workflow_issues helper + DETECT_WORKFLOW_ISSUES var (no longer referenced once both case branches go — grep run-workflow.sh for residual references to confirm zero). Keep: REPO_ROOT/state path resolution, spawn_resume, the while loop calling `orchestrator next`, run_pre_step_hook, the exit 1/2/3 handlers, the exit-0 inline-logging block, the archive 'state.yaml missing' check, and _emit_feature_rollup. The loop now only branches on `orchestrator next` exit code, never on step kind. Drop the TICKET_ID-to-prompt plumbing (ticket context now fetched in Python). NOTE for T-10: agent_runner locates detect-workflow-issues.sh via orchestrator_next.paths.config_root()/.. scripts path (it lives at orchestrator_next/scripts/lib/), not shell-relative. ALSO: remove the `skip \"RED until T-14...\"` lines added to tests/test_run_workflow_pure_loop.bats in T-13 so its grep assertions now run and pass against the stripped script (the bats analog of T-15 stripping xfail markers); the verify command re-runs that bats file and must be green."

