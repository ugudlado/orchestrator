    why: "AC-2 — driver reduced to a pure orchestrator next loop."
    change: "Add a bats file grepping run-workflow.sh for the forbidden tokens (invoke_tool|build_prompt|resolve_agent_tool|resolve_tool|parse-completion|build-payload|DONE_PAYLOAD) and asserting zero matches. RED CONTRACT (bats, NOT pytest — @pytest.mark.xfail does not apply): the tokens still exist until T-14, so the grep assertion would fail and the `bats` verify command would exit non-zero, the same contract contradiction that abandoned the RED pytest tasks. Make each @test body lead with `skip \"RED until T-14 strips run-workflow.sh\"` so bats reports skipped and the verify command exits 0 in the RED state. T-14 removes the skip lines so the assertions actually run and pass after the strip. This is the bats analog of the @pytest.mark.xfail(strict=False) pattern used by the pytest RED tasks."

