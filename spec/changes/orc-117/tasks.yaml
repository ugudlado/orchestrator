# tasks.yaml for orc-117 — Remove flags system from codebase
# Pure deletion. Each task removes a flag-bearing region together with any
# coupled test assertion so `pytest orchestrator_next/tests/ -q` stays green at
# every commit boundary. No RED-first pairing: tdd_required is unset and there
# is no new behavior to drive — see design.md "Selected Approach".
# Baseline is dirty: 8 pre-existing failures named in design.md "Constraints".
# AC-4 means "no test fails OUTSIDE that named set", not a literal zero.
version: 1
tasks:
  - id: T-1
    title: "Remove flags from the seed pipeline (parse + write)"
    status: completed
    tokens_in: 1800
    tokens_out: 900
    duration_s: 240
    depends_on: []
    files:
      - orchestrator_next/scripts/lib/seed_parse_overrides.py
      - orchestrator_next/scripts/lib/seed_write_state.py
    verify:
      - python orchestrator_next/scripts/lib/seed_parse_overrides.py x feature . config/workflows/feature.yaml
      - python -c "import json,subprocess,sys,tempfile,os; j=subprocess.run([sys.executable,'orchestrator_next/scripts/lib/seed_parse_overrides.py','x','feature','.','config/workflows/feature.yaml'],capture_output=True,text=True,check=True).stdout; d=json.loads(j); assert 'flags' not in d, 'flags key still emitted'; f=tempfile.mktemp(suffix='.yaml'); subprocess.run([sys.executable,'orchestrator_next/scripts/lib/seed_write_state.py',f,j],check=True); import yaml; assert 'flags' not in (yaml.safe_load(open(f).read()) or {}), 'flags written to state'; os.remove(f); print('seed pipeline ok, no flags')"
    test_scenarios:
      - "seed_parse_overrides emits JSON with no flags key"
      - "seed_write_state consumes that JSON and writes state.yaml with no flags field"
      - "the parse->write pipe-through runs end-to-end without raising (no KeyError on d['flags'])"
    why: "AC-1 + AC-2 — these two scripts are the only flags producers; fused because seed_write_state.py hard-reads d['flags'] from the parse JSON, so split-order removal raises an untested KeyError (design.md Selected Approach)"
    change: >-
      In orchestrator_next/scripts/lib/seed_parse_overrides.py: delete the
      `flags` dict construction (the `for arg in raw_overrides:` build loop,
      lines 30-36) and the `"flags": flags,` key in the JSON output (line 53);
      `raw_overrides = args[4:]` (line 28) becomes unused — remove it. Do NOT
      add a reject-on-override guard: the ticket requires removing parsing and no
      caller passes overrides. Update the module docstring (line 6) to drop
      `flags` from the stdout-keys list. In
      orchestrator_next/scripts/lib/seed_write_state.py: delete the
      `"flags": d["flags"],` entry from the `state` dict (line 63). Both edits
      land in one commit so the pipe-through never sees a missing key.
      NOTE: the pipe-through verify's write-half (seed_write_state subprocess)
      is inspection-verified, not run-verified, because pre-deletion the
      parse JSON still has `flags` and the first assert short-circuits before
      the write runs. It executes end-to-end only after this task's edits land;
      arg shape (path, init_json) matches seed_write_state.main and `active` is
      non-empty for feature, so it should pass on first post-edit run.

