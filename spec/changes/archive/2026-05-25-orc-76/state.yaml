      status: completed
      agent: reviewer
      goal: ''
      inputs:
      - task_execution_result
      outputs:
      - phase_review_report
      rules:
      - "Target score is quality_bar.min_phase_review_score from project.yaml \u2014\
        \ retry until met."
      - "Maximum retries from quality_bar.max_retry_rounds \u2014 escalate to user\
        \ if exhausted."
      - "When flags.light is true: lower target review_score to 7 and max_retries\
        \ to 4 \u2014 light mode trades quality bar for speed on tight-scope changes."
      - Run type-check + test + build commands at every phase boundary before scoring.
      - "Capture concrete findings with fix direction \u2014 every finding must be\
        \ actionable."
      - Issues found during verification become new tasks in the current phase. Never
        skip ahead with unresolved findings.
      - "Do not advance with unresolved critical findings \u2014 these block phase\
        \ completion regardless of overall score."
      - 'When flags.bugfix is true: zero regressions tolerated. No existing tests
        may break.'
      - "Fix tasks must be minimal and scoped to the specific failure \u2014 no refactoring,\
        \ no improvements."
      - "Score of 10 is a first-pass bonus \u2014 only achievable when no retries\
        \ were used this round."
      - "Operate at staff-level review quality \u2014 catch architectural issues,\
        \ not just surface bugs."
      - Artifact structural compliance with contracts/artifact-formats.md format contracts
        is a review criterion.
      - "When a finding requires a new requirement, the fix MUST update design.md\
        \ (AC + design) and tasks.yaml atomically \u2014 partial updates that sync\
        \ only one artifact leave the feature in an inconsistent state and will fail\
        \ re-review. <!-- learned: 2026-04-17, source: cross-repo-metrics-duckdb,\
        \ cycle: 11, hits: 9, misses: 6, repo: orchestrator -->"
      - "For tasks that spec describes as a rewrite, projection, or byte-compatible\
        \ replacement of an existing producer, AC verification MUST include a value/shape\
        \ parity check against at least one real payload from the prior implementation\
        \ \u2014 key-presence alone is insufficient. Reviewer must run both the old\
        \ producer and the new one on a real archived fixture and diff the top-level\
        \ output keys; any key reduction is an important finding. <!-- learned: 2026-04-20,\
        \ source: single-source-metrics-via-step-events, cycle: 12, hits: 8, misses:\
        \ 2, repo: orchestrator -->"
      - "Before scoring the phase, check if any task-nodes (step_id starting with\
        \ 'task-') in the workflow_plan are still pending. If any task-nodes are pending\
        \ and not explicitly quarantined in state.yaml, write phase-review.md with\
        \ verdict incomplete_phase listing the pending task IDs \u2014 return COMPLETION\
        \ with outputs.phase_review_report: {verdict: incomplete_phase} and do NOT\
        \ include review_score. This guards against dispatcher bugs or manual advances\
        \ that reach run-phase-review before all tasks are complete. <!-- learned:\
        \ 2026-05-08, source: hl-303, cycle: 38, hits: 7, misses: 0, repo: orchestrator\
        \ --> <!-- updated: 2026-05-23, source: orc-65, cycle: 1, repo: orchestrator\
        \ -->"
      - Never claim completion without running verification. Show output.
      - Keep changes scoped to the current task. No "while I'm here" improvements.
      - Artifacts must exist before implementation begins.
      - Update state.yaml after every step. This enables pause/resume.
      - Max 3 retry attempts per step. After that, pause and report.
      - User approval required at phase boundaries per signoff_policy.
      - Schemas and step contracts must not reference any specific LLM tool. All tool-specific
        wiring belongs in install.sh or per-tool config.
      - "Non-blocking suggestions raised by run-phase-review (e.g. deprecation cleanup,\
        \ follow-up sweeps) have no defined step in the feature workflow. When acted\
        \ on, commit them as separate chore(<change_id>) commits after run-phase-review\
        \ passes and outside the task loop \u2014 never fold them into a task's diff\
        \ or treat them as silent ground-truth changes. The phase review verdict still\
        \ reflects pre-cleanup state.\n"
