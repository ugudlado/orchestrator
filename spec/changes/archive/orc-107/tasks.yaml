version: 1
tasks:
  - id: T-1
    title: "Add tests/conftest.py with ORCHESTRATOR_ROOT constant"
    depends_on: []
    files:
      - tests/conftest.py
    verify:
      - python -c "import sys; sys.path.insert(0, 'tests'); from conftest import ORCHESTRATOR_ROOT; import os; assert os.path.isfile(os.path.join(ORCHESTRATOR_ROOT, 'bin', 'orchestrator')), f'bin/orchestrator not found at {ORCHESTRATOR_ROOT}'"
    test_scenarios:
      - "ORCHESTRATOR_ROOT resolves to the directory containing tests/ (one level up)"
      - "ORCHESTRATOR_ROOT points to a path where bin/orchestrator exists"
      - "import from conftest works without sys.path manipulation in sibling test files"
    why: "AC-1, AC-2, AC-3 — establishes the canonical root constant that all 11 files will import"
    change: "Create tests/conftest.py with: import os; ORCHESTRATOR_ROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))"

  - id: T-2
    title: "Remove per-file _WORKTREE_ROOT and import ORCHESTRATOR_ROOT in all 11 test files"
    depends_on: [T-1]
    files:
      - tests/test_typed_io.py
      - tests/test_tool_calls_key_conventions.py
      - tests/test_orchestrator_record.py
      - tests/test_attempt_counting.py
      - tests/test_cost_so_far.py
      - tests/test_cost_report_integration.py
      - tests/test_inline_smoke.py
      - tests/test_upsert_tool_calls.py
      - tests/test_orchestrator_next.py
      - tests/test_inline_script.py
      - tests/test_step_events_upsert.py
    verify:
      - python -c "import subprocess, sys; r = subprocess.run(['grep', '-rn', \"_WORKTREE_ROOT = os.path.abspath\", 'tests/'], capture_output=True, text=True); assert not r.stdout, f'Stale _WORKTREE_ROOT definitions remain:\\n{r.stdout}'"
      - pytest tests/ -q --tb=line 2>&1 | grep "bin/orchestrator" | grep -v "$(pwd)" || true; echo "path-resolution check done"
    test_scenarios:
      - "No test file defines _WORKTREE_ROOT = os.path.abspath(os.path.join(_HERE, '..', '..', '..')) (AC-4)"
      - "Each file imports ORCHESTRATOR_ROOT from conftest and uses it where _WORKTREE_ROOT was used"
      - "Previously passing 33 tests continue to pass (AC-5)"
      - "Zero tests fail with bin/orchestrator path pointing to /Users/spidey/ (AC-1)"
    why: "AC-1, AC-4, AC-5 — replaces all stale three-level path computations with the canonical constant"
    change: "In each of the 11 files: delete the _HERE and _WORKTREE_ROOT module-level lines; add 'from conftest import ORCHESTRATOR_ROOT'; replace all '_WORKTREE_ROOT' references with 'ORCHESTRATOR_ROOT'."

  - id: T-3
    title: "Full suite green — verify zero path-resolution failures"
    depends_on: [T-2]
    files: []
    verify:
      - pytest tests/ -q --tb=line 2>&1 | grep "bin/orchestrator" | grep -v "$(pwd)" || true; echo "AC-1 verified: zero path-resolution failures"
    test_scenarios:
      - "pytest tests/ passes with zero path-resolution failures (AC-1)"
      - "No test fails with 'bin/orchestrator' not found at wrong path"
      - "33 previously-passing tests still pass (AC-5)"
      - "ORC-69 pre-existing failures (if any) are the only remaining failures"
    why: "AC-1, AC-5 — integration gate confirming all acceptance criteria are met together"
