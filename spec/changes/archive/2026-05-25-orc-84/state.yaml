      rules:
      - complete-workflow is the terminal step for the feature and bugfix workflows.
        It performs merge, archive, and worktree teardown as one atomic step.
      - The script sequences, in one process so no dispatch boundary sits between
        a state-moving and a state-reading operation, merge then archive then cd "$REPO_ROOT"
        then worktree removal.
      - All state.yaml-derived values are read into bash vars at script start, before
        the archive phase moves state.yaml out of the worktree.
      - The merge phase is gated by flags.merge_to_main; the cleanup phase is gated
        by flags.worktree. The archive phase is unconditional.
      - "On merge conflict the merge phase exits non-zero and the wrapper halts before\
        \ archive and cleanup \u2014 the worktree is preserved."
      - complete-workflow is classified state-mutating in bin/orchestrator and is
        pre-recorded before its script runs (the ORC-66 record-after-state-deletion
        crash-avoidance contract).
      - Never claim completion without running verification. Show output.
      - Keep changes scoped to the current task. No "while I'm here" improvements.
      - Artifacts must exist before implementation begins.
      - Update state.yaml after every step. This enables pause/resume.
      - Max 3 retry attempts per step. After that, pause and report.
      - User approval required at phase boundaries per signoff_policy.
      - Schemas and step contracts must not reference any specific LLM tool. All tool-specific
        wiring belongs in install.sh or per-tool config.
      - "Non-blocking suggestions raised by run-phase-review (e.g. deprecation cleanup,\
        \ follow-up sweeps) have no defined step in the feature workflow. When acted\
        \ on, commit them as separate chore(<change_id>) commits after run-phase-review\
        \ passes and outside the task loop \u2014 never fold them into a task's diff\
        \ or treat them as silent ground-truth changes. The phase review verdict still\
        \ reflects pre-cleanup state.\n"
      depends_on:
      - compute-swe-metrics
    filtered:
    - id: ux-design
      reason: flag ux_design=false
    - id: run-ux-critique
      reason: flag ux_design=false
