          \ this.\n"
        change: "run-workflow.sh line 503: Change fallback from \"developer\" to empty/null:\n\
          \  AGENT=$(echo \"$ACTION_JSON\" | jq -r '.agent // \"\"')\nrun-workflow.sh\
          \ line 513: Change comparison to non-empty check:\n  if [ -n \"$AGENT\"\
          \ ]; then\nThis restores correct behavior: script steps show no agent suffix\
          \ in logs.\n"
        verify:
