          \ chain (first existing wins):\n  1. $WORKTREE_ROOT/spec/changes/archive/<change_id>/retro.md\n\
          \  2. $WORKTREE_ROOT/spec/changes/archive/*-<change_id>/retro.md (legacy\
          \ date-prefixed; use a glob)\n  3. $REPO_ROOT/spec/changes/archive/<change_id>/retro.md\n\
          \  4. $REPO_ROOT/spec/changes/archive/*-<change_id>/retro.md\n  5. $WORKTREE_ROOT/spec/changes/<change_id>/retro.md\
          \ (pre-archive fallback)\nSilent-omit guards (return 0 with no output):\n\
          \  - no candidate path exists\n  - `grep -cE '^## ISSUE-' \"$path\"` returns\
          \ 0\n  - python3 not on PATH (emit one-line \"render-retro: python3 missing\"\
          \ to stderr, exit 0)\nParser (python3 heredoc, mirrors append-retro.sh's\
          \ pattern):\n  - split file on regex r'^## ISSUE-\\d+' headings\n  - for\
          \ each block, extract bullets: severity, category, detail, fix_direction\
          \ (regex r'^- \\*\\*(\\w+)\\*\\*:\\s*(.*)$')\n  - missing field \u2192 '\u2014\
          '\n  - per-cell truncate to 120 chars + '\u2026' for detail and fix_direction\n\
          \  - print to stderr:\n        \"\" (blank line)\n        \"## Issues this\
          \ run (N)\"\n        \"| Severity | Category | Detail | Fix direction |\"\
          \n        \"|---|---|---|---|\"\n        one \"| ... | ... | ... | ... |\"\
          \ row per issue, in document order\n"
