      - 'When flags.tdd_required is true, follow strict red-green-refactor: write
        the failing test first, run it and confirm it fails for the expected reason
        (feature missing, not typo), then write the minimal code to pass, then refactor
        with tests green. No production code without a failing test first. Use real
        code over mocks unless unavoidable; if mock setup is longer than test logic,
        the test is wrong. Cover edge cases and error paths.'
      - 'When flags.light is true: keep changes minimal and focused. No scope creep.
        One concern per change.'
      - 'When flags.bugfix is true: write the regression test BEFORE the fix — the
        test must fail until the fix lands. Make the smallest change that fixes the
        root cause; prefer changing 1 line over 5. Use existing patterns in the codebase
        over introducing new ones. Do NOT refactor surrounding code, add unnecessary
        error handling, or add comments to unchanged code.'
      - 'When flags.bugfix is true: after implementing the fix, re-run the reproduction
        script from diagnosis.md to confirm it works. Then check whether the change
        could break other callers of the modified code.'
      - 'When removing or renaming a step/artifact from a workflow schema, grep the
