version: 1
tasks:
  - id: T-1
    title: "Write readiness-layer regression tests for verdict-aware completion (RED)"
    depends_on: []
    files:
      - config/scripts/orchestrator_next/tests/test_rework_reentry.py
    verify:
      - pytest config/scripts/orchestrator_next/tests/test_rework_reentry.py -v
    test_scenarios:
      - "AC-4 (the live bug): a step_history entry for run-phase-review with status=completed AND evidence.outputs.phase_review_report.verdict=needs_work, on a node whose plan status is in_progress — _effective_node_status returns 'in_progress' (NOT 'completed'). This fails today because history-inference overrides the in_progress re-arm."
      - "AC-4 crash-resume preserved: a step_history entry with status=recovered (no needs_work verdict) on an in_progress node — _effective_node_status returns 'completed' (mirrors test_dispatch_retry_storm.py:315; must NOT regress)."
      - "AC-4 incomplete_phase behaves like needs_work: a completed entry with verdict=incomplete_phase is treated non-terminal."
      - "AC-4 pass terminates: a completed entry with verdict=pass IS terminal (returns 'completed')."
      - "AC-1 end-to-end DAG: promoted plan with execute-next-task=completed, task-fix-1=completed, run-phase-review re-armed in_progress with a completed+needs_work history entry, run-phase-review.depends_on=[task-fix-1], and a later compute-prediction-accuracy node depending on run-phase-review — next_ready_node returns 'run-phase-review', NOT 'compute-prediction-accuracy'."
      - "AC-2 advance on pass: same DAG but after a final completed+pass history entry for run-phase-review (node status completed) — next_ready_node returns 'compute-prediction-accuracy'."
      - "Multi-round history: history with two completed+needs_work entries followed by one completed+pass entry resolves the node as terminal (the trailing pass wins; earlier needs_work entries stay non-terminal)."
      - "Fail-safe: a completed run-phase-review entry with missing/malformed evidence (verdict unreadable) is treated terminal (returns 'completed')."
    why: "AC-1, AC-2, AC-4 — pins the bug at the readiness/next-node layer where it actually lives, not at the helper layer that already passed pre-fix."
    change: "New test module. Build State via load_state on a tmp state.yaml (reuse fixture shape from tests/test_rework_loop.py _nodes_state and tests/test_dispatch_retry_storm.py helpers). Assert against readiness._effective_node_status and readiness.next_ready_node directly. The needs_work history entry MUST be written as {status: completed, evidence: {outputs: {phase_review_report: {verdict: needs_work}}}} to match what record.py writes. These assertions fail on HEAD because _step_completed_in_history (readiness.py:74) counts any completed entry as terminal."

  - id: T-2
    title: "Make _step_completed_in_history verdict-aware (GREEN)"
    depends_on: [T-1]
    files:
      - config/scripts/orchestrator_next/readiness.py
    verify:
      - pytest config/scripts/orchestrator_next/tests/test_rework_reentry.py -v
      - pytest config/scripts/orchestrator_next/tests/test_dispatch_retry_storm.py config/scripts/orchestrator_next/tests/test_readiness.py config/scripts/orchestrator_next/tests/test_rework_loop.py -v
    test_scenarios:
      - "all T-1 tests pass"
      - "ORC-85 retry-storm tests still pass (test_dispatch_retry_storm.py:282/300/315 — promoted-plan, legacy-plan, and recovered+in_progress termination)"
      - "existing rework-loop tests still pass (test_rework_loop.py)"
    why: "AC-1, AC-2, AC-4 — the surgical fix: a run-phase-review history entry with a needs_work/incomplete_phase verdict no longer counts as terminal, so the in_progress re-arm survives and the node re-emits."
    change: "Edit config/scripts/orchestrator_next/readiness.py:74 _step_completed_in_history. Inside the loop, after matching phase+step_id and a terminal status, lazy-import `from orchestrator_next.record import _phase_review_verdict` (same pattern as the existing REPEAT_PREDICATES lazy import at line ~58) and call `_phase_review_verdict(entry.raw)`; if the verdict is in {'needs_work','incomplete_phase'}, `continue` (skip — non-terminal). All other terminal entries return True as today. A None/unreadable verdict falls through to terminal (fail-safe)."

  - id: T-3
    title: "Make the engine own the retry-counter increment (GREEN)"
    depends_on: [T-2]
    files:
      - config/scripts/orchestrator_next/record.py
      - config/steps/run-phase-review/prompt.md
    verify:
      - pytest config/scripts/orchestrator_next/tests/test_rework_loop.py -v
    test_scenarios:
      - "existing rework-loop tests still pass (_rework_loop_active is a pure function of its retries arg — unaffected by the record()-level change)"
      - "type-check / import clean"
    why: "AC-1, AC-3 — the retry counter gates the cap (exit 2). Engine-owned increment makes the cap deterministic instead of trusting the reviewer agent to emit it (the same agent-control-signal trust this ticket exists to remove). Verified: nothing increments retries['run-phase-review'] today and _apply_state_patch overwrites it (record.py:389)."
    change: "In config/scripts/orchestrator_next/record.py, in the rework retry branch (the `if rework == 'retry':` arm next to mark_node_status(in_progress), ~line 1688), increment the counter: `retries_map = state_raw.setdefault('retries', {}); retries_map['run-phase-review'] = retries_map.get('run-phase-review', 0) + 1`. Apply it AFTER _rework_loop_active has read the pre-increment count (so round N reads N-1 then bumps to N). In config/steps/run-phase-review/prompt.md, remove the `state_patch.retries increment for this step` line (step 7d) so the engine is the sole incrementer — no double-count (which would cap at 4 rounds instead of 8)."

  - id: T-4
    title: "Write end-to-end counter-climb + retry-cap tests (verify the engine increment)"
    depends_on: [T-3]
    files:
      - config/scripts/orchestrator_next/tests/test_rework_reentry.py
    verify:
      - pytest config/scripts/orchestrator_next/tests/test_rework_reentry.py -v
    test_scenarios:
      - "AC-1 counter climb: drive record() through repeated needs_work rounds feeding payloads with NO state_patch.retries (the engine, not the test, must produce the increment); assert retries['run-phase-review'] rises 0→1→2→… across rounds. (This is RED without T-3's engine increment and GREEN with it — it is the discriminating test, not a test that supplies its own climb.)"
      - "AC-3 exhaustion blocks: drive needs_work rounds until retries reaches quality_bar.max_retry_rounds; record() then sets the entry status to 'blocked' and state.status to 'paused'."
      - "AC-3 dispatch exits 2: after the blocked/paused state is written, the dispatch entrypoint exits 2 and does NOT advance to compute-prediction-accuracy. Reuse the dispatch-exit assertion pattern from test_rework_loop.py::test_ceiling_blocks_and_pauses_and_dispatch_exits_2."
      - "AC-3 below-cap does not block: with retries below max and verdict=needs_work, the entry stays completed, node stays in_progress, state stays active (escalate not triggered)."
    why: "AC-1 (counter increments deterministically), AC-3 (cap blocks with exit 2) — proves the previously-dead escalate branch is now live and the counter accrues from the engine, not from test-supplied values."
    change: "Extend test_rework_reentry.py. Reuse _setup / _nodes_state from tests/test_rework_loop.py. CRITICAL: the climb test must feed _review_payload(verdict='needs_work') with retries_count=None (no state_patch.retries) so only the engine moves the counter — otherwise the test is circular. Call record.record() per round and assert state_raw['retries']['run-phase-review'] rises. For exhaustion, loop rounds up to max_retry_rounds and assert blocked/paused + dispatch exit 2."

  - id: T-5
    title: "Full suite regression checkpoint (phase gate)"
    depends_on: [T-4]
    files: []
    verify:
      - pytest config/scripts/orchestrator_next/tests/ -q
    test_scenarios:
      - "full orchestrator_next test suite green"
      - "no regression in dispatch, readiness, rework-loop, or retry-storm tests"
    why: "phase gate — confirm the verdict-aware change and any counter-ownership edit integrate cleanly across the whole DAG/dispatch surface before phase review."
