        depends_on: []
        files:
        - config/scripts/orchestrator_next/tests/test_rework_reentry.py
        verify:
        - pytest config/scripts/orchestrator_next/tests/test_rework_reentry.py -v
        test_scenarios:
        - "AC-4 (the live bug): a step_history entry for run-phase-review with status=completed\
          \ AND evidence.outputs.phase_review_report.verdict=needs_work, on a node\
          \ whose plan status is in_progress \u2014 _effective_node_status returns\
          \ 'in_progress' (NOT 'completed'). This fails today because history-inference\
          \ overrides the in_progress re-arm."
        - "AC-4 crash-resume preserved: a step_history entry with status=recovered\
          \ (no needs_work verdict) on an in_progress node \u2014 _effective_node_status\
          \ returns 'completed' (mirrors test_dispatch_retry_storm.py:315; must NOT\
          \ regress)."
        - 'AC-4 incomplete_phase behaves like needs_work: a completed entry with verdict=incomplete_phase
          is treated non-terminal.'
        - 'AC-4 pass terminates: a completed entry with verdict=pass IS terminal (returns
          ''completed'').'
        - "AC-1 end-to-end DAG: promoted plan with execute-next-task=completed, task-fix-1=completed,\
          \ run-phase-review re-armed in_progress with a completed+needs_work history\
          \ entry, run-phase-review.depends_on=[task-fix-1], and a later compute-prediction-accuracy\
          \ node depending on run-phase-review \u2014 next_ready_node returns 'run-phase-review',\
          \ NOT 'compute-prediction-accuracy'."
        - "AC-2 advance on pass: same DAG but after a final completed+pass history\
          \ entry for run-phase-review (node status completed) \u2014 next_ready_node\
          \ returns 'compute-prediction-accuracy'."
        - 'Multi-round history: history with two completed+needs_work entries followed
          by one completed+pass entry resolves the node as terminal (the trailing
          pass wins; earlier needs_work entries stay non-terminal).'
        - 'Fail-safe: a completed run-phase-review entry with missing/malformed evidence
          (verdict unreadable) is treated terminal (returns ''completed'').'
        why: "AC-1, AC-2, AC-4 \u2014 pins the bug at the readiness/next-node layer\
          \ where it actually lives, not at the helper layer that already passed pre-fix."
        change: 'New test module. Build State via load_state on a tmp state.yaml (reuse
          fixture shape from tests/test_rework_loop.py _nodes_state and tests/test_dispatch_retry_storm.py
          helpers). Assert against readiness._effective_node_status and readiness.next_ready_node
          directly. The needs_work history entry MUST be written as {status: completed,
          evidence: {outputs: {phase_review_report: {verdict: needs_work}}}} to match
          what record.py writes. These assertions fail on HEAD because _step_completed_in_history
          (readiness.py:74) counts any completed entry as terminal.'
