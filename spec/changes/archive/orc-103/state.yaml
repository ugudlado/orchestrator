          \ 0) + 1`. Apply it AFTER _rework_loop_active has read the pre-increment\
          \ count (so round N reads N-1 then bumps to N). In config/steps/run-phase-review/prompt.md,\
          \ remove the `state_patch.retries increment for this step` line (step 7d)\
          \ so the engine is the sole incrementer \u2014 no double-count (which would\
          \ cap at 4 rounds instead of 8)."
