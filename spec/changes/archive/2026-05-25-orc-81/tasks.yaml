  - id: T-5
    title: "Implement dispatch resume membership guard"
    agent: developer
    depends_on: [T-4]
    files:
      - config/scripts/orchestrator_next/dispatch.py
    verify:
      - cd config && python -m pytest scripts/orchestrator_next/tests/test_dispatch_resume_plan_membership.py -x
      - cd config && python -m pytest scripts/orchestrator_next/tests/ -x
    test_scenarios:
      - "T-4's two assertions pass."
      - "All existing dispatch tests still pass."
    why: "AC-4, AC-5"
    change: |
      In config/scripts/orchestrator_next/dispatch.py:
      1. Add import near the other orchestrator_next imports at top of file:
           from orchestrator_next.reconcile import _step_in_plan
      2. In the resume branch (dispatch.py:287-326), insert the membership check
         immediately after the `if (last is not None and ... last.status == "in_progress" and last.ended_at is None):`
         guard opens, before `step_id = last.step_id` (line 294):
             if not _step_in_plan(state, state.phase, last.step_id):
                 print(
                     f"ERROR: refusing to resume step {last.step_id!r} — "
                     f"not in workflow_plan[{state.phase!r}].nodes "
                     f"(likely ghost from prior schema; "
                     f"check metrics.duckdb step_events for stale rows).",
                     file=sys.stderr,
                 )
                 return {}, 3
         This converts a silent contaminated-resume into a hard exit 3 that
         bin/orchestrator already treats as a fatal dispatch error
         (bin/orchestrator:294-303 maps exit 3 to a hard error).

  - id: T-6
    title: "Add failing regression test for caller-side state.yaml persistence after reconcile"
    agent: developer
    depends_on: [T-5]
    files:
      - config/scripts/orchestrator_next/tests/test_bin_orchestrator_persist_reconcile.py
    verify:
      - cd config && python -m pytest scripts/orchestrator_next/tests/test_bin_orchestrator_persist_reconcile.py -x
    test_scenarios:
      - "Setup: tmp_path with state.yaml containing an in_progress step_history entry for 'ghost-step' (phase='implement'). workflow_plan['implement']['nodes'] = [{id: 'preview-route'}]. DuckDB has the matching ghost row. Run the bin/orchestrator 'next' code path (or a thin subprocess invocation) once."
      - "Assertion: after the call exits (expected exit 1 phase-complete or exit 2 — driver's choice), re-read state.yaml from disk and assert the 'ghost-step' in_progress entry is GONE from step_history (reconcile's strip was persisted, not lost to the early-exit path)."
      - "Control: a second `next` call against the same state.yaml does not re-resurrect the ghost (the row in DuckDB is still there, but the guard keeps it inert)."
      - "Test fails today because bin/orchestrator never writes state.yaml after reconcile mutates step_history."
    why: "AC-3 — bugfix rule: regression test before fix."

  - id: T-7
    title: "Persist state.yaml in bin/orchestrator after reconcile mutates step_history"
    agent: developer
    depends_on: [T-6]
    files:
      - bin/orchestrator
    verify:
      - cd config && python -m pytest scripts/orchestrator_next/tests/test_bin_orchestrator_persist_reconcile.py -x
      - cd config && python -m pytest scripts/orchestrator_next/tests/ -x
    test_scenarios:
      - "T-6's three assertions pass."
      - "All existing orchestrator_next tests still pass."
    why: "AC-3"
    change: |
      In bin/orchestrator, around the reconcile call (bin/orchestrator:281-285):
      1. Before line 283 (`reconcile_in_progress(state, _db, _context)`), snapshot:
           _pre_sig = tuple(
               (e.phase, e.step_id, e.attempt, e.status)
               for e in state.step_history
           )
      2. After line 283 (still inside the try-block), compute the post-signature
         and write state.yaml if changed:
           _post_sig = tuple(
               (e.phase, e.step_id, e.attempt, e.status)
               for e in state.step_history
           )
           if _post_sig != _pre_sig:
               try:
                   import yaml as _yaml
                   from pathlib import Path as _Path
                   _path = _Path(state_yaml_path)
                   with open(_path, "rb") as _f:
                       _pre_bytes = _f.read()
                   _state_raw = _yaml.safe_load(_pre_bytes.decode("utf-8")) or {}
                   # Replace step_history with the reconciled list (raw dicts, preserving order).
                   _state_raw["step_history"] = [e.raw for e in state.step_history]
                   with open(_path, "w", encoding="utf-8") as _f:
                       _yaml.safe_dump(_state_raw, _f, sort_keys=False,
                                       default_flow_style=False, allow_unicode=True)
                   # Corruption guard (mirror dispatch._persist_node_status:216-222):
                   try:
                       with open(_path, "r", encoding="utf-8") as _f:
                           _yaml.safe_load(_f)
                   except _yaml.YAMLError:
                       with open(_path, "wb") as _f:
                           _f.write(_pre_bytes)
               except Exception as _pe:  # noqa: BLE001 — persistence must not block dispatch
                   print(f"warning: reconcile persistence failed — {_pe}",
                         file=sys.stderr)
      3. Verify that `state.step_history[*].raw` already carries the full
         per-entry dict written by parser.py (it does — see parser StepHistoryEntry
         construction; reconcile.py:103-110 already populates `raw=` on materialised
         entries). If parser flips this contract later, the write needs adjusting.

