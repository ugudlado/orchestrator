version: 1
tasks:
  - id: T-1
    title: "Add failing regression tests for workflow_plan-aware reconcile (FR-4, FR-5)"
    agent: developer
    depends_on: []
    files:
      - config/scripts/orchestrator_next/tests/test_reconcile_workflow_plan_membership.py
    verify:
      - cd config && python -m pytest scripts/orchestrator_next/tests/test_reconcile_workflow_plan_membership.py -x
    test_scenarios:
      - "FR-4 strip: state has an in_progress entry for step_id 'ghost-step' (NOT in workflow_plan), DB also has the matching row. Today FR-4 keeps it (DB-present). New rule: drop it because step_id ∉ phase_nodes."
      - "FR-5 materialise skip: DB has an in_progress row for step_id 'ghost-step' (NOT in workflow_plan), state.step_history is empty. Today FR-5 appends it. New rule: skip materialisation; state.step_history stays empty."
      - "In-plan in_progress survives: state has an in_progress entry for step_id 'preview-route' (IS in workflow_plan), DB also has it. Entry survives reconcile unchanged."
      - "Legacy active:[ids] shape: state.workflow_plan = {phase: {active: ['preview-route']}}. An in_progress entry for 'preview-route' must survive (membership goes through phase_nodes, not raw nodes:). An in_progress entry for 'ghost-step' must be stripped."
      - "All tests fail today because the membership guard does not exist yet."
    why: "AC-1, AC-2, AC-5, AC-6 — bugfix rule: regression test must precede the fix."

  - id: T-2
    title: "Implement workflow_plan membership guard in reconcile.py (FR-4 + FR-5)"
    agent: developer
    depends_on: [T-1]
    files:
      - config/scripts/orchestrator_next/reconcile.py
    verify:
      - cd config && python -m pytest scripts/orchestrator_next/tests/test_reconcile_workflow_plan_membership.py -x
      - cd config && python -m pytest scripts/orchestrator_next/tests/test_reconcile_in_progress.py scripts/orchestrator_next/tests/test_reconcile_terminal_skip.py -x
    test_scenarios:
      - "After this task, T-1's four assertions all pass."
      - "Existing reconcile tests still pass (their fixtures may need workflow_plan populated — see T-3)."
    why: "AC-1, AC-2, AC-5"
    change: |
      In config/scripts/orchestrator_next/reconcile.py:
      1. Add helper at module scope (after _SLUG_RE, before _SELECT_IN_PROGRESS):
           def _step_in_plan(state: State, phase: str, step_id: str) -> bool:
               from orchestrator_next.parser import phase_nodes
               return any(str(n.get("id", "")) == step_id for n in phase_nodes(state, phase))
         Move the existing `from orchestrator_next.parser import State, StepHistoryEntry`
         import to also include `phase_nodes` (avoid the lazy import inside the helper if module-load
         order allows it; today parser.py has no dependency on reconcile.py, so a top-level import is fine).
      2. Extend FR-4 strip predicate (reconcile.py:78-83). Current loop:
             for e in state.step_history:
                 if e.status == "in_progress" and (e.phase, e.step_id, e.attempt) not in db_keys:
                     continue
                 kept.append(e)
         New body:
             for e in state.step_history:
                 if e.status == "in_progress":
                     in_db = (e.phase, e.step_id, e.attempt) in db_keys
                     in_plan = _step_in_plan(state, e.phase, e.step_id)
                     if not in_db or not in_plan:
                         continue  # orphan — drop (DB-absent OR plan-absent)
                 kept.append(e)
      3. Extend FR-5 materialise loop (reconcile.py:90-111). Add guard at top of for-body:
             for phase, step_id, attempt, agent_name, started_at in db_rows:
                 if not _step_in_plan(state, phase, step_id):
                     continue  # ghost from prior schema — do not materialise
                 if (phase, step_id, attempt) in yaml_keys:
                     continue
                 state.step_history.append(StepHistoryEntry(...))
      4. Update module docstring (reconcile.py:7-13) to note:
         "- A YAML in_progress entry whose step_id is absent from state.workflow_plan[phase].nodes
            (resolved via parser.phase_nodes) is stripped, regardless of DB presence — protects
            against ghost rows from prior workflow schemas."
         "- A DuckDB in_progress row whose step_id is absent from state.workflow_plan[phase].nodes
            is skipped (not materialised) for the same reason."

  - id: T-3
    title: "Update existing reconcile test fixtures to populate workflow_plan"
    agent: developer
    depends_on: [T-2]
    files:
      - config/scripts/orchestrator_next/tests/test_reconcile_in_progress.py
      - config/scripts/orchestrator_next/tests/test_reconcile_terminal_skip.py
    verify:
      - cd config && python -m pytest scripts/orchestrator_next/tests/test_reconcile_in_progress.py scripts/orchestrator_next/tests/test_reconcile_terminal_skip.py -x
    test_scenarios:
      - "Every existing test that constructs a State with workflow_plan={} is updated so the step_ids it exercises (T-1, T-2, T-3, etc. in the test bodies) are present in workflow_plan[<phase>].nodes."
      - "All existing tests pass after the update."
    why: "AC-6"
    change: |
      In test_reconcile_in_progress.py:43 and any analogous fixture in
      test_reconcile_terminal_skip.py, replace `workflow_plan={}` with a populated
      plan that contains the step_ids used in each test, e.g.:
        workflow_plan={"implement": {"nodes": [
            {"id": "T-1"}, {"id": "T-2"}, {"id": "T-3"}, {"id": "T-4"},
        ]}}
      For tests that use non-"implement" phases, mirror the phase name. Inspect each
      test individually — the populated set must include every step_id used in
      that test (both YAML entries and DB upserts), otherwise the new membership
      guard will strip entries the test expects to survive.

  - id: T-4
