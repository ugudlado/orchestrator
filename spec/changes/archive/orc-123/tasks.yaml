# tasks.yaml for orc-123 — Add design workflow
# Field rules / validation: config/steps/design-and-draft-artifacts/prompt.md § Tasks YAML Format Contract
#
# NOTE: The deliverables (config/workflows/design.yaml + skills/design/SKILL.md)
# are ALREADY committed on this branch (39a57f8, a26714b). Per the
# check-rerun-does-not-inspect-HEAD learning, this run is verification-only:
# tasks are marked status: completed and their verify commands assert the
# shipped state rather than re-implementing it. There are no Python units here —
# only declarative config + a skill dispatcher — so there are no RED/TDD tasks
# and no pytest phase-gate.
version: 1
tasks:
  - id: T-1
    title: "Verify config/workflows/design.yaml declares the correct step sequence"
    status: completed
    depends_on: []
    files:
      - config/workflows/design.yaml
    verify:
      - test -f config/workflows/design.yaml
      - grep -q 'check-rerun' config/workflows/design.yaml
      - grep -q 'create-worktree' config/workflows/design.yaml
      - grep -q 'explore' config/workflows/design.yaml
      - grep -q 'design-and-draft-artifacts' config/workflows/design.yaml
      - grep -q 'design-review' config/workflows/design.yaml
      - grep -q 'on_failure: design-and-draft-artifacts' config/workflows/design.yaml
      - grep -q 'max_retries: 3' config/workflows/design.yaml
      - grep -q 'run-learn-cycle' config/workflows/design.yaml
    test_scenarios:
      - "design.yaml exists in config/workflows/"
      - "steps are check-rerun, create-worktree, explore, design-and-draft-artifacts, design-review, run-learn-cycle"
      - "design-review has on_failure: design-and-draft-artifacts and max_retries: 3"
      - "no implementation step (e.g. implement-tasks) is present"
    why: "AC-1 — schema declares the design-only step sequence ending at design-review"
    change: "Already shipped in 39a57f8 (config/workflows/design.yaml). Verification-only — assert presence and step list; no edit."

  - id: T-2
    title: "Verify orchestrator design <id> resolves as a dynamic CLI subcommand"
    status: completed
    depends_on: [T-1]
    files:
      - bin/orchestrator
    verify:
      - grep -q '_workflow_subcommands' bin/orchestrator
      - "python3 -c \"import glob, os; names={os.path.splitext(os.path.basename(p))[0] for p in glob.glob('config/workflows/*.yaml')}; assert 'design' in names, names\""
    test_scenarios:
      - "_workflow_subcommands() globs config/workflows/*.yaml"
      - "'design' is in the resolved subcommand set because design.yaml is present"
      - "orchestrator design <id> therefore maps to run <id> --schema design"
    why: "AC-2 — CLI resolves the design subcommand with no code change"
    change: "No edit — resolution is dynamic (bin/orchestrator:263,286). Verify the glob picks up design.yaml."

  - id: T-3
    title: "Verify /design skill dispatcher exists and routes to the design schema"
    status: completed
    depends_on: []
    files:
      - skills/design/SKILL.md
    verify:
      - test -f skills/design/SKILL.md
      - grep -q 'user-invocable: true' skills/design/SKILL.md
      - grep -q 'schema design' skills/design/SKILL.md
    test_scenarios:
      - "skills/design/SKILL.md exists"
      - "frontmatter marks it user-invocable: true"
      - "execution body routes to: orchestrate $ARGUMENTS --schema design"
    why: "AC-3 — /design skill is a thin dispatcher to the design schema"
    change: "Already shipped in a26714b (skills/design/SKILL.md). Verification-only — assert dispatcher content; no edit."

  - id: T-4
    title: "Verify run-learn-cycle is the terminal step and is non-blocking in design context"
    status: completed
    depends_on: [T-1]
    files:
      - config/workflows/design.yaml
      - config/steps/run-learn-cycle/prompt.md
    verify:
      - "test \"$(grep -c 'run-learn-cycle' config/workflows/design.yaml)\" -ge 1"
      - grep -qi 'best-effort\|non-blocking\|must not fail' config/steps/run-learn-cycle/prompt.md
    test_scenarios:
      - "run-learn-cycle is listed as the final step in design.yaml"
      - "run-learn-cycle contract declares learning is best-effort and must not fail the run"
      - "design-only run (no implementation artifacts) reaches run-learn-cycle without failing"
    why: "AC-5 — design-phase learnings captured before exit; learning cannot fail the run"
    change: "No edit — run-learn-cycle already terminal in design.yaml and best-effort per its contract. Verify both."
