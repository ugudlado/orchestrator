        13, misses: 1, repo: orchestrator -->'
      - 'Design claims about caller-site capabilities (e.g., ''X already holds an
        open connection'', ''Y already imports Z'', ''the caller has access to W'')
        must be verified by grep against HEAD before finalizing the artifact — not
        inferred from pattern-matching similar code paths. Unverified caller-site
        claims that prove false become critical findings at phase review and force
