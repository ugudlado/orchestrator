focus: |
  Orchestrator observability rework — subprocess-per-step with runtime-agnostic
  self-reported metrics. Replace inline step execution + post-hoc JSONL mining
  with subprocess-per-step + self-reported JSON. Orchestrator is a minimal
  driver that reads state.yaml and shells out to the step's `run:` command.
  Agent writes step-report JSON (step, agent, started_at, ended_at, duration_ms,
  tokens{input,output,cache_read}, tool_uses[], cost_usd, status, artifacts[])
  to <workflow_dir>/reports/<step>-<attempt>.json before exit. Trap covers
  crash path. Ship one reference adapter (Claude-native) to prove contract.
  Leave compute-swe-metrics.sh as legacy fallback.
  Empirical pivot: 5 recent archives show all steps ran `agent: inline`,
  Claude Code doesn't expose parent-context token counter, so inline steps
  can't ever report tokens. Subprocess-per-step is the only design that
  delivers reliable per-step metrics AND runtime-agnosticism.
