learnings:
- id: missing-step-contracts-should-be-pre-filtered
  learned: 2026-04-19
  source: live-telemetry-and-repeat-until-enforcement
  rule: "workflow-init must validate that each step declared in the schema's workflow_plan\
    \ has a corresponding contract file at $ORCHESTRATOR_HOME/config/steps/<id>.yaml.\
    \ Steps without a contract file must be pre-filtered into workflow_plan[phase].filtered[]\
    \ with reason \"contract file missing (no config/steps/<id>.yaml)\" and logged\
    \ as a WARNING \u2014 never fail init, never silently skip. This prevents downstream\
    \ dispatch from attempting to load a missing contract and allows the reviewer\
    \ to see the gap. ISSUE-18 surfaced: run-simplify and run-feature-verification\
    \ are declared in bugfix.yaml implement phase but no contract files exist.\n"
- id: self-referential-bug-bootstrap-workaround
  learned: 2026-04-19
  source: live-telemetry-and-repeat-until-enforcement
  rule: 'When the bug being fixed affects the current workflow execution (self-referential),
    the fix plan must explicitly acknowledge the active bug and describe a manual
    workaround. For ISSUE-16 (repeat_until not enforced), the workaround was: manually
    edit state.yaml to group T-4/T-5/T-6 into a single chain spawn rather than relying
    on the broken repeat loop. Document the workaround in fix-plan.md under a "Bootstrap
    Constraint" section so reviewers understand why the execution differs from standard
    workflow.

    '
- id: preview-route-mktemp-uses-var-folders
  learned: 2026-04-19
  source: live-telemetry-and-repeat-until-enforcement
  rule: "scripts/inline/preview-route.sh lines 24-25 call mktemp without a template,\
    \ which defaults to /var/folders on macOS and is blocked by the Claude Code sandbox.\
    \ Fix: use mktemp \"${TMPDIR:-/tmp}/preview-route-XXXXXX\" and mktemp \"${TMPDIR:-/tmp}/preview-route-err-XXXXXX\"\
    \ \u2014 the same pattern already used in config/scripts/backfill-zero-cost-metrics.sh:131.\
    \ Non-blocking (step handles failures gracefully) but generates noisy output.\n"
- id: linear-quota-autopilot-opt-in
  learned: 2026-04-19
  source: live-telemetry-and-repeat-until-enforcement
  rule: 'Linear free issue quota for this workspace is exhausted. All autopilot iterations
    in autopilot-2026-04-19-003 ran with linear: false via resolved_flags. Keep linear:
    false as the effective default for autopilot sessions in this workspace until
    quota resets or account is upgraded. Schema defaults (linear: true) are overridden
    per-iteration by the autopilot preflight.

    '
