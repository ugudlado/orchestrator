title: Live cost telemetry + repeat_until enforcement (ISSUE-16 + ISSUE-17)
change_description: "Pair two dispatcher/record.py bugs:\n- ISSUE-16: record.py ignores\
  \ step contract `repeat_until`, advancing next_step\n  after one execution. Autopilot\
  \ can mark workflows complete while tasks remain\n  unchecked in tasks.md.\n- ISSUE-17:\
  \ `orchestrator cost --change-id <cid>` reports $0 because\n  step_events.cost_usd\
  \ is NULL for recent rows. Model isn't captured from\n  agent Task <usage> blocks\
  \ and routes.yaml fallback isn't wired in.\nTogether these close the autopilot live-feedback\
  \ loop: next run enforces\nrepeat semantics AND shows real cost without manual backfill.\n\
  Source: .state/autopilot/workflow-issues-2026-04-19-003.md\n"
