# tasks.yaml — orc-89: Emit workflow_issues live to retro.md
# Format contract: config/steps/design-and-draft-artifacts/prompt.md § Tasks YAML Format Contract
# verify commands are repo-root-relative (run from $REPO_ROOT).
version: 1
tasks:
  - id: T-1
    title: "Write the workflow-issues contract (config/steps/contracts/workflow-issues.md)"
    depends_on: []
    files:
      - config/steps/contracts/workflow-issues.md
      - config/steps/contracts/done-payload.md
    verify:
      - test -f config/steps/contracts/workflow-issues.md
      - grep -q 'dedup_key' config/steps/contracts/workflow-issues.md
      - grep -q 'category' config/steps/contracts/workflow-issues.md
      - grep -q 'severity' config/steps/contracts/workflow-issues.md
      - grep -q 'workflow-issues.md' config/steps/contracts/done-payload.md
    test_scenarios:
      - "contract documents the workflow_issues block schema with field types"
      - "contract lists allowed category values (seen-so-far list) and severity enum"
      - "contract documents retro.md H2 block layout matching append-retro.sh output"
      - "contract documents dedup_key conventions and the hash fallback"
      - "done-payload.md's workflow_issues row links to the new contract"
    why: "AC-4 — establish the format contract before any producer or consumer is wired."
    change: "Create config/steps/contracts/workflow-issues.md with sections: Payload schema (id, category, severity, surfaced_at, detail, workaround, fix_direction, dedup_key), Retro.md layout (H2 per issue, matching append-retro.sh lines 55-90), Dedup semantics, Category seen-so-far list, Severity enum. Edit done-payload.md's optional-fields table to add the workflow_issues row pointing to this contract."

  - id: T-2
    title: "Write tests for record-issue.sh and append-retro.sh dedup (RED — tests must fail)"
    depends_on: [T-1]
    files:
      - config/tests/test_record_issue.bats
      - config/tests/test_append_retro_dedup.bats
    verify:
      - "! config/tests/bats config/tests/test_record_issue.bats"
      - "! config/tests/bats config/tests/test_append_retro_dedup.bats"
    test_scenarios:
      - "record-issue.sh with all env+flags writes a single JSON line to .pending-issues.jsonl with the supplied fields"
      - "record-issue.sh with missing CHANGE_ID or WORKTREE_PATH exits 0 and prints a stderr warning, no file written"
      - "record-issue.sh appends (not overwrites) when called multiple times in one step"
      - "append-retro.sh skips an issue whose dedup_key already appears in retro.md and reports {appended: 0}"
      - "append-retro.sh appends a new issue with a fresh dedup_key and reports {appended: 1}"
      - "append-retro.sh with missing dedup_key behaves as today (no skip)"
    why: "AC-2, AC-5 — failing tests pin behavior before implementation lands."
    change: "Create two bats test files exercising the helper and dedup paths via WORKTREE_PATH/CHANGE_ID env in a $BATS_TMPDIR sandbox. Tests fail before T-3/T-4 because record-issue.sh does not exist and append-retro.sh does not dedup."

  - id: T-3
    title: "Implement config/scripts/inline/record-issue.sh (GREEN — record-issue tests pass)"
    depends_on: [T-2]
    files:
      - config/scripts/inline/record-issue.sh
    verify:
      - test -x config/scripts/inline/record-issue.sh
      - bash -n config/scripts/inline/record-issue.sh
      - config/tests/bats config/tests/test_record_issue.bats
    test_scenarios:
      - "all T-2 record-issue.sh tests pass"
      - "script parses clean (bash -n)"
      - "script never exits non-zero, even on bad input"
    why: "AC-2 — inline helper that surfaces non-fatal issues via the sentinel file."
    change: "Create config/scripts/inline/record-issue.sh: parse --category/--severity/--detail/--dedup-key/--workaround/--fix-direction flags; require CHANGE_ID and WORKTREE_PATH env (warn-to-stderr-and-exit-0 if missing); emit one JSON object as a single line appended to $WORKTREE_PATH/spec/changes/$CHANGE_ID/.pending-issues.jsonl; default surfaced_at to ${PHASE:-unknown}/${STEP_ID:-unknown}; chmod +x. Wrap body in 'trap : ERR' so any unexpected failure still exits 0."

  - id: T-4
    title: "Add dedup_key skip to config/scripts/inline/append-retro.sh (GREEN — dedup tests pass)"
    depends_on: [T-2]
    files:
      - config/scripts/inline/append-retro.sh
    verify:
      - bash -n config/scripts/inline/append-retro.sh
      - config/tests/bats config/tests/test_append_retro_dedup.bats
    test_scenarios:
      - "all T-2 append-retro dedup tests pass"
      - "existing append-retro callers (record.py path) continue to work — appended count and retro_path still emitted"
      - "appended count in stdout JSON excludes skipped duplicates"
    why: "AC-5 — single retro entry across retries for the same anomaly."
    change: "Edit config/scripts/inline/append-retro.sh inside the python3 heredoc (around line 70): (1) add 'dedup_key' as a written field in the H2 block so it appears in retro.md; (2) before writing each issue, if issue.get('dedup_key') is set, scan the already-on-disk file content for a line matching '- **dedup_key**: <value>' and if found skip the issue (do not increment appended)."

  - id: T-5
    title: "Wire driver detection + sentinel drain in skills/orchestrate/SKILL.md"
    depends_on: [T-3, T-4]
    files:
      - skills/orchestrate/SKILL.md
    verify:
      - grep -q 'workflow_issues' skills/orchestrate/SKILL.md
      - grep -q '.pending-issues.jsonl' skills/orchestrate/SKILL.md
      - grep -q 'retry-then-success' skills/orchestrate/SKILL.md
      - grep -q 'empty-usage' skills/orchestrate/SKILL.md
      - grep -q 'manual-phase-advance' skills/orchestrate/SKILL.md
      - grep -q 'workflow-issues.md' skills/orchestrate/SKILL.md
    test_scenarios:
      - "SKILL.md documents the four detection categories the driver checks"
      - "SKILL.md instructs the driver to drain .pending-issues.jsonl, merge with detected + agent-supplied issues, attach to the done payload, then rm -f only on done exit 0"
      - "SKILL.md notes that on done exit 3 the sentinel file is NOT removed (preserved for retry)"
      - "SKILL.md cross-references config/steps/contracts/workflow-issues.md"
    why: "AC-1, AC-3 — driver becomes the single assembly point for workflow_issues."
    change: "Edit skills/orchestrate/SKILL.md in the LOOP section (around line 192, immediately before 'orchestrator done state.yaml <<< ...'): insert a numbered sub-step 'Compute workflow_issues' that (a) reads state.yaml.step_history[-1] to detect retry-then-success (attempt > 1 and status == completed; dedup_key 'retry-success:<phase>:<step_id>'), (b) inspects COMPLETION.agent_task_result for an agentId line with an empty usage block (dedup_key 'empty-usage:<phase>:<step_id>'), (c) tracks a driver-local manual_phase_advance_flag set when the driver patches phase outside orchestrator done (dedup_key 'manual-phase-advance:<phase>'), (d) drains $WORKFLOW_STATE_DIR/$CHANGE_ID/.pending-issues.jsonl line-by-line, (e) concatenates with any agent-supplied workflow_issues from COMPLETION. Modify the done payload line to include workflow_issues when the merged list is non-empty. Add a post-done step: 'on exit 0, rm -f .pending-issues.jsonl'. Append a paragraph linking to config/steps/contracts/workflow-issues.md."

  - id: T-6
    title: "Real-run validation: produce a non-empty retro.md from this workflow run"
    depends_on: [T-5]
    files:
      - spec/changes/orc-89/retro.md
    verify:
      - test -f spec/changes/orc-89/retro.md
      - grep -qE '^## ISSUE-[0-9]+' spec/changes/orc-89/retro.md
      - grep -q 'dedup_key' spec/changes/orc-89/retro.md
    test_scenarios:
      - "spec/changes/orc-89/retro.md exists and is non-empty"
      - "at least one ISSUE-N H2 block is present"
      - "the block carries category, severity, surfaced_at, detail, dedup_key"
      - "no human-authored content — file was produced solely by the live emit path"
    why: "AC-6 — proves the end-to-end emit path works on a real workflow run (this feature's own run satisfies the AC)."
    change: "Trigger the emission path during this workflow run by invoking config/scripts/inline/record-issue.sh with a representative issue (category=tooling-bug, dedup_key=orc-89-validation) and confirming the driver drains the sentinel into retro.md. Acceptable: a deliberate one-shot invocation counts as a live emit (AC-6 requires non-empty retro.md from the live path, not from an organic anomaly)."

  - id: T-7
    title: "Phase gate — full repo tests + lint on changed shell scripts"
    depends_on: [T-3, T-4, T-5, T-6]
    files: []
    verify:
      - bash -n config/scripts/inline/record-issue.sh
      - bash -n config/scripts/inline/append-retro.sh
      - config/tests/bats config/tests/test_record_issue.bats
      - config/tests/bats config/tests/test_append_retro_dedup.bats
    test_scenarios:
      - "all new and edited shell scripts parse clean"
      - "all new bats tests pass"
      - "no regression: existing append-retro callers still receive the same {appended, retro_path} contract"
    why: "phase gate — confirm the emit-side wiring integrates before complete-phase signoff."

  # ─── ORC-89.1 refactor (see design.md Addendum) ─────────────────────────
  # Splits agent-issues vs workflow-mechanics issues, makes detection
  # executable so shell and LLM drivers share one source, deletes the
  # sentinel protocol in favor of an exit-10 soft-fail convention, and
  # extends run-learn-cycle to sync retro→backlog.
  # ────────────────────────────────────────────────────────────────────────

  - id: T-8
    title: "Rewrite workflow-issues.md for the refactored shape"
    depends_on: [T-7]
    files:
      - config/steps/contracts/workflow-issues.md
    verify:
      - grep -q 'detect-workflow-issues.sh' config/steps/contracts/workflow-issues.md
      - "! grep -q 'pending-issues.jsonl' config/steps/contracts/workflow-issues.md"
      - "! grep -q 'record-issue.sh' config/steps/contracts/workflow-issues.md"
      - grep -q 'exit 10' config/steps/contracts/workflow-issues.md
      - "! grep -q 'empty-usage' config/steps/contracts/workflow-issues.md"
      - grep -q 'script-warning' config/steps/contracts/workflow-issues.md
      - grep -q 'script-failed' config/steps/contracts/workflow-issues.md
    test_scenarios:
      - "contract names detect-workflow-issues.sh as canonical driver path"
      - "sentinel-file section is removed; exit-10 soft-fail convention documented in its place"
      - "empty-usage category dropped from seen-so-far list"
      - "script-warning category added with stable dedup_key pattern"
      - "producers/consumers table reflects: agent COMPLETION + driver helper, single writer through record.py"
    why: "establish the new schema/contract before any code changes so writers and readers agree."
    change: "Replace § 'Documented driver key patterns (orc-89)' and § 'Sentinel file' with new sections documenting detect-workflow-issues.sh and the exit-10 soft-fail convention. Drop empty-usage row from category table; add script-warning row. Rewrite producers/consumers table: drop record-issue.sh row; replace driver row with 'Driver (shell or LLM) — invoke detect-workflow-issues.sh, merge stdout into done payload'."

  - id: T-9
    title: "Create scripts/lib/detect-workflow-issues.sh shared helper"
    depends_on: [T-8]
    files:
      - scripts/lib/detect-workflow-issues.sh
      - config/tests/test_detect_workflow_issues.bats
    verify:
      - test -x scripts/lib/detect-workflow-issues.sh
      - bash -n scripts/lib/detect-workflow-issues.sh
      - config/tests/bats config/tests/test_detect_workflow_issues.bats
    test_scenarios:
      - "called with --state-yaml pointing at a step_history where last attempt > 1 and status == completed, helper emits a single retry-success JSON issue on stdout"
      - "called with --script-exit 10 and --step-id X, helper emits one script-warning issue with detail derived from stderr-file (last 5 lines) and dedup_key 'script-warning:X'"
      - "called with --script-exit 0 and no other anomalies, helper emits '[]' on stdout"
      - "called with --script-exit 1, helper emits one script-failed issue"
      - "called with --tool-exit non-zero, helper emits one tool-crashed issue"
      - "called with --manual-phase-advance phase=foo, helper emits one manual-phase-advance issue"
      - "stdout is always a valid JSON array (jq -e . succeeds)"
    why: "single source of detection logic both drivers call; replaces the 4-category prose in SKILL.md."
    change: "Create scripts/lib/detect-workflow-issues.sh accepting flags: --state-yaml PATH (retry via last step_history entry), --attempt N (retry before state.yaml is updated), --script-exit N, --script-stderr-file PATH, --tool-exit N, --manual-phase-advance PHASE, --step-id ID, --phase NAME. Emits a JSON array on stdout. Each detected anomaly becomes one object with category/severity/surfaced_at/detail/dedup_key. Exit 0 always; helper failures emit '[]' and warn to stderr."

  - id: T-10
    title: "Wire detect-workflow-issues into run-workflow.sh"
    depends_on: [T-9]
    files:
      - scripts/run-workflow.sh
    verify:
      - bash -n scripts/run-workflow.sh
      - grep -q 'detect-workflow-issues.sh' scripts/run-workflow.sh
      - grep -q 'exit 10\|SCRIPT_EXIT.*10\|== 10' scripts/run-workflow.sh
    test_scenarios:
      - "after run_step (script exit 0 path), helper is invoked; non-empty JSON array is merged into done payload's workflow_issues field"
      - "when SCRIPT_EXIT == 10, status remains 'completed' and a script-warning issue is added"
      - "when SCRIPT_EXIT > 0 and != 10, behavior is unchanged (status=failed)"
      - "when TOOL_EXIT != 0, helper emits a tool-crashed issue merged into the failure done payload"
      - "in the agent-completed path, helper is invoked with --attempt; retry-success entries appear in the merged payload when attempt > 1"
      - "when SCRIPT_EXIT is 1, a script-failed issue is merged into the done payload"
    why: "shell driver currently emits zero workflow_issues; this wires the new helper into all three exit points."
    change: "Edit scripts/run-workflow.sh: (1) in run_step branch around line 525, add 'if SCRIPT_EXIT == 10 then STATUS=completed' before the existing status assignment; (2) before each 'orchestrator done' call (lines 534, 634, 660), invoke detect-workflow-issues.sh with the relevant flags, capture stdout, and use jq to merge into DONE_PAYLOAD's workflow_issues field; (3) ensure helper failure does not break the loop (best-effort)."

  - id: T-11
    title: "Slim SKILL.md driver-detection prose"
    depends_on: [T-9]
    files:
      - skills/orchestrate/SKILL.md
    verify:
      - "! grep -q 'pending-issues.jsonl' skills/orchestrate/SKILL.md"
      - "! grep -q 'empty-usage' skills/orchestrate/SKILL.md"
      - "! grep -q 'retry-then-success' skills/orchestrate/SKILL.md"
      - grep -q 'detect-workflow-issues.sh' skills/orchestrate/SKILL.md
      - grep -q 'workflow-issues.md' skills/orchestrate/SKILL.md
    test_scenarios:
      - "the four-category prose checklist (current lines ~198-217) is replaced with a single-line invocation of detect-workflow-issues.sh"
      - "sentinel-drain prose and .pending-issues.jsonl handling are removed"
      - "agent-supplied workflow_issues passthrough mention is preserved (COMPLETION.workflow_issues forwarded verbatim)"
      - "cross-reference to workflow-issues.md remains"
    why: "drift trap fix — replace 30+ lines of prose with the executable helper both drivers share."
    change: "In skills/orchestrate/SKILL.md, replace the 'Compute workflow_issues' sub-step in the LOOP block (current step 3 of the agent-completed path) with: 'Run scripts/lib/detect-workflow-issues.sh and merge its stdout into the done payload. Pass --state-yaml, --action-json, and --manual-phase-advance when applicable. Append any COMPLETION.workflow_issues verbatim.' Delete the four-category bullet list, sentinel-drain instructions, and the post-done rm -f .pending-issues.jsonl block."

  - id: T-12
    title: "Delete sentinel protocol + record-issue.sh"
    depends_on: [T-10, T-11]
    files:
      - config/scripts/inline/record-issue.sh
      - config/tests/test_record_issue.bats
    verify:
      - "! test -f config/scripts/inline/record-issue.sh"
      - "! test -f config/tests/test_record_issue.bats"
      - "! grep -rn 'record-issue.sh\\|pending-issues.jsonl' config/ scripts/ skills/ 2>/dev/null | grep -v '^[^:]*/archive/' | grep -v '^[^:]*/retro.md:'"
    test_scenarios:
      - "config/scripts/inline/record-issue.sh is deleted"
      - "config/tests/test_record_issue.bats is deleted"
      - "no live code/contract references to record-issue.sh or .pending-issues.jsonl remain outside archived spec/retro files"
    why: "sentinel protocol is superseded by the exit-10 soft-fail convention; dead code must not linger."
    change: "git rm config/scripts/inline/record-issue.sh config/tests/test_record_issue.bats. Confirm no live references remain (grep ignoring spec/changes/archive/ and existing retro.md history)."

  - id: T-13
    title: "Extend run-learn-cycle with retro→backlog sync"
    depends_on: [T-8]
    files:
      - config/steps/run-learn-cycle/contract.yaml
      - config/steps/run-learn-cycle/prompt.md
    verify:
      - grep -q 'backlog_tickets_synced' config/steps/run-learn-cycle/contract.yaml
      - grep -q 'retro.md' config/steps/run-learn-cycle/prompt.md
      - grep -q 'backlog' config/steps/run-learn-cycle/prompt.md
    test_scenarios:
      - "contract.yaml declares backlog_tickets_synced as a new output"
      - "contract.yaml verify block includes an AC checking retro.md was consulted"
      - "prompt.md instructs workflow-learner to read retro.md and invoke the backlog-manager skill for triage — skill handles dedup, priority, and backend selection"
      - "prompt.md preserves existing learn-cycle instructions; sync is additive"
    why: "close the loop — retro.md is now consistently populated, learn-cycle must actually act on it."
    change: "Edit config/steps/run-learn-cycle/contract.yaml: add 'backlog_tickets_synced' to outputs; append an AC to verify block ('retro.md issues with unresolved fix_direction have backlog tickets'). Edit config/steps/run-learn-cycle/prompt.md: add a section instructing the workflow-learner agent to read $WORKTREE_PATH/spec/changes/$CHANGE_ID/retro.md, parse ISSUE-N blocks, and invoke the `backlog-manager` skill for triage of each unresolved issue. The skill owns dedup-against-existing, priority assignment, and backend selection (Linear vs Backlog.md); workflow-learner just hands it the parsed issue data."

  - id: T-14
    title: "Phase gate — refactor integration check"
    depends_on: [T-10, T-11, T-12, T-13]
    files: []
    verify:
      - bash -n scripts/run-workflow.sh
      - bash -n scripts/lib/detect-workflow-issues.sh
      - config/tests/bats config/tests/test_detect_workflow_issues.bats
      - config/tests/bats config/tests/test_append_retro_dedup.bats
      - config/tests/bats config/tests/test_workflow_issues_emit_path.bats
    test_scenarios:
      - "all changed shell parses clean"
      - "new helper tests pass; dedup tests still pass"
      - "detect → append-retro integration test proves the refactor emit path (AC-6)"
      - "no live references to record-issue.sh or .pending-issues.jsonl remain"
      - "SKILL.md and workflow-issues.md no longer reference the removed shape"
    why: "phase gate for the ORC-89.1 refactor — confirm both driver paths share one source and the sentinel protocol is fully removed."
