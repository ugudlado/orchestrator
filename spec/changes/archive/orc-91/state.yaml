        test_scenarios:
        - all T-1 bats scenarios pass
        - shellcheck (or bash -n) reports no syntax errors
        - helper exits 0 in every test scenario including simulated CLI failures
        why: "AC-1 through AC-9 \u2014 the helper IS the deterministic sync logic;\
          \ the agent only invokes it."
        change: "Create config/scripts/inline/backlog-sync-from-retro.sh (~150 lines\
          \ bash). Top-of-file: parse args ($1=retro_path, $2=feature_id), read spec/project.yaml\
          \ ticketing key via `grep -E '^ticketing:'`, early-exit if != backlog (AC-6).\
          \ Then `grep -c '^## ISSUE-' \"$retro_path\"` \u2014 if 0 or file missing,\
          \ emit `no retro issues found` and exit 0 (AC-7). Main loop: use awk to\
          \ split the file into per-ISSUE blocks; for each block extract `category`,\
          \ `severity`, `detail`, `fix_direction`, `backlog_entry` via `grep -E '^-\
          \ \\*\\*<name>\\*\\*:'`. Resolve dedup_key per D-2 / D-6 (lowercase + collapse\
          \ non-alnum to `-`; first 8 words for fix_direction). Maintain an associative-array\
          \ ledger `declare -A LEDGER` of `dedup_key \u2192 new_ticket_id` for self-dedup\
          \ (AC-8). For each issue: check ledger; else `backlog search \"$key\" --plain`\
          \ and parse rows (tab/space-separated `task-N  Title  Status`); apply D-3\
          \ tie-break (substring match wins, then `In Progress > To Do > Done`, then\
          \ lowest id). Branch on match status: open \u2192 `backlog task edit <id>\
          \ --append-notes \"$(printf 'Recurred in feature %s on %s\\n- detail: %s'\
          \ \"$feature_id\" \"$(date +%F)\" \"$detail\")\"` (AC-2); Done \u2192 same\
          \ append on closed ticket + `backlog task create \"Regression: $orig_title\
          \ ($orig_id) recurred after close\" --priority high --label recurrence-1,from-retro,regression\
          \ --ac \"$fix_direction\" -d \"...\"` then capture new id from stdout (AC-3);\
          \ none \u2192 `backlog task create \"$title\" --priority $(severity_to_priority\
          \ $severity per D-4) --label recurrence-1,from-retro --ac \"$fix_direction\"\
          \ -d \"...\"` and store id in ledger (AC-1). Wrap every `backlog` invocation\
          \ in `if ! out=$(... 2>&1); then echo \"[learn] sync: $issue_id \u2192 ERROR\
          \ ($(head -1 <<<\"$out\"))\"; continue; fi` (AC-9, D-10). Emit one audit\
          \ line per issue + final summary (AC-4). Final `exit 0`."
