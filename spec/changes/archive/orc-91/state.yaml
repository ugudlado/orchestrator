        \ 12, hits: 22, misses: 1, repo: orchestrator -->"
      - "Design claims about caller-site capabilities (e.g., 'X already holds an open\
        \ connection', 'Y already imports Z', 'the caller has access to W') must be\
        \ verified by grep against HEAD before finalizing the artifact \u2014 not\
        \ inferred from pattern-matching similar code paths. Unverified caller-site\
