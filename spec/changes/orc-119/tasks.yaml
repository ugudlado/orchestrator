version: 1
tasks:
  - id: T-1
    title: "Honor explicit pending node status over step_history in _effective_node_status"
    status: completed
    tokens_in: 2600
    tokens_out: 700
    duration_s: 180
    depends_on: []
    files:
      - orchestrator_next/readiness.py
    verify:
      - pytest orchestrator_next/tests/test_rework_loop.py -v
    test_scenarios:
      - "existing on_failure routing tests still pass (no regression)"
      - "escalation / halt_cap_exceeded tests still pass"
    why: "AC-1, AC-3, AC-4, AC-5 — the core fix; an explicit node.status == 'pending' must win over a stale step_history completed entry so an on_failure reset target is treated as not-completed (ready)."
    change: >-
      In orchestrator_next/readiness.py :: _effective_node_status (lines 76-83),
      add a guard BEFORE the _step_completed_in_history override: after reading
      `status = node.get("status")`, insert `if status == "pending": return "pending"`.
      Place it immediately after the existing `if status == "completed": return "completed"`
      line and before the `if _step_completed_in_history(...)` line. Key on the literal
      string "pending" only — do NOT match None/absent, so the replay/resume override is
      preserved for every other status. Update the function docstring to note that an
      explicit `pending` status (the on_failure reset write) takes priority over the
      step_history completion override. The existing test_rework_loop.py suite must stay
      green — it covers the resume/escalation paths this guard must not disturb.

  - id: T-2
    title: "Add regression test: on_failure reset target with stale completed step_history is re-dispatched"
    status: completed
    tokens_in: 4200
    tokens_out: 1400
    duration_s: 360
    depends_on: [T-1]
    files:
      - orchestrator_next/tests/test_rework_loop.py
    verify:
      - pytest orchestrator_next/tests/test_rework_loop.py -v
    test_scenarios:
      - "next_ready_node returns the on_failure reset target when it has a prior completed step_history entry and node.status == pending"
      - "after record() fails run-phase-review, next_step resolves to execute-next-task (the reset target), not run-ux-critique or a later node"
      - "a node with a completed step_history entry but NO explicit pending write is still treated as completed (resume invariant)"
    why: "AC-1, AC-2, AC-3 — reproduces the ORC-117 observed failure that the existing _nodes_state fixture does not cover (it lacks a completed step_history entry for the reset target)."
    change: >-
      Append a new test class (e.g. TestOnFailureResetReadiness) to
      orchestrator_next/tests/test_rework_loop.py. Build on the existing _nodes_state /
      _setup / _review_payload helpers in this file (all present at HEAD). The repro:
      take _nodes_state(tmp_path) and ADD a prior `{"step_id": "execute-next-task",
      "phase": "implement", "status": "completed", ...}` entry to its step_history (this
      stale completed entry is the bug trigger — the existing fixture omits it). Then
      (a) directly assert readiness.next_ready_node on a hand-built State where the reset
      target has node.status == "pending" AND a completed step_history entry returns
      "execute-next-task"; and (b) end-to-end: call record.record(state_path,
      _review_payload("needs_work")) and assert _node_status(..., "execute-next-task")
      == "pending" AND the recomputed next_step / next_ready_node is "execute-next-task"
      (not "run-ux-critique"). Add a negative case: a node with a completed step_history
      entry but status != "pending" is still reported completed by
      readiness._effective_node_status. Import readiness and parser.load_state as needed
      (both resolve at HEAD). No xfail markers — tdd_required is not set, so T-2 runs
      after the T-1 fix and is expected to pass green on first run.

