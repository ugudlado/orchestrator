version: 1

ticketing: backlog  # backlog | linear — drives orchestrator_next/scripts/tickets/ and /backlog-manager

project:
  name: orchestrator
  repo: orchestrator
  summary: LLM-agnostic configuration layer for deterministic, repeatable workflow execution across any AI coding tool.

vision:
  purpose: >
    LLM-agnostic configuration layer that drives any multi-step workflow in a
    deterministic, repeatable way — schemas, steps, and quality gates defined
    once, executed consistently by any LLM-powered tool.
  target_users: >
    Anyone running structured, repeatable workflows with LLMs — software engineers,
    researchers, content creators, ops teams — who want deterministic process
    execution rather than ad-hoc prompt-driven results.
  valuable_means:
    - Makes any workflow deterministic and portable across LLM tools
    - Decouples workflow definition (config) from execution (any LLM)
    - Enables new workflow types beyond software development
    - Moves the engine forward — better schemas, steps, quality gates
  direction: >
    A universal workflow engine for LLMs — define any process as config,
    run it on any tool, learn from outcomes, and refine schemas automatically.

architecture:
  overview: >
    Config-driven workflow engine. Agents read ORCHESTRATOR_HOME for schemas, step
    contracts, and templates. Skills are the entry points. install.sh wires
    per-tool symlinks. No runtime coupling to shell repo or any specific LLM tool.
  structure:
    config/workflows: Workflow schemas (feature, bugfix, chore, spike, bootstrap)
    config/steps: Step contracts — YAML spec for each workflow step
    config/templates: Output templates per workflow type
    ui/dashboard: Live metrics UI (FastAPI; `make dashboard` or `orchestrator dashboard`)
    agents: Agent definitions (developer, reviewer, architect, discoverer, etc.)
    skills: Skill definitions (orchestrate, specify, implement, learn, autopilot, etc.)
    install.sh: Per-tool symlink installer (Claude Code, Cursor, Codex CLI, etc.)
    guidelines.yaml: LLM-driven workflow selection (replaces keyword matching)
    spec: Per-project workflow config (this file)

gotchas:
  - install.sh uses ln -sf to re-point existing symlinks — running make setup from the worktree sets ORCHESTRATOR_HOME to the worktree path, not the main repo. Always run make setup from ~/code/orchestrator after merge.

learnings:
  - id: workflow-plan-upfront
    learned: 2026-04-09
    rule: Write full workflow_plan (all phases + pre-filtered steps) to state.yaml at init time. Advance by reading state.yaml, never by reconstructing from schema in memory.
  - id: file-level-symlinks
    learned: 2026-04-09
    rule: Use file-level symlinks for agents (.md per file) and skill-dir-level symlinks for skills (one per skill directory). Directory-level symlinks silently skip re-pointing when the target changes.
  - id: autopilot-must-complete
    learned: 2026-04-11
    rule: Autopilot iterations must run the full workflow including the complete phase (learn + metrics). Skipping the complete phase breaks the self-improving feedback loop and loses per-feature telemetry data.
  - id: metrics-db-derived
    learned: 2026-04-17
    summary: >
      Cross-repo metrics are best derived at bootstrap time via a single script that
      walks spec/changes/archive/*/state.yaml and upserts into a local DuckDB database.
      This avoids per-step instrumentation while enabling SQL-based trend analysis across
      all registered repos.
    evidence: spec/changes/archive/cross-repo-metrics-duckdb (feature cross-repo-metrics-duckdb)
    rule: >
      Use a single wide features table keyed on (repo_root, change_id) with explicit
      typed columns and a payload_json VARCHAR for the full state.yaml content.
      Never use read_json_auto for ingest — type drift across DuckDB versions breaks
      re-runs. Use INSERT OR REPLACE for idempotent upserts. Escape all SQL-interpolated
      values via sql_quote and enforce change_id slug guard before any INSERT.
  - id: design-divergence-from-backlog
    learned: 2026-04-17
    rule: >
      When design-exploration selects an approach that diverges from the backlog idea.md
      intent (e.g., per-repo default vs fleet-wide default), spec.md must explicitly
      document the divergence with rationale. The reviewer accepts the divergence by
      name — undocumented divergence is a spec compliance finding.
  - id: composite-pk-audit-trail
    learned: 2026-04-18
    source: subprocess-per-step-observability
    rule: >
      When an audit table may legitimately have multiple terminal rows per
      logical attempt (e.g. escalation then completion), include the status
      column in the composite primary key. Pure (entity, attempt) keys silently
      overwrite the escalation row.
  - id: inline-steps-are-tokenless
    learned: 2026-04-18
    source: subprocess-per-step-observability
    rule: >
      Script steps have agent=None (no sentinel string). Per-step token capture
      is not attempted for None-agent steps; the DuckDB agent column is NULL for
      script steps. Per-step token attribution requires subprocess-per-step execution.
  - id: cross-artifact-drift-requires-atomic-edits
    learned: 2026-04-18
    source: subprocess-per-step-observability
    rule: >
      When editing a name or identifier that appears in multiple prose artifacts
      (spec.md, design.md, tasks.md), grep all artifacts for every variant before
      committing any single edit. Prose artifacts duplicate structural facts;
      editing one without checking the others is a latent drift source.
  - id: bash-fragility-prefer-python-for-new-code
    learned: 2026-04-18
    source: subprocess-per-step-observability
    rule: >
      For new YAML/JSON manipulation, state-machine logic, or arithmetic in this
      repo, write Python; reserve bash only for shell-native wrappers (PATH wiring,
      env var forwarding, process exec). Bash quoting and associative-array
      limitations (declare -A on bash 3.2) are a recurring bug source.
  - id: reviewer-retry-cost-is-atomic-vs-design
    learned: 2026-04-18
    source: subprocess-per-step-observability
    rule: >
      Scope review-gate fixes so each is resolvable in a single atomic commit.
      If a finding requires design revisit, surface it as a blocker before the
      review step rather than absorbing it mid-retry. Retries are cheap when
      findings are mechanically fixable; expensive when they expose architectural
      drift.
  - id: orchestrator-should-dispatch-not-execute
    learned: 2026-04-18
    source: subprocess-per-step-observability
    rule: >
      The orchestrator skill must be a pure dispatcher — it reads state and
      returns an action; cognitive or compute work runs in a named worker process,
      never inline in the orchestrator's own context. Steps that mix dispatch and
      execution are refactor candidates.
  - id: discoverer-cli-surface-inventory
    learned: 2026-04-20
    source: single-source-metrics-via-step-events
    rule: >
      For features that touch a CLI/script surface area (orchestrator
      subcommands, orchestrator_next/scripts/, bin/), the discovery phase must enumerate
      existing callables before design begins; undiscovered entrypoints become
      fix tasks post-review. T-23/T-24 added mid-flight because discoverer
      missed that `orchestrator ingest-driver` already existed.
  - id: no-budget-skip-feedback-loops
    learned: 2026-04-20
    source: single-source-metrics-via-step-events
    rule: >
      Autopilot must never skip run-learn-cycle or retro steps for 'session
      budget' reasons. These feed the self-improving loop; skipping them
      defeats autopilot's purpose. Budget pressure is a signal to stop
      earlier, not to skip learning.
  - id: shell-script-env-vars-match-python-canonical
    learned: 2026-04-20
    source: pricing-table-in-duckdb
    rule: >
      When a shell script reads an env var to locate a repo-managed path (DB file,
      config dir, state dir), the env var name MUST match the canonical name used
      by the Python layer (e.g. METRICS_DB, ORCHESTRATOR_HOME). Inventing a
      shell-only alias (e.g. ORCHESTRATOR_DB) creates a silent mismatch: the script
      falls back to a default path that differs from the Python-written path, causing
      integration tests to exercise the wrong fixture and regression bugs to go
      undetected until a smoke test. Grep the Python runtime (record.py, upsert.py,
      or the canonical entry point) for the env var name before wiring it in the
      shell script.
  - id: step-contract-input-key-schema-mismatch
    learned: 2026-05-22
    source: orc-66
    rule: >
      Step contracts that declare inputs: must use the key name that matches the
      producing step's declared outputs: for the target schema. When a step
      (e.g. design-and-draft-artifacts) is used by multiple schemas (feature,
      bugfix), and those schemas have different upstream producers with different
      output key names (discovery_result vs diagnosis_result), the contract may
      declare the wrong key and the mismatch is silent at plan time — the
      state.yaml node is promoted with the wrong input key and requires a
      manual one-field edit mid-run. After adding or modifying a schema,
      grep all step contracts for inputs: and verify each key exists as an
      output: in the upstream step for that schema.
  - id: specify-phase-scope-churn-cost
    learned: 2026-05-22
    source: orc-66
    rule: >
      When the user clarifies or changes scope during the artifact review loop
      of design-and-draft-artifacts (auto=false), each revision cycle adds
      significant architect-model cost — ORC-66 had 4 review rounds, spending
      ~$74 on specify vs ~$66 on 18 implement tasks. In interactive mode,
      cost-conscious users should front-load scope constraints in the initial
      description rather than refining through the artifact review loop.
      Discovery.md should explicitly surface ambiguous scope dimensions as
      "open questions" so the user can resolve them before the architect spawns.
  - id: worktree-state-dir-path
    learned: 2026-05-22
    source: orc-66
    rule: >
      When flags.worktree=true, the state directory lives at
      spec/changes/<change_id>/ inside the worktree, NOT at the worktree root.
      ORCHESTRATOR_WORKFLOW_DIR must be set to the state subdirectory
      (e.g. $WORKTREE_PATH/spec/changes/$CHANGE_ID), not the worktree root.
      Passing the worktree root causes the preview-route step (estimate-cost)
      to fail with "state.yaml not found" — the estimator
      falls back to estimate_unavailable and the cost preview is silently lost.
      This affects any inline step that locates state.yaml via ORCHESTRATOR_WORKFLOW_DIR.
  - id: pre-staged-impl-must-commit-before-review
    learned: 2026-05-29
    source: orc-96
    agents: [reviewer, architect]
    rule: >
      Implementation code written or staged before the workflow run starts is never
      automatically committed by the developer agent — the agent commits only the work
      it performs in its own task. If dispatch.py (or any file) was modified in the
      working tree before the first task runs, the tests will pass locally but the
      committed HEAD will be missing the implementation. Phase review will catch this
      as CF-1 (tests without implementation). The fix is: commit any pre-staged working-
      tree edits before starting the workflow, or include an explicit commit-it task as
      the first task after test tasks. Reviewer: verify `git diff HEAD -- <impl_file>`
      is empty for every file listed in tasks.yaml.files before scoring.
  - id: sentinel-removal-check-dbl-schema-constraints
    learned: 2026-05-31
    source: orc-77
    rule: >
      When migrating a sentinel string value to None/NULL, check all DDL and schema
      definitions (e.g. upsert.py CREATE TABLE, any VARCHAR NOT NULL columns) for the
      affected field before finalising the task list. A task that changes code to emit
      None (e.g. record.py) and a task that migrates fixtures to omit the sentinel field
      must be accompanied by a task that drops NOT NULL constraints on the corresponding
      DB column — or both belong in the same task's file list. Missing the DDL update
      produces a ConstraintException at upsert time discovered only after phase review.
  - id: sentinel-removal-grep-shell-fallbacks
    learned: 2026-05-31
    source: orc-77
    rule: >
      When removing a sentinel string from Python code, grep all shell scripts in the
      repo for both the sentinel value AND any fallback/default expressions referencing
      it (e.g. `jq '.agent // "inline"'`, `[ "$AGENT" != "inline" ]`). Shell scripts
      that use the sentinel as a fallback or comparison silently misbehave after removal:
      the fallback activates unconditionally and the comparison becomes dead code. Include
      these shell files in the task's file list or add a separate task targeting them.
  - id: worktree-branch-sync
    learned: 2026-05-22
    source: orc-78
    rule: >
      When running worktree-based workflows (flags.worktree=true), the worktree branch
      can fall behind main if the user commits directly to the main repo between workflow
      init and the complete phase. At complete phase, check that the worktree branch is
      up-to-date with origin/main before proceeding — a fast-forward divergence at this
      point requires reconciliation before merge and can introduce unreviewable commits
      onto the feature branch. Run `git log worktree-branch..main --oneline` as a
      pre-check; if non-empty, pause and surface the divergence to the user.
  - id: external-benchmark-references
    learned: 2026-04-20
    kind: informational
    summary: >
      Reference values for comparing our workflow metrics against public
      coding-benchmark leaderboards, as of April 2026. Used by the telemetry
      dashboard to populate the "external benchmark" column in the per-feature
      table.
    data:
      swe_bench_verified:
        resolve_rate: "80.9% (Opus 4.5)"
        cost_per_task: "$0.05–$0.75"
        note: "500 diverse GitHub issues; no structured spec — expect our rate higher"
      aider_polyglot:
        resolve_rate: "88% (GPT-5)"
        cost_per_task: "—"
      devin:
        pr_merge_rate: "67%"
        cost_per_task: "$2.25/ACU"
    caveats: >
      Our cost includes full workflow overhead (discovery, spec, review), not
      just implementation — direct comparison is unfair to our numbers. Refresh
      these when benchmark leaderboards update; stale numbers are worse than no
      numbers.

context:
  tech_stack: [bash, zsh, yaml, duckdb, yq, python]
  conventions:
    - Minimal diffs.
    - Spec-first workflow.
    - Evidence-based completion claims.
    - Keep workflow rules agent-agnostic — no tool-specific instructions in schemas or steps.
    - ORCHESTRATOR_HOME is the canonical env var (replacing SPEC_HOME from shell repo).

verify_commands:
  test: pytest config/scripts/orchestrator_next/tests/ -q

quality_bar:
  min_phase_review_score: 9
  max_retry_rounds: 8
  max_spawn_failures: 3
  scoring:
    critical_cap: 5
    important_cap: 7
    green_base: 9.25  # auto-adjusted 2026-05-29 from 9.0 (avg: 9.6, retry: 0%)

storage:
  active_changes_root: $REPO_ROOT/spec/changes
  repo_archive_root: spec/changes/archive
  archive_on:
    - merged_to_main
    - user_signoff_approved

state_contract:
  file: $WORKFLOW_STATE_DIR/$CHANGE_ID/state.yaml
  required: [schema, flags]
  merge_precedence: [cli_flags, state_flags, schema_defaults]

schemas:
  - feature
  - bugfix
  - chore
  - spike

signoff_policy:
  specify: required
  diagnose: required
  implement: required
  complete: required

rules:
  - id: evidence-based
    rule: Never claim completion without running verification. Show output.
  - id: minimal-diffs
    rule: Keep changes scoped to the current task. No "while I'm here" improvements.
  - id: spec-first
    rule: Artifacts must exist before implementation begins.
  - id: state-sync
    rule: Update state.yaml after every step. This enables pause/resume.
  - id: retry-limit
    rule: Max 3 retry attempts per step. After that, pause and report.
  - id: signoff-required
    rule: User approval required at phase boundaries per signoff_policy.
  - id: agent-agnostic
    rule: Schemas and step contracts must not reference any specific LLM tool. All tool-specific wiring belongs in install.sh or per-tool config.
  - id: post-review-cleanup-commits
    learned: 2026-05-23
    source: orc-71
    rule: >
      Non-blocking suggestions raised by run-phase-review (e.g. deprecation cleanup,
      follow-up sweeps) have no defined step in the feature workflow. When acted on,
      commit them as separate chore(<change_id>) commits after run-phase-review passes
      and outside the task loop — never fold them into a task's diff or treat them as
      silent ground-truth changes. The phase review verdict still reflects pre-cleanup
      state.
  - id: fixture-corruption-from-dispatcher
    learned: 2026-05-31
    source: orc-107
    rule: >
      Test fixture YAML files under tests/fixtures/ that share a state.yaml-like
      structure (step_history, next_step, etc.) are picked up and mutated by the
      orchestrator dispatcher's step_start writer when the orchestrator runs from
      the worktree root. This is not a code bug in the feature being developed —
      it is a side effect of the dispatcher's glob pattern matching any YAML with
      the expected shape. Reviewer: before scoring, run `git diff HEAD --
      tests/fixtures/` and restore any mutated fixtures with `git checkout HEAD --
      tests/fixtures/`. Do not count fixture dirt as a code finding against the
      feature under review.
  - id: xfail-cleanup-is-part-of-tdd-task
    learned: 2026-05-31
    source: orc-108
    rule: >
      In TDD workflows, RED-phase tests written with @pytest.mark.xfail(strict=False)
      must have those markers removed as part of the final integration-gate task
      (the GREEN-confirmation / phase-gate task), not left as a non-blocking
      follow-up. xpassing tests with xfail markers still present are a correctness
      signal that the test suite is harder to read and trust. Include the marker
      removal in the task's file list and verify commands — the integration-gate task
      is the natural home since it confirms full GREEN state.
  - id: capture-test-baseline-path-must-match-project-yaml
    learned: 2026-05-31
    source: orc-108
    rule: >
      The capture-test-baseline inline script uses a hardcoded test path
      (config/scripts/orchestrator_next/tests/) that diverges from the canonical
      path in project.yaml verify_commands.test (orchestrator_next/tests/). When
      the paths diverge, the baseline step silently fails with exit_code 4 ("file
      or directory not found") and the baseline is recorded as skipped/unparseable.
      The capture-test-baseline script should read the test path from project.yaml
      verify_commands.test rather than hardcoding it, so the baseline is always
      consistent with the project's canonical test runner.
  - id: complete-phase-is-a-separate-workflow
    learned: 2026-05-31
    source: orc-108
    superseded_by: b0165d6
    rule: >
      feature.yaml and bugfix.yaml pause at ticket-qa; the complete-phase tail
      (run-learn-cycle through ticket-done) lives in complete.yaml and runs as a
      SEPARATE `orchestrator complete <slug>` invocation — it is NOT appended to
      the feature/bugfix schema tails. (ORC-108 briefly declared the tail
      statically in feature/bugfix, but b0165d6 reverted that: a re-run of a
      QA-paused feature should not re-trigger the finish spine.) Each schema is
      self-contained and declares its own steps; there is no runtime injection
      (complete_phase.py was deleted). check-implement-complete.py guards against
      premature `orchestrator complete` invocations.
