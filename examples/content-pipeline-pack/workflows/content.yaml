description: >-
  Turn a content brief into an edited, publish-ready draft. Runs with no git
  branch and no worktree — artifacts land under $REPO_ROOT/spec/changes/<id>/.
steps:
  - intake-brief # shell: resolve <id> to brief.md in the artifact dir
  - prompt: content-outline
  - prompt: content-draft
  - id: content-edit
    prompt: content-edit
    on_failure: content-draft
    max_retries: 2
  - prompt: content-learn
